{% if page.title %}
<header class="page-hero{% if page.bigimg %} page-hero--image{% endif %}"{% if page.bigimg %} style="--hero-image: url('{{ page.bigimg | prepend: site.baseurl }}')"{% endif %}>
  <div class="hero-inner">
    {% if include.type == "page" and page.url == "/" %}<p class="hero-eyebrow">THOUGHTS · NOTES · LIFE</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="hero-subtitle">{{ page.subtitle }}</p>{% endif %}
    {% if include.type == "post" %}<p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y 年 %-m 月 %-d 日" }}</time></p>{% endif %}
  </div>
</header>
{% endif %}
