<footer class="site-footer">
  <div class="footer-inner">
    <p class="footer-note">记录阅读、技术与生活中的片刻所得。</p>
    <nav class="footer-links" aria-label="社交链接">
      {% if site.social-network-links.github %}<a href="https://github.com/{{ site.social-network-links.github }}">GitHub</a>{% endif %}
      {% if site.social-network-links.email %}<a href="mailto:{{ site.social-network-links.email }}">Email</a>{% endif %}
      {% if site.social-network-links.rss %}<a href="{{ '/feed.xml' | prepend: site.baseurl }}">RSS</a>{% endif %}
    </nav>
    <p class="copyright">© {{ site.time | date: '%Y' }} {{ site.author.name }}</p>
  </div>
</footer>
