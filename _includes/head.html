<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% if page.use-site-title %}{{ site.title }} {{ site.title-separator }} {{ site.description }}{% elsif page.title %}{{ page.title }} {{ site.title-separator }} {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="author" content="{{ site.author.name }}">
  <meta name="description" content="{% if page.subtitle %}{{ page.subtitle | strip_html | escape }}{% else %}{{ site.description | escape }}{% endif %}">
  <meta name="theme-color" content="#f6f3ed">
  <link rel="canonical" href="{{ site.url }}{{ page.url | replace: 'index.html', '' }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | prepend: site.baseurl }}">
  <link rel="icon" href="{{ '/favicon.ico' | prepend: site.baseurl }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.subtitle | default: site.description | strip_html | escape }}">
  <meta property="og:type" content="{% if page.id %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  {% if page.share-img %}<meta property="og:image" content="{{ page.share-img }}">{% elsif site.avatar %}<meta property="og:image" content="{{ site.url }}{{ site.avatar }}">{% endif %}
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cn-fontsource-source-han-serif-sc-vf-regular@1.0.1/font.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css">
  {% for css in layout.common-css %}<link rel="stylesheet" href="{{ css | prepend: site.baseurl }}">{% endfor %}
  {% for css in page.css %}<link rel="stylesheet" href="{{ css | prepend: site.baseurl }}">{% endfor %}
  {% if page.id %}<script>window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>{% endif %}
</head>
