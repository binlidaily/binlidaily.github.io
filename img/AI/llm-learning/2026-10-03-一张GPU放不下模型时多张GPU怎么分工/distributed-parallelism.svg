<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="t d"><title id="t">多 GPU 并行方式</title><desc id="d">比较数据并行、张量并行、流水线并行和 ZeRO FSDP 分别拆分什么。</desc><defs><linearGradient id="h"><stop stop-color="#10233f"/><stop offset="1" stop-color="#285382"/></linearGradient><filter id="s"><feDropShadow dy="6" stdDeviation="8" flood-color="#233753" flood-opacity=".11"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#172b45}.w{fill:#fff}.l{fill:#d8e6f6}.m{fill:#61738a}.b{fill:#326fc3}.g{fill:#238d7e}.o{fill:#c76b32}.h1{font-size:36px;font-weight:700}.h2{font-size:21px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.c{text-anchor:middle}</style></defs><rect width="1600" height="700" rx="24" fill="#f2f6fa"/><path d="M24 0h1552a24 24 0 0 1 24 24v105H0V24A24 24 0 0 1 24 0z" fill="url(#h)"/><text x="50" y="55" class="h1 w">多张 GPU 怎么分工？关键看“拆什么”</text><text x="50" y="88" class="body l">拆 Batch、拆层内矩阵、拆模型层，或拆参数与训练状态</text><g filter="url(#s)"><rect x="50" y="150" width="350" height="330" rx="16" fill="#fff"/><rect x="434" y="150" width="350" height="330" rx="16" fill="#fff"/><rect x="818" y="150" width="350" height="330" rx="16" fill="#fff"/><rect x="1202" y="150" width="348" height="330" rx="16" fill="#fff"/></g><text x="225" y="190" class="h2 b c">数据并行 · 拆 Batch</text><text x="609" y="190" class="h2 b c">张量并行 · 拆一层</text><text x="993" y="190" class="h2 g c">流水线并行 · 拆层</text><text x="1376" y="190" class="h2 o c">ZeRO / FSDP · 拆状态</text><g class="c"><rect x="95" y="225" width="115" height="72" rx="10" fill="#edf4fc"/><rect x="240" y="225" width="115" height="72" rx="10" fill="#edf4fc"/><text x="152" y="254" class="small">完整模型</text><text x="152" y="279" class="small b">Batch A</text><text x="297" y="254" class="small">完整模型</text><text x="297" y="279" class="small b">Batch B</text><text x="225" y="340" class="body">各卡独立前后向</text><text x="225" y="377" class="body">All-Reduce 梯度</text><text x="225" y="438" class="small m">简单高效，但模型仍需单卡放下</text><rect x="480" y="225" width="115" height="72" rx="10" fill="#edf4fc"/><rect x="625" y="225" width="115" height="72" rx="10" fill="#edf4fc"/><text x="537" y="255" class="body mono">W₀</text><text x="682" y="255" class="body mono">W₁</text><text x="609" y="340" class="body">共同计算同一层</text><text x="609" y="377" class="body">合并局部结果</text><text x="609" y="438" class="small m">单层可超大，但通信频繁</text><rect x="860" y="225" width="90" height="72" rx="10" fill="#eaf7f4"/><rect x="957" y="225" width="90" height="72" rx="10" fill="#eaf7f4"/><rect x="1054" y="225" width="70" height="72" rx="10" fill="#eaf7f4"/><text x="905" y="255" class="small">L1–8</text><text x="1002" y="255" class="small">L9–16</text><text x="1089" y="255" class="small">L17+</text><text x="993" y="340" class="body">Micro Batch 依次流过</text><text x="993" y="377" class="body">不同阶段同时工作</text><text x="993" y="438" class="small m">能拆深模型，但存在 Bubble</text><rect x="1245" y="225" width="82" height="72" rx="10" fill="#fff2e9"/><rect x="1335" y="225" width="82" height="72" rx="10" fill="#fff2e9"/><rect x="1425" y="225" width="82" height="72" rx="10" fill="#fff2e9"/><text x="1286" y="255" class="small">Shard 0</text><text x="1376" y="255" class="small">Shard 1</text><text x="1466" y="255" class="small">Shard 2</text><text x="1376" y="340" class="body">分片参数/梯度/状态</text><text x="1376" y="377" class="body">计算时临时聚合</text><text x="1376" y="438" class="small m">省显存，但增加通信与调度</text></g><g filter="url(#s)"><rect x="160" y="535" width="1280" height="105" rx="16" fill="#fff"/></g><text x="200" y="580" class="h2">现实方案：组合并行</text><text x="520" y="580" class="body b">节点之间 Data Parallel / FSDP</text><text x="920" y="580" class="body g">节点内部 Tensor Parallel</text><text x="1240" y="580" class="body o">模型很深再加 Pipeline</text><text x="800" y="620" class="small m c">并行不是越多越好：目标是让每张 GPU 有事可做，同时尽量减少通信和等待。</text><text x="800" y="678" class="body m c">加速比取决于计算、通信、负载均衡与硬件互联，而不只取决于 GPU 数量。</text></svg>
