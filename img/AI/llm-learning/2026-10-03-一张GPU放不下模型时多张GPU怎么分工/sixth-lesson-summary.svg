<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="t d"><title id="t">大模型第六课复习总图</title><desc id="d">总结四种多 GPU 并行方式、通信操作和方案选择。</desc><defs><linearGradient id="h"><stop stop-color="#10233f"/><stop offset="1" stop-color="#285382"/></linearGradient><filter id="s"><feDropShadow dy="5" stdDeviation="8" flood-color="#233753" flood-opacity=".1"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#172b45}.w{fill:#fff}.l{fill:#d8e6f6}.m{fill:#61738a}.b{fill:#326fc3}.g{fill:#238d7e}.h1{font-size:36px;font-weight:700}.h2{font-size:22px;font-weight:700}.h3{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.c{text-anchor:middle}</style></defs><rect width="1600" height="820" rx="24" fill="#f2f6fa"/><path d="M24 0h1552a24 24 0 0 1 24 24v112H0V24A24 24 0 0 1 24 0z" fill="url(#h)"/><text x="50" y="58" class="h1 w">大模型第六课：多张 GPU 怎么分工？</text><text x="50" y="94" class="body l">复习总图 · 先问拆什么，再权衡显存、通信与等待</text><text x="52" y="160" class="h2">01　四种拆分方式</text><g filter="url(#s)"><rect x="52" y="186" width="360" height="190" rx="16" fill="#fff"/><rect x="432" y="186" width="360" height="190" rx="16" fill="#fff"/><rect x="812" y="186" width="360" height="190" rx="16" fill="#fff"/><rect x="1192" y="186" width="356" height="190" rx="16" fill="#fff"/></g><text x="82" y="228" class="h3 b">数据并行</text><text x="82" y="270" class="body">拆 Batch，复制完整模型</text><text x="82" y="306" class="body">All-Reduce 同步梯度</text><text x="82" y="348" class="small m">模型必须能放进单卡</text><text x="462" y="228" class="h3 b">张量并行</text><text x="462" y="270" class="body">拆同一层的大矩阵</text><text x="462" y="306" class="body">各卡合并局部计算</text><text x="462" y="348" class="small m">依赖高速卡间互联</text><text x="842" y="228" class="h3 g">流水线并行</text><text x="842" y="270" class="body">拆不同 Transformer 层</text><text x="842" y="306" class="body">Micro Batch 流过各阶段</text><text x="842" y="348" class="small m">注意 Bubble 与负载均衡</text><text x="1222" y="228" class="h3 g">ZeRO / FSDP</text><text x="1222" y="270" class="body">拆参数、梯度、优化器状态</text><text x="1222" y="306" class="body">需要时临时 All-Gather</text><text x="1222" y="348" class="small m">显著省显存，通信更多</text><text x="52" y="438" class="h2">02　通信操作</text><g filter="url(#s)"><rect x="52" y="464" width="1496" height="130" rx="16" fill="#fff"/></g><text x="92" y="507" class="h3 b">All-Reduce</text><text x="92" y="548" class="small m">汇总并复制结果</text><text x="398" y="507" class="h3 b">All-Gather</text><text x="398" y="548" class="small m">收集分片成为完整数据</text><text x="750" y="507" class="h3 g">Reduce-Scatter</text><text x="750" y="548" class="small m">求和后分片发回</text><text x="1140" y="507" class="h3 g">Send / Receive</text><text x="1140" y="548" class="small m">流水线阶段间传输激活</text><text x="52" y="650" class="h2">03　选择顺序</text><g filter="url(#s)"><rect x="52" y="676" width="1496" height="92" rx="16" fill="#fff"/></g><text x="90" y="720" class="body"><tspan class="b">①</tspan> 单卡是否放得下？</text><text x="390" y="720" class="body"><tspan class="b">②</tspan> 哪一项占显存最多？</text><text x="735" y="720" class="body"><tspan class="g">③</tspan> 卡间带宽够不够？</text><text x="1075" y="720" class="body"><tspan class="g">④</tspan> 各卡能否保持忙碌？</text><text x="800" y="752" class="small m c">大型训练常组合 DP / FSDP + TP + PP，也就是所谓 3D Parallelism。</text><text x="800" y="802" class="body m c">多卡的价值不是简单复制算力，而是用合适的拆法同时解决容量和速度问题。</text></svg>
