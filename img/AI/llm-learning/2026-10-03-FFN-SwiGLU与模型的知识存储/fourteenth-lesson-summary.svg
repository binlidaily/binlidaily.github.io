<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="t d"><title id="t">FFN 与 SwiGLU 第十四课复习总图</title><desc id="d">总结 FFN 的逐 Token 加工、非线性、SwiGLU 门控、知识存储视角和计算成本</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#0e223c"/><stop offset="1" stop-color="#2a638f"/></linearGradient><filter id="s"><feDropShadow dy="6" stdDeviation="9" flood-color="#173550" flood-opacity=".11"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#142b44}.w{fill:#fff}.muted{fill:#607489}.title{font-size:38px;font-weight:750}.sub{font-size:19px}.h2{font-size:23px;font-weight:700}.h3{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:14px}.blue{fill:#2f73b7}.orange{fill:#e3763d}.purple{fill:#7057c5}</style></defs><rect width="1600" height="1080" rx="28" fill="#f4f7fa"/><path d="M28 0h1544a28 28 0 0 1 28 28v138H0V28A28 28 0 0 1 28 0z" fill="url(#g)"/><text x="58" y="62" class="title w">第 14 课复习：FFN 与 SwiGLU</text><text x="58" y="103" class="sub" fill="#d8e7f5">主线：Attention 收集上下文 → FFN 逐 Token 加工 → 门控选择特征 → 写回残差流</text><g filter="url(#s)"><rect x="50" y="180" width="1500" height="150" rx="22" fill="#fff"/><rect x="50" y="365" width="475" height="330" rx="22" fill="#eaf2fb"/><rect x="562" y="365" width="475" height="330" rx="22" fill="#f0edfb"/><rect x="1074" y="365" width="476" height="330" rx="22" fill="#fff0e7"/><rect x="50" y="735" width="730" height="285" rx="22" fill="#fff"/><rect x="820" y="735" width="730" height="285" rx="22" fill="#fff"/></g><text x="80" y="222" class="h2">先分工</text><rect x="205" y="204" width="550" height="82" rx="18" fill="#eaf2fb"/><text x="480" y="239" class="h3 blue" text-anchor="middle">Attention：跨 Token 取信息</text><text x="480" y="268" class="small muted" text-anchor="middle">谁应该看谁、从前文取回什么</text><text x="800" y="254" class="h2" text-anchor="middle">→</text><rect x="845" y="204" width="625" height="82" rx="18" fill="#f0edfb"/><text x="1158" y="239" class="h3 purple" text-anchor="middle">FFN：每个 Token 独立加工</text><text x="1158" y="268" class="small muted" text-anchor="middle">识别、筛选、组合当前表示里的特征</text>
<text x="80" y="410" class="h2">经典 FFN</text><text x="80" y="452" class="body">x → 升维 → 激活 → 降维</text><text x="80" y="500" class="h3 blue">为什么升维？</text><text x="80" y="535" class="body">在更宽空间里放置更多特征探测器</text><text x="80" y="582" class="h3 blue">为什么非线性？</text><text x="80" y="617" class="body">没有激活，两个矩阵仍等于一个矩阵</text><text x="80" y="660" class="small muted">每个位置共享同一套参数，但彼此不交流</text>
<text x="592" y="410" class="h2">SwiGLU</text><text x="592" y="452" class="body">SiLU(W_gate x) ⊙ (W_up x)</text><text x="592" y="500" class="h3 purple">Up 支路</text><text x="592" y="535" class="body">产生候选内容：这里有什么特征</text><text x="592" y="582" class="h3 purple">Gate 支路</text><text x="592" y="617" class="body">产生调节信号：让特征通过多少</text><text x="592" y="660" class="small muted">连续旋钮，不是 0/1 开关；最后 W_down 降维</text>
<text x="1104" y="410" class="h2">“知识存储”视角</text><text x="1104" y="452" class="body">匹配输入模式 → 激活若干方向 → 写回表示</text><text x="1104" y="500" class="h3 orange">有用的类比</text><text x="1104" y="535" class="body">第一层像模式 Key，第二层像 Value</text><text x="1104" y="582" class="h3 orange">必须保留的边界</text><text x="1104" y="617" class="body">知识是分布式的，不是一条事实一个神经元</text><text x="1104" y="660" class="small muted">召回仍依赖上下文、Attention、残差流与多层协作</text>
<text x="80" y="783" class="h2">形状与成本</text><text x="80" y="830" class="body">输入 / 输出： [B, T, d_model]</text><text x="80" y="870" class="body">中间表示：　 [B, T, d_ff]</text><text x="80" y="910" class="body">经典 FFN：up + down 两个大投影</text><text x="80" y="950" class="body">SwiGLU：gate + up + down 三个投影</text><text x="80" y="985" class="small muted">通常调整 d_ff，避免参数量无控制地增加</text>
<text x="850" y="783" class="h2">一句话记忆</text><text x="850" y="835" class="body"><tspan font-weight="700">Attention</tspan>：把别处的信息拿过来</text><text x="850" y="877" class="body"><tspan font-weight="700">FFN</tspan>：加工当前位置的表示</text><text x="850" y="919" class="body"><tspan font-weight="700">SwiGLU</tspan>：多一条门控支路来筛选特征</text><text x="850" y="961" class="body"><tspan font-weight="700">知识</tspan>：FFN 参与存取，但分散在整个网络中</text><rect x="1245" y="817" width="245" height="125" rx="18" fill="#edf4fa"/><text x="1368" y="858" class="h3" text-anchor="middle">下一步：MoE</text><text x="1368" y="891" class="small muted" text-anchor="middle">把一组 FFN</text><text x="1368" y="916" class="small muted" text-anchor="middle">扩展成多个专家</text><text x="800" y="1060" class="small muted" text-anchor="middle">Communicate → Transform → Gate → Write Back</text></svg>
