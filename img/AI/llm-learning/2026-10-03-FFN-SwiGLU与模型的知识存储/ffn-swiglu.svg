<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">FFN 与 SwiGLU 的工作流程</title><desc id="d">Attention 负责 Token 间交流，SwiGLU 对每个 Token 独立进行升维、门控、相乘和降维</desc><defs><linearGradient id="h" x2="1" y2="1"><stop stop-color="#10233f"/><stop offset="1" stop-color="#285f8c"/></linearGradient><filter id="s"><feDropShadow dy="6" stdDeviation="9" flood-color="#173753" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#5f85a9"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#152b43}.w{fill:#fff}.muted{fill:#60758a}.title{font-size:38px;font-weight:750}.sub{font-size:20px}.h2{font-size:24px;font-weight:700}.h3{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:14px}.blue{fill:#2f74b9}.orange{fill:#e7773d}.purple{fill:#7057c5}.line{fill:none;stroke:#5f85a9;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1600" height="900" rx="28" fill="#f4f7fa"/><path d="M28 0h1544a28 28 0 0 1 28 28v142H0V28A28 28 0 0 1 28 0z" fill="url(#h)"/><text x="58" y="66" class="title w">Attention 之后，每个 Token 还要做什么？</text><text x="58" y="108" class="sub" fill="#d8e7f5">Attention 负责交流，SwiGLU FFN 负责逐位置识别、筛选和重组特征</text>
<g filter="url(#s)"><rect x="50" y="195" width="420" height="610" rx="22" fill="#fff"/><rect x="505" y="195" width="1045" height="610" rx="22" fill="#fff"/></g>
<text x="80" y="242" class="h2">先分清两种工作</text><rect x="80" y="285" width="360" height="170" rx="18" fill="#eaf2fb"/><text x="105" y="325" class="h3 blue">Attention · 跨 Token</text><text x="105" y="366" class="body">“苹果”从“我”“喜欢”取回信息</text><g><rect x="105" y="394" width="74" height="38" rx="12" fill="#cfe2f5"/><rect x="222" y="394" width="74" height="38" rx="12" fill="#cfe2f5"/><rect x="339" y="394" width="74" height="38" rx="12" fill="#cfe2f5"/><text x="142" y="419" class="small" text-anchor="middle">我</text><text x="259" y="419" class="small" text-anchor="middle">喜欢</text><text x="376" y="419" class="small" text-anchor="middle">苹果</text><path d="M142 390Q259 335 376 390" class="line"/><path d="M259 390Q318 358 376 390" class="line"/></g><rect x="80" y="490" width="360" height="240" rx="18" fill="#f0edfb"/><text x="105" y="530" class="h3 purple">FFN · 逐 Token</text><text x="105" y="570" class="body">三个位置独立使用同一套参数</text><text x="105" y="618" class="body">我　　→ FFN → 新表示</text><text x="105" y="658" class="body">喜欢　→ FFN → 新表示</text><text x="105" y="698" class="body">苹果　→ FFN → 新表示</text>
<text x="535" y="242" class="h2">SwiGLU：两条支路，一扇连续可调的门</text><rect x="550" y="375" width="145" height="84" rx="18" fill="#eaf2fb"/><text x="623" y="407" class="h3 blue" text-anchor="middle">输入 x</text><text x="623" y="437" class="small muted" text-anchor="middle">d_model</text><path d="M695 417H780" class="line"/><circle cx="805" cy="417" r="8" fill="#5f85a9"/><path d="M805 417V315H895" class="line"/><path d="M805 417V520H895" class="line"/>
<rect x="910" y="270" width="230" height="94" rx="18" fill="#eeeafa"/><text x="1025" y="307" class="h3 purple" text-anchor="middle">Gate 支路</text><text x="1025" y="338" class="body" text-anchor="middle">SiLU(W_gate x)</text><rect x="910" y="475" width="230" height="94" rx="18" fill="#fff0e7"/><text x="1025" y="512" class="h3 orange" text-anchor="middle">Up 支路</text><text x="1025" y="543" class="body" text-anchor="middle">W_up x</text><path d="M1140 317H1223V400" class="line"/><path d="M1140 522H1223V438" class="line"/><circle cx="1223" cy="419" r="38" fill="#e7eef5"/><text x="1223" y="427" class="h2" text-anchor="middle">⊙</text><text x="1223" y="480" class="small muted" text-anchor="middle">逐元素相乘</text><path d="M1261 419H1320" class="line"/><rect x="1335" y="375" width="165" height="88" rx="18" fill="#e8f4ef"/><text x="1418" y="408" class="h3" text-anchor="middle" fill="#247b63">W_down</text><text x="1418" y="438" class="small muted" text-anchor="middle">回到 d_model</text>
<rect x="600" y="660" width="850" height="82" rx="20" fill="#edf4fa"/><text x="1025" y="695" class="body" text-anchor="middle"><tspan font-weight="700">内容支路：</tspan>有什么特征　　<tspan font-weight="700">门控支路：</tspan>让这些特征通过多少</text><text x="1025" y="726" class="small muted" text-anchor="middle">门是连续旋钮，不是只能开或关的二进制开关</text><text x="800" y="858" class="small muted" text-anchor="middle">同一套参数 · 每个位置独立计算 · 输出写回残差流</text></svg>
