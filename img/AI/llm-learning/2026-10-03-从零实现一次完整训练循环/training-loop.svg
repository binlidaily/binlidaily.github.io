<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="t d"><title id="t">一次完整训练循环</title><desc id="d">展示 Batch、清梯度、Forward、Loss、Backward、梯度裁剪和 Optimizer Step 的顺序。</desc><defs><linearGradient id="h"><stop stop-color="#10233f"/><stop offset="1" stop-color="#285382"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#6180a6"/></marker><filter id="s"><feDropShadow dy="5" stdDeviation="7" flood-color="#233753" flood-opacity=".12"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#172b45}.w{fill:#fff}.l{fill:#d8e6f6}.m{fill:#61738a}.b{fill:#326fc3}.g{fill:#238d7e}.o{fill:#c76b32}.h1{font-size:36px;font-weight:700}.h2{font-size:21px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.c{text-anchor:middle}</style></defs><rect width="1600" height="720" rx="24" fill="#f2f6fa"/><path d="M24 0h1552a24 24 0 0 1 24 24v112H0V24A24 24 0 0 1 24 0z" fill="url(#h)"/><text x="50" y="58" class="h1 w">一次训练迭代：模型到底做了什么？</text><text x="50" y="94" class="body l">每个 Step 用一批数据完成一次预测、纠错和参数更新</text><g filter="url(#s)"><rect x="50" y="182" width="200" height="180" rx="17" fill="#fff"/><rect x="310" y="182" width="200" height="180" rx="17" fill="#fff"/><rect x="570" y="182" width="200" height="180" rx="17" fill="#fff"/><rect x="830" y="182" width="200" height="180" rx="17" fill="#fff"/><rect x="1090" y="182" width="200" height="180" rx="17" fill="#fff"/><rect x="1350" y="182" width="200" height="180" rx="17" fill="#fff"/></g><g stroke="#6180a6" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M255 272h43"/><path d="M515 272h43"/><path d="M775 272h43"/><path d="M1035 272h43"/><path d="M1295 272h43"/></g><g class="c"><text x="150" y="221" class="h2 b">1 · Batch</text><text x="150" y="265" class="body">输入 x　标签 y</text><text x="150" y="300" class="small m">形状都是 [B,T]</text><text x="150" y="334" class="small m">y 比 x 向后错一位</text><text x="410" y="221" class="h2 o">2 · 清梯度</text><text x="410" y="265" class="body">zero_grad()</text><text x="410" y="300" class="small m">移除上一步梯度</text><text x="410" y="334" class="small m">避免意外累积</text><text x="670" y="221" class="h2 g">3 · Forward</text><text x="670" y="265" class="body">logits = model(x)</text><text x="670" y="300" class="small m">[B,T] → [B,T,V]</text><text x="670" y="334" class="small m">当前参数给出预测</text><text x="930" y="221" class="h2 b">4 · Loss</text><text x="930" y="265" class="body">交叉熵</text><text x="930" y="300" class="small m">比较 logits 与 y</text><text x="930" y="334" class="small m">得到一个标量</text><text x="1190" y="221" class="h2 o">5 · Backward</text><text x="1190" y="265" class="body">loss.backward()</text><text x="1190" y="300" class="small m">沿计算图反向传播</text><text x="1190" y="334" class="small m">写入每个参数的 grad</text><text x="1450" y="221" class="h2 g">6 · Step</text><text x="1450" y="265" class="body">optimizer.step()</text><text x="1450" y="300" class="small m">裁剪后更新参数</text><text x="1450" y="334" class="small m">进入下一个 Batch</text></g><path d="M1450 382v64c0 42-35 76-77 76H227c-43 0-77-34-77-76v-64" fill="none" stroke="#326fc3" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#a)"/><text x="800" y="505" class="h2 b c">重复很多个 Step，参数逐渐让正确 Token 获得更高概率</text><g filter="url(#s)"><rect x="180" y="566" width="1240" height="100" rx="16" fill="#fff"/></g><text x="220" y="607" class="body"><tspan class="b">固定间隔：</tspan>打印 Loss 与吞吐　·　验证集评估　·　保存 Checkpoint　·　调整学习率</text><text x="800" y="645" class="small m c">Forward 负责预测，Backward 负责算梯度，Optimizer Step 才真正改变模型。</text></svg>
