<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="t d"><title id="t">大模型第八课复习总图</title><desc id="d">总结训练循环的数据、预测、损失、反向传播、参数更新和工程检查点。</desc><defs><linearGradient id="h"><stop stop-color="#10233f"/><stop offset="1" stop-color="#285382"/></linearGradient><filter id="s"><feDropShadow dy="5" stdDeviation="8" flood-color="#233753" flood-opacity=".1"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#172b45}.w{fill:#fff}.l{fill:#d8e6f6}.m{fill:#61738a}.b{fill:#326fc3}.g{fill:#238d7e}.o{fill:#c76b32}.h1{font-size:36px;font-weight:700}.h2{font-size:22px;font-weight:700}.h3{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.c{text-anchor:middle}</style></defs><rect width="1600" height="860" rx="24" fill="#f2f6fa"/><path d="M24 0h1552a24 24 0 0 1 24 24v112H0V24A24 24 0 0 1 24 0z" fill="url(#h)"/><text x="50" y="58" class="h1 w">大模型第八课：从零实现一次完整训练循环</text><text x="50" y="94" class="body l">复习总图 · 从一批 Token 到一次参数更新</text><text x="52" y="160" class="h2">01　核心链路</text><g filter="url(#s)"><rect x="52" y="186" width="1496" height="118" rx="16" fill="#fff"/></g><text x="105" y="238" class="h3 b">Batch</text><text x="270" y="238" class="h3">→</text><text x="380" y="238" class="h3 g">Forward</text><text x="575" y="238" class="h3">→</text><text x="680" y="238" class="h3 b">Loss</text><text x="825" y="238" class="h3">→</text><text x="955" y="238" class="h3 o">Backward</text><text x="1165" y="238" class="h3">→</text><text x="1360" y="238" class="h3 g">Optimizer Step</text><text x="800" y="278" class="small m c">取数据　→　预测　→　衡量误差　→　计算梯度　→　更新参数</text><text x="52" y="370" class="h2">02　每一步分别负责什么</text><g filter="url(#s)"><rect x="52" y="396" width="480" height="188" rx="16" fill="#fff"/><rect x="560" y="396" width="480" height="188" rx="16" fill="#fff"/><rect x="1068" y="396" width="480" height="188" rx="16" fill="#fff"/></g><text x="82" y="438" class="h3 b">预测与误差</text><text x="82" y="478" class="body">logits：[B,T,V]</text><text x="82" y="516" class="body">交叉熵比较 logits 与标签 y</text><text x="82" y="554" class="small m">Loss 是标量，越低通常越接近答案</text><text x="590" y="438" class="h3 o">梯度与更新</text><text x="590" y="478" class="body">backward()：计算 parameter.grad</text><text x="590" y="516" class="body">step()：根据梯度修改参数</text><text x="590" y="554" class="small m">两者不是同一件事</text><text x="1098" y="438" class="h3 g">清理与稳定</text><text x="1098" y="478" class="body">zero_grad()：避免意外累积</text><text x="1098" y="516" class="body">clip_grad_norm_()：限制大梯度</text><text x="1098" y="554" class="small m">混合精度按硬件选择 BF16 或 FP16</text><text x="52" y="650" class="h2">03　真实训练还要照看什么</text><g filter="url(#s)"><rect x="52" y="676" width="1496" height="122" rx="16" fill="#fff"/></g><text x="95" y="722" class="body"><tspan class="b">评估</tspan>　定期检查验证集</text><text x="430" y="722" class="body"><tspan class="g">日志</tspan>　Loss、学习率与吞吐</text><text x="800" y="722" class="body"><tspan class="o">保存</tspan>　模型、优化器与 Step</text><text x="1190" y="722" class="body"><tspan class="b">调度</tspan>　学习率与梯度累积</text><text x="800" y="768" class="small m c">验证使用 eval() 与 no_grad()；结束后记得切回 train()。</text><text x="800" y="840" class="body m c">Forward 产生预测，Backward 产生梯度，Optimizer Step 让模型真正学到一点。</text></svg>
