<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="t d"><title id="t">位置编码的作用与类型</title><desc id="d">展示 Token Embedding 与位置信息如何结合，并比较绝对位置和相对位置方法。</desc><defs><linearGradient id="h"><stop stop-color="#10233f"/><stop offset="1" stop-color="#285382"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#5d7da3"/></marker><filter id="s"><feDropShadow dy="5" stdDeviation="7" flood-color="#233753" flood-opacity=".12"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#172b45}.w{fill:#fff}.l{fill:#d8e6f6}.m{fill:#61738a}.b{fill:#326fc3}.g{fill:#238d7e}.o{fill:#c76b32}.h1{font-size:36px;font-weight:700}.h2{font-size:21px;font-weight:700}.h3{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.c{text-anchor:middle}</style></defs><rect width="1600" height="800" rx="24" fill="#f2f6fa"/><path d="M24 0h1552a24 24 0 0 1 24 24v112H0V24A24 24 0 0 1 24 0z" fill="url(#h)"/><text x="50" y="58" class="h1 w">位置编码：模型怎样知道 Token 的顺序？</text><text x="50" y="94" class="body l">内容告诉模型“是谁”，位置告诉模型“在哪里、相隔多远”</text><text x="52" y="164" class="h2">01　同一组 Token，不同顺序</text><g filter="url(#s)"><rect x="52" y="190" width="1496" height="150" rx="16" fill="#fff"/></g><text x="105" y="238" class="h3 b">序列 A</text><text x="275" y="238" class="body">我　喜欢　苹果</text><text x="680" y="238" class="small m">Position ID：0　1　2</text><text x="105" y="294" class="h3 o">序列 B</text><text x="275" y="294" class="body">苹果　喜欢　我</text><text x="680" y="294" class="small m">Position ID：0　1　2</text><text x="1130" y="266" class="h3 g">Token 相同，语义不同</text><text x="1130" y="300" class="small m">必须把顺序线索交给模型</text><text x="52" y="410" class="h2">02　两条信息进入模型</text><g filter="url(#s)"><rect x="90" y="440" width="350" height="125" rx="16" fill="#e9f1fc"/><rect x="90" y="590" width="350" height="125" rx="16" fill="#f9eadf"/><circle cx="570" cy="578" r="42" fill="#fff"/><rect x="710" y="500" width="360" height="155" rx="16" fill="#e3f4f0"/><rect x="1200" y="500" width="310" height="155" rx="16" fill="#fff"/></g><g stroke="#5d7da3" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M440 502h88l18 34"/><path d="M440 652h88l18-34"/><path d="M612 578h86"/><path d="M1070 578h118"/></g><text x="265" y="487" class="h3 b c">Token Embedding</text><text x="265" y="527" class="body c">内容：这个 Token 是谁</text><text x="265" y="637" class="h3 o c">位置信息</text><text x="265" y="677" class="body c">坐标、距离或旋转角度</text><text x="570" y="589" class="h1 b c">+</text><text x="890" y="550" class="h3 g c">带位置的表示</text><text x="890" y="590" class="body c">绝对位置：加到输入</text><text x="890" y="624" class="body c">相对位置：进入 Attention</text><text x="1355" y="550" class="h3 b c">Transformer</text><text x="1355" y="590" class="body c">理解顺序与距离</text><text x="1355" y="624" class="small m c">并遵守 Causal Mask</text><text x="800" y="770" class="body m c">Mask 决定“能不能看见”，位置编码说明“在哪里、相隔多远”。</text></svg>
