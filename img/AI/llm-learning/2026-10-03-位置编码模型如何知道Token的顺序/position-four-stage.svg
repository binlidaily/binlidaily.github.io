<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">位置编码四阶段理解</title><desc id="d">从换序问题到绝对位置、正弦余弦、ALiBi、RoPE 与 NoPE。</desc><defs><linearGradient id="h" x2="1" y2="1"><stop stop-color="#10243f"/><stop offset="1" stop-color="#28628e"/></linearGradient><filter id="s"><feDropShadow dy="5" stdDeviation="7" flood-color="#21364c" flood-opacity=".13"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#172c45}.w{fill:#fff}.sub{fill:#cfe1f2}.h1{font-size:39px;font-weight:750}.h2{font-size:23px;font-weight:700}.h3{font-size:19px;font-weight:700}.b{font-size:17px}.sm{font-size:14px;fill:#63768c}.c{text-anchor:middle}.blue{fill:#2d6fbb}.green{fill:#238f7d}.orange{fill:#d46d37}.purple{fill:#7658b2}</style></defs><rect width="1600" height="900" rx="28" fill="#f3f7fb"/><path d="M28 0h1544a28 28 0 0 1 28 28v128H0V28A28 28 0 0 1 28 0z" fill="url(#h)"/><text x="54" y="65" class="h1 w">位置编码：模型怎样知道 Token 的顺序？</text><text x="54" y="108" class="b sub">内容告诉模型“是谁”，位置告诉模型“在哪里、离多远”</text>
<text x="54" y="202" class="h2">01　问题：同样的 Token，换序后意思变了</text><g filter="url(#s)"><rect x="54" y="228" width="1492" height="130" rx="18" fill="#fff"/></g><text x="150" y="278" class="h3 blue">我打你</text><text x="150" y="316" class="sm">“我”是动作发出者</text><path d="M340 293H520" stroke="#9bb3ca" stroke-width="3"/><text x="800" y="281" class="h2 c">仅靠内容向量，Attention 没有固定坐标尺</text><text x="800" y="319" class="b c">输入重排，输出也只是跟着重排</text><path d="M1080 293h180" stroke="#9bb3ca" stroke-width="3"/><text x="1390" y="278" class="h3 orange">你打我</text><text x="1390" y="316" class="sm c">角色已经反转</text>
<text x="54" y="413" class="h2">02　四种思路：位置信息放在哪里？</text><g filter="url(#s)"><rect x="54" y="440" width="350" height="250" rx="18" fill="#e9f2fc"/><rect x="435" y="440" width="350" height="250" rx="18" fill="#eef7ef"/><rect x="816" y="440" width="350" height="250" rx="18" fill="#fff2e8"/><rect x="1197" y="440" width="349" height="250" rx="18" fill="#f1edfb"/></g><circle cx="229" cy="505" r="31" fill="#2d6fbb"/><text x="229" y="513" class="h3 w c">0</text><text x="229" y="562" class="h3 blue c">绝对位置</text><text x="229" y="601" class="b c">每个座位一张卡</text><text x="229" y="636" class="sm c">加到输入表示</text><g transform="translate(548 475)"><circle cx="62" cy="38" r="38" fill="none" stroke="#238f7d" stroke-width="3"/><path d="M62 38 88 17M62 38 52 5" stroke="#238f7d" stroke-width="4" stroke-linecap="round"/></g><text x="610" y="562" class="h3 green c">正弦 / 余弦</text><text x="610" y="601" class="b c">一排转速不同的钟</text><text x="610" y="636" class="sm c">多频率构成位置指纹</text><path d="M875 512h220" stroke="#d46d37" stroke-width="5"/><path d="M895 492v40M930 487v45M970 481v51M1015 473v59" stroke="#d46d37" stroke-width="4"/><text x="991" y="562" class="h3 orange c">ALiBi</text><text x="991" y="601" class="b c">距离越远，直接扣分</text><text x="991" y="636" class="sm c">修改 Attention 分数</text><g transform="translate(1308 475)"><circle cx="64" cy="38" r="38" fill="none" stroke="#7658b2" stroke-width="3"/><path d="M64 38 97 22" stroke="#7658b2" stroke-width="5" stroke-linecap="round"/><path d="M97 22l-10-2 5 10" fill="#7658b2"/></g><text x="1372" y="562" class="h3 purple c">RoPE</text><text x="1372" y="601" class="b c">位置变成 Q、K 的旋转角</text><text x="1372" y="636" class="sm c">相对距离进入点积</text>
<text x="54" y="750" class="h2">03　更本质的结论</text><rect x="54" y="775" width="1492" height="82" rx="16" fill="#173653"/><text x="90" y="811" class="h3 w">位置编码不是顺序信息的唯一来源</text><text x="90" y="839" class="b sub">Causal Mask 和多层上下文也会间接泄露顺序；显式位置机制的价值，是让顺序关系更容易、更稳定地被学会。</text></svg>
