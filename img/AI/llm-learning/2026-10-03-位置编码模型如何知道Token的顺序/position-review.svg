<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="t d"><title id="t">位置编码复习总图</title><desc id="d">第十一课知识点复习。</desc><defs><linearGradient id="h" x2="1"><stop stop-color="#10243f"/><stop offset="1" stop-color="#28628e"/></linearGradient><filter id="s"><feDropShadow dy="5" stdDeviation="7" flood-color="#21364c" flood-opacity=".12"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#172c45}.w{fill:#fff}.sub{fill:#cee1f2}.h1{font-size:39px;font-weight:750}.h2{font-size:23px;font-weight:700}.h3{font-size:18px;font-weight:700}.b{font-size:16px}.sm{font-size:14px;fill:#62758b}.c{text-anchor:middle}</style></defs><rect width="1600" height="950" rx="28" fill="#f3f7fb"/><path d="M28 0h1544a28 28 0 0 1 28 28v126H0V28A28 28 0 0 1 28 0z" fill="url(#h)"/><text x="54" y="64" class="h1 w">第十一课复习｜位置编码</text><text x="54" y="105" class="b sub">从“在哪里”走向“相隔多远”</text><g filter="url(#s)"><rect x="52" y="184" width="460" height="260" rx="18" fill="#fff"/><rect x="570" y="184" width="460" height="260" rx="18" fill="#fff"/><rect x="1088" y="184" width="460" height="260" rx="18" fill="#fff"/><rect x="52" y="495" width="460" height="270" rx="18" fill="#fff"/><rect x="570" y="495" width="460" height="270" rx="18" fill="#fff"/><rect x="1088" y="495" width="460" height="270" rx="18" fill="#fff"/></g><circle cx="101" cy="230" r="24" fill="#2d6fbb"/><text x="101" y="237" class="h3 w c">1</text><text x="141" y="238" class="h2">为什么需要</text><text x="86" y="288" class="b">Self-Attention 本身对重排等变。</text><text x="86" y="326" class="b">Token 相同不代表角色相同。</text><text x="86" y="379" class="h3" fill="#2d6fbb">你爱我 ≠ 我爱你</text><circle cx="619" cy="230" r="24" fill="#238f7d"/><text x="619" y="237" class="h3 w c">2</text><text x="659" y="238" class="h2">绝对与相对</text><text x="604" y="288" class="b">绝对位置：“你”在位置 1000。</text><text x="604" y="326" class="b">相对位置：“你”和“我”相隔 2 步。</text><text x="604" y="379" class="h3" fill="#238f7d">语言更常依赖关系</text><circle cx="1137" cy="230" r="24" fill="#d46d37"/><text x="1137" y="237" class="h3 w c">3</text><text x="1177" y="238" class="h2">多频率指针</text><text x="1122" y="288" class="b">sine / cosine 每两维是一根指针。</text><text x="1122" y="326" class="b">快指针看近处，慢指针看远处。</text><text x="1122" y="379" class="h3" fill="#d46d37">合在一起形成位置指纹</text><circle cx="101" cy="541" r="24" fill="#7658b2"/><text x="101" y="548" class="h3 w c">4</text><text x="141" y="549" class="h2">ALiBi 与 RoPE</text><text x="86" y="599" class="b">ALiBi：距离越远，直接扣分。</text><text x="86" y="637" class="b">RoPE：旋转 Q、K，让角度差进入点积。</text><text x="86" y="690" class="h3" fill="#7658b2">RoPE 不保证越远分数越小</text><circle cx="619" cy="541" r="24" fill="#2d6fbb"/><text x="619" y="548" class="h3 w c">5</text><text x="659" y="549" class="h2">NoPE 的启发</text><text x="604" y="599" class="b">Causal Mask 与多层上下文会间接泄露顺序。</text><text x="604" y="637" class="b">但显式位置机制能让训练更容易。</text><text x="604" y="690" class="h3" fill="#2d6fbb">不是唯一来源，而是有效偏置</text><circle cx="1137" cy="541" r="24" fill="#238f7d"/><text x="1137" y="548" class="h3 w c">6</text><text x="1177" y="549" class="h2">长上下文</text><text x="1122" y="599" class="b">能计算新位置 ≠ 能理解长文本。</text><text x="1122" y="637" class="b">位置插值、NTK scaling、YaRN 只是工具。</text><text x="1122" y="690" class="h3" fill="#238f7d">最终要看真实长文本评测</text><rect x="52" y="818" width="1496" height="82" rx="16" fill="#173653"/><text x="800" y="854" class="h2 w c">位置机制的核心：把 Token 之间的顺序与距离，变成模型容易学习的结构</text><text x="800" y="881" class="sm c" fill="#cee1f2">Mask 决定能否看见；位置机制说明在哪里、离多远。</text></svg>
