<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">大模型第十一课复习总图</title><desc id="d">总结位置编码的必要性、主要类型、因果 Mask 和上下文外推。</desc><defs><linearGradient id="h"><stop stop-color="#10233f"/><stop offset="1" stop-color="#285382"/></linearGradient><filter id="s"><feDropShadow dy="5" stdDeviation="8" flood-color="#233753" flood-opacity=".1"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#172b45}.w{fill:#fff}.l{fill:#d8e6f6}.m{fill:#61738a}.b{fill:#326fc3}.g{fill:#238d7e}.o{fill:#c76b32}.h1{font-size:36px;font-weight:700}.h2{font-size:22px;font-weight:700}.h3{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.c{text-anchor:middle}</style></defs><rect width="1600" height="900" rx="24" fill="#f2f6fa"/><path d="M24 0h1552a24 24 0 0 1 24 24v112H0V24A24 24 0 0 1 24 0z" fill="url(#h)"/><text x="50" y="58" class="h1 w">大模型第十一课：位置编码</text><text x="50" y="94" class="body l">复习总图 · 从“它是谁”补充到“它在哪里、相隔多远”</text><text x="52" y="164" class="h2">01　为什么需要</text><g filter="url(#s)"><rect x="52" y="190" width="1496" height="112" rx="16" fill="#fff"/></g><text x="100" y="236" class="body"><tspan class="b">Token Embedding</tspan>：表示内容</text><text x="560" y="236" class="body"><tspan class="o">Position ID</tspan>：表示序列坐标</text><text x="1030" y="236" class="body"><tspan class="g">Attention</tspan>：结合内容与位置关系</text><text x="800" y="276" class="small m c">没有位置线索，同一组 Token 的不同排列难以表达不同语义。</text><text x="52" y="370" class="h2">02　四种常见思路</text><g filter="url(#s)"><rect x="52" y="396" width="350" height="190" rx="16" fill="#fff"/><rect x="434" y="396" width="350" height="190" rx="16" fill="#fff"/><rect x="816" y="396" width="350" height="190" rx="16" fill="#fff"/><rect x="1198" y="396" width="350" height="190" rx="16" fill="#fff"/></g><text x="82" y="440" class="h3 b">Learned Absolute</text><text x="82" y="480" class="body">每个位置查一条向量</text><text x="82" y="518" class="body">加到 Token Embedding</text><text x="82" y="558" class="small m">直观，但位置表大小固定</text><text x="464" y="440" class="h3 g">Sinusoidal</text><text x="464" y="480" class="body">正弦余弦生成坐标</text><text x="464" y="518" class="body">不同维度使用不同频率</text><text x="464" y="558" class="small m">无需学习位置表</text><text x="846" y="440" class="h3 o">Relative Bias</text><text x="846" y="480" class="body">距离信息加到分数</text><text x="846" y="518" class="body">直接影响关注程度</text><text x="846" y="558" class="small m">如 Relative Bias、ALiBi</text><text x="1228" y="440" class="h3 b">RoPE</text><text x="1228" y="480" class="body">按位置旋转 Q、K</text><text x="1228" y="518" class="body">点积带入相对位置</text><text x="1228" y="558" class="small m">现代 LLM 常见</text><text x="52" y="654" class="h2">03　不要混淆</text><g filter="url(#s)"><rect x="52" y="680" width="720" height="145" rx="16" fill="#fff"/><rect x="828" y="680" width="720" height="145" rx="16" fill="#fff"/></g><text x="92" y="725" class="h3 o">Causal Mask</text><text x="92" y="766" class="body">决定当前位置能否看见未来 Token</text><text x="92" y="800" class="small m">管理可见性，不能完整表达距离</text><text x="868" y="725" class="h3 g">上下文外推</text><text x="868" y="766" class="body">更长配置 ≠ 自动理解更长文本</text><text x="868" y="800" class="small m">还依赖位置方法、训练数据、计算与评估</text><text x="800" y="882" class="body m c">绝对位置回答“在哪里”，相对位置回答“相隔多远”；二者都在为 Attention 补充顺序。</text></svg>
