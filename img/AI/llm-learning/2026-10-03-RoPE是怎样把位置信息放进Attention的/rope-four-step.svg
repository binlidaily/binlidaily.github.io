<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">RoPE 把位置信息放进 Attention 的四步流程</title>
  <desc id="desc">从生成 Q K，到按绝对位置旋转，再通过角度差形成相对位置，最后进入 Attention 分数。</desc>
  <defs>
    <linearGradient id="header" x2="1"><stop stop-color="#102946"/><stop offset="1" stop-color="#285d8e"/></linearGradient>
    <filter id="shadow"><feDropShadow dy="6" stdDeviation="8" flood-color="#183650" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l10 5-10 5z" fill="#3976b9"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#172c45}.white{fill:#fff}.muted{fill:#60738b}.h1{font-size:38px;font-weight:700}.sub{font-size:18px}.no{font-size:16px;font-weight:700;fill:#3976b9}.h2{font-size:23px;font-weight:700}.body{font-size:17px}.formula{font-family:"SFMono-Regular",Consolas,monospace;font-size:19px}</style>
  </defs>
  <rect width="1600" height="720" rx="26" fill="#f3f7fb"/>
  <path d="M26 0h1548a26 26 0 0 1 26 26v126H0V26A26 26 0 0 1 26 0z" fill="url(#header)"/>
  <text x="54" y="62" class="h1 white">RoPE：从绝对位置到相对距离</text>
  <text x="54" y="105" class="sub" fill="#dbeafe">位置决定旋转角度，Q·K 的共同旋转抵消，最后留下 n−m</text>

  <g filter="url(#shadow)">
    <rect x="48" y="210" width="330" height="330" rx="20" fill="#fff"/>
    <rect x="438" y="210" width="330" height="330" rx="20" fill="#fff"/>
    <rect x="828" y="210" width="330" height="330" rx="20" fill="#fff"/>
    <rect x="1218" y="210" width="330" height="330" rx="20" fill="#fff"/>
  </g>
  <path d="M382 375h46M772 375h46M1162 375h46" stroke="#3976b9" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="78" y="252" class="no">01</text><text x="78" y="294" class="h2">生成 Q、K、V</text>
  <rect x="86" y="340" width="72" height="72" rx="14" fill="#e5effb"/><text x="122" y="384" text-anchor="middle" class="h2">Q</text>
  <rect x="176" y="340" width="72" height="72" rx="14" fill="#fcebdd"/><text x="212" y="384" text-anchor="middle" class="h2">K</text>
  <rect x="266" y="340" width="72" height="72" rx="14" fill="#e7f4ef"/><text x="302" y="384" text-anchor="middle" class="h2">V</text>
  <text x="78" y="475" class="body muted">RoPE 只处理 Q 和 K。</text><text x="78" y="505" class="body muted">V 保存要汇总的内容。</text>

  <text x="468" y="252" class="no">02</text><text x="468" y="294" class="h2">按绝对位置旋转</text>
  <circle cx="546" cy="390" r="66" fill="none" stroke="#cbd9e7" stroke-width="3"/><circle cx="658" cy="390" r="66" fill="none" stroke="#cbd9e7" stroke-width="3"/>
  <path d="M546 390l38-54" stroke="#3976b9" stroke-width="7" stroke-linecap="round"/><path d="M658 390l-48-45" stroke="#d97a43" stroke-width="7" stroke-linecap="round"/>
  <text x="546" y="478" text-anchor="middle" class="formula">Q′=RₘQ</text><text x="658" y="478" text-anchor="middle" class="formula">K′=RₙK</text>
  <text x="468" y="515" class="body muted">位置 m 转 mθ；位置 n 转 nθ。</text>

  <text x="858" y="252" class="no">03</text><text x="858" y="294" class="h2">共同旋转抵消</text>
  <text x="993" y="366" text-anchor="middle" class="formula">(RₘQ)ᵀ(RₙK)</text>
  <text x="993" y="414" text-anchor="middle" class="formula">= QᵀRₙ₋ₘK</text>
  <rect x="882" y="448" width="222" height="48" rx="24" fill="#e8f1fc"/><text x="993" y="479" text-anchor="middle" class="body">只剩相对距离 n−m</text>

  <text x="1248" y="252" class="no">04</text><text x="1248" y="294" class="h2">进入 Attention 分数</text>
  <rect x="1270" y="344" width="226" height="78" rx="16" fill="#e8f1fc"/><text x="1383" y="392" text-anchor="middle" class="formula">Q′K′ᵀ / √d</text>
  <path d="M1383 431v46" stroke="#3976b9" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1383" y="517" text-anchor="middle" class="body muted">分数同时包含内容与位置</text>

  <rect x="220" y="605" width="1160" height="72" rx="18" fill="#e7f0fa"/>
  <text x="800" y="650" text-anchor="middle" class="h2">一句话：绝对位置控制旋转，相对位置控制两支箭头之间的夹角。</text>
</svg>
