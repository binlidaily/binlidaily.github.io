<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="t d"><title id="t">Residual LayerNorm RMSNorm 对比</title><desc id="d">展示残差路径、LayerNorm 与 RMSNorm 的计算差异，以及 Pre-Norm 结构。</desc><defs><linearGradient id="h"><stop stop-color="#10233f"/><stop offset="1" stop-color="#285382"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#5d7da3"/></marker><filter id="s"><feDropShadow dy="5" stdDeviation="7" flood-color="#233753" flood-opacity=".12"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#172b45}.w{fill:#fff}.l{fill:#d8e6f6}.m{fill:#61738a}.b{fill:#326fc3}.g{fill:#238d7e}.o{fill:#c76b32}.h1{font-size:36px;font-weight:700}.h2{font-size:21px;font-weight:700}.h3{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.c{text-anchor:middle}</style></defs><rect width="1600" height="800" rx="24" fill="#f2f6fa"/><path d="M24 0h1552a24 24 0 0 1 24 24v112H0V24A24 24 0 0 1 24 0z" fill="url(#h)"/><text x="50" y="58" class="h1 w">Residual、LayerNorm、RMSNorm：分别解决什么问题？</text><text x="50" y="94" class="body l">一条路保留信息，一次归一化稳定尺度</text><text x="52" y="165" class="h2">01　Residual：让输入可以绕过子层</text><g filter="url(#s)"><rect x="52" y="192" width="1496" height="190" rx="16" fill="#fff"/></g><g stroke="#5d7da3" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M130 292h190"/><path d="M530 292h220"/><path d="M830 292h210"/></g><g filter="url(#s)"><rect x="320" y="242" width="210" height="100" rx="15" fill="#e3f4f0"/><circle cx="790" cy="292" r="40" fill="#e9f1fc"/></g><text x="115" y="300" class="h3 b c">输入 x</text><text x="425" y="283" class="h3 g c">子层 F(x)</text><text x="425" y="314" class="small m c">学习需要补充的变化</text><text x="790" y="302" class="h1 b c">+</text><text x="1110" y="284" class="h3 b">输出 y = x + F(x)</text><text x="1110" y="318" class="small m">信息与梯度都有一条直接路径</text><path d="M115 250V212h675v33" fill="none" stroke="#326fc3" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#a)"/><text x="465" y="225" class="small b c">Residual path</text><text x="52" y="450" class="h2">02　LayerNorm 与 RMSNorm：都按每个 Token 的隐藏维计算</text><g filter="url(#s)"><rect x="52" y="478" width="720" height="205" rx="16" fill="#fff"/><rect x="828" y="478" width="720" height="205" rx="16" fill="#fff"/></g><text x="92" y="524" class="h2 b">LayerNorm</text><text x="92" y="568" class="body">① 减均值：x − μ　　② 除以标准差</text><text x="92" y="607" class="body">③ 用 γ 缩放，用 β 平移</text><text x="92" y="648" class="small m">同时调整中心与尺度</text><text x="868" y="524" class="h2 g">RMSNorm</text><text x="868" y="568" class="body">① 不减均值　　② 除以均方根 RMS</text><text x="868" y="607" class="body">③ 通常只用 γ 缩放</text><text x="868" y="648" class="small m">形式更简单，主要调整尺度</text><g filter="url(#s)"><rect x="250" y="720" width="1100" height="54" rx="14" fill="#eaf2fc"/></g><text x="800" y="754" class="h3 b c">现代 LLM 常用 Pre-Norm：x + Sublayer(RMSNorm(x))</text></svg>
