<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">大模型第十课复习总图</title><desc id="d">总结 Residual、LayerNorm、RMSNorm、Pre-Norm 与 Post-Norm。</desc><defs><linearGradient id="h"><stop stop-color="#10233f"/><stop offset="1" stop-color="#285382"/></linearGradient><filter id="s"><feDropShadow dy="5" stdDeviation="8" flood-color="#233753" flood-opacity=".1"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#172b45}.w{fill:#fff}.l{fill:#d8e6f6}.m{fill:#61738a}.b{fill:#326fc3}.g{fill:#238d7e}.o{fill:#c76b32}.h1{font-size:36px;font-weight:700}.h2{font-size:22px;font-weight:700}.h3{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.c{text-anchor:middle}</style></defs><rect width="1600" height="900" rx="24" fill="#f2f6fa"/><path d="M24 0h1552a24 24 0 0 1 24 24v112H0V24A24 24 0 0 1 24 0z" fill="url(#h)"/><text x="50" y="58" class="h1 w">大模型第十课：Residual、LayerNorm 与 RMSNorm</text><text x="50" y="94" class="body l">复习总图 · 保留信息、传播梯度、稳定数值尺度</text><text x="52" y="164" class="h2">01　Residual</text><g filter="url(#s)"><rect x="52" y="190" width="1496" height="120" rx="16" fill="#fff"/></g><text x="100" y="236" class="h3 b">y = x + F(x)</text><text x="390" y="236" class="body">输入 x 直接到达输出</text><text x="790" y="236" class="body">F(x) 只学习需要补充的变化</text><text x="1210" y="236" class="body">为梯度提供更直接路径</text><text x="800" y="278" class="small m c">逐元素相加，不是拼接；两边形状必须相同。</text><text x="52" y="380" class="h2">02　两种归一化</text><g filter="url(#s)"><rect x="52" y="406" width="720" height="205" rx="16" fill="#fff"/><rect x="828" y="406" width="720" height="205" rx="16" fill="#fff"/></g><text x="92" y="450" class="h3 b">LayerNorm</text><text x="92" y="490" class="body">减均值，再除以标准差</text><text x="92" y="528" class="body">通常使用 γ 与 β</text><text x="92" y="568" class="small m">调整中心 + 调整尺度</text><text x="868" y="450" class="h3 g">RMSNorm</text><text x="868" y="490" class="body">不减均值，除以均方根</text><text x="868" y="528" class="body">通常只使用 γ</text><text x="868" y="568" class="small m">主要调整尺度，现代 LLM 常用</text><text x="52" y="678" class="h2">03　放在哪里</text><g filter="url(#s)"><rect x="52" y="704" width="720" height="130" rx="16" fill="#fff"/><rect x="828" y="704" width="720" height="130" rx="16" fill="#fff"/></g><text x="92" y="750" class="h3 g">Pre-Norm</text><text x="92" y="792" class="body">x + Sublayer(Norm(x))</text><text x="500" y="792" class="small m">现代 LLM 常见</text><text x="868" y="750" class="h3 o">Post-Norm</text><text x="868" y="792" class="body">Norm(x + Sublayer(x))</text><text x="1280" y="792" class="small m">原始 Transformer 使用</text><text x="800" y="882" class="body m c">Residual 负责通路，Norm 负责尺度；两者配合，深层 Transformer 才更容易稳定训练。</text></svg>
