<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">MHA、MQA、GQA、MLA 的结构差异</title><desc id="d">以八个 Query Head 对比四种注意力结构怎样保存历史信息</desc>
<defs><linearGradient id="head" x2="1" y2="1"><stop stop-color="#10243f"/><stop offset="1" stop-color="#245b88"/></linearGradient><filter id="shadow"><feDropShadow dy="7" stdDeviation="10" flood-color="#16324f" flood-opacity=".12"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#152a42}.white{fill:#fff}.muted{fill:#61758b}.title{font-size:38px;font-weight:750}.sub{font-size:20px}.h2{font-size:25px;font-weight:700}.body{font-size:17px}.small{font-size:14px}.pill{font-size:15px;font-weight:650}.q{fill:#3279c5}.kv{fill:#ec7b45}.latent{fill:#7258c8}.link{stroke:#9bb1c5;stroke-width:2}.dash{stroke-dasharray:6 6}</style></defs>
<rect width="1600" height="900" rx="28" fill="#f4f7fa"/><path d="M28 0h1544a28 28 0 0 1 28 28v142H0V28A28 28 0 0 1 28 0z" fill="url(#head)"/><text x="60" y="68" class="title white">MHA、MQA、GQA、MLA：它们到底在省什么？</text><text x="60" y="112" class="sub" fill="#d9e7f5">Q 都可以很多；区别在于历史 K、V 是独立、共享，还是压缩后再缓存</text><rect x="1250" y="48" width="280" height="54" rx="27" fill="#ffffff18"/><text x="1390" y="82" class="pill white" text-anchor="middle">统一例子：8 个 Q Head</text>
<g filter="url(#shadow)">
<rect x="50" y="205" width="355" height="545" rx="22" fill="#fff"/><rect x="432" y="205" width="355" height="545" rx="22" fill="#fff"/><rect x="814" y="205" width="355" height="545" rx="22" fill="#fff"/><rect x="1196" y="205" width="354" height="545" rx="22" fill="#fff"/>
</g>
<g><text x="78" y="250" class="h2">MHA</text><text x="78" y="280" class="body muted">每个 Q 各有一套 KV</text><text x="460" y="250" class="h2">MQA</text><text x="460" y="280" class="body muted">所有 Q 共用一套 KV</text><text x="842" y="250" class="h2">GQA</text><text x="842" y="280" class="body muted">一组 Q 共用一套 KV</text><text x="1224" y="250" class="h2">MLA</text><text x="1224" y="280" class="body muted">缓存低维潜表示</text></g>
<!-- MHA -->
<g id="mha"><g class="link"> <path d="M110 345H300"/><path d="M110 390H300"/><path d="M110 435H300"/><path d="M110 480H300"/><path d="M110 525H300"/><path d="M110 570H300"/><path d="M110 615H300"/><path d="M110 660H300"/></g><g class="q"><circle cx="110" cy="345" r="15"/><circle cx="110" cy="390" r="15"/><circle cx="110" cy="435" r="15"/><circle cx="110" cy="480" r="15"/><circle cx="110" cy="525" r="15"/><circle cx="110" cy="570" r="15"/><circle cx="110" cy="615" r="15"/><circle cx="110" cy="660" r="15"/></g><g class="kv"><rect x="275" y="330" width="52" height="30" rx="9"/><rect x="275" y="375" width="52" height="30" rx="9"/><rect x="275" y="420" width="52" height="30" rx="9"/><rect x="275" y="465" width="52" height="30" rx="9"/><rect x="275" y="510" width="52" height="30" rx="9"/><rect x="275" y="555" width="52" height="30" rx="9"/><rect x="275" y="600" width="52" height="30" rx="9"/><rect x="275" y="645" width="52" height="30" rx="9"/></g><text x="110" y="712" class="small q" text-anchor="middle">8 个 Q</text><text x="301" y="712" class="small kv" text-anchor="middle">8 套 KV</text></g>
<!-- MQA -->
<g id="mqa"><g class="link"><path d="M492 345L683 502"/><path d="M492 390L683 502"/><path d="M492 435L683 502"/><path d="M492 480L683 502"/><path d="M492 525L683 502"/><path d="M492 570L683 502"/><path d="M492 615L683 502"/><path d="M492 660L683 502"/></g><g class="q"><circle cx="492" cy="345" r="15"/><circle cx="492" cy="390" r="15"/><circle cx="492" cy="435" r="15"/><circle cx="492" cy="480" r="15"/><circle cx="492" cy="525" r="15"/><circle cx="492" cy="570" r="15"/><circle cx="492" cy="615" r="15"/><circle cx="492" cy="660" r="15"/></g><rect x="657" y="479" width="54" height="46" rx="12" class="kv"/><text x="684" y="508" class="pill white" text-anchor="middle">KV</text><text x="492" y="712" class="small q" text-anchor="middle">8 个 Q</text><text x="684" y="712" class="small kv" text-anchor="middle">1 套 KV</text></g>
<!-- GQA -->
<g id="gqa"><g class="link"><path d="M874 345L1065 410"/><path d="M874 390L1065 410"/><path d="M874 435L1065 410"/><path d="M874 480L1065 410"/><path d="M874 525L1065 592"/><path d="M874 570L1065 592"/><path d="M874 615L1065 592"/><path d="M874 660L1065 592"/></g><g class="q"><circle cx="874" cy="345" r="15"/><circle cx="874" cy="390" r="15"/><circle cx="874" cy="435" r="15"/><circle cx="874" cy="480" r="15"/><circle cx="874" cy="525" r="15"/><circle cx="874" cy="570" r="15"/><circle cx="874" cy="615" r="15"/><circle cx="874" cy="660" r="15"/></g><rect x="1039" y="387" width="54" height="46" rx="12" class="kv"/><rect x="1039" y="569" width="54" height="46" rx="12" class="kv"/><text x="1066" y="416" class="pill white" text-anchor="middle">KV</text><text x="1066" y="598" class="pill white" text-anchor="middle">KV</text><text x="874" y="712" class="small q" text-anchor="middle">8 个 Q</text><text x="1066" y="712" class="small kv" text-anchor="middle">2 套 KV</text></g>
<!-- MLA -->
<g id="mla"><g class="link dash"><path d="M1256 345L1390 500"/><path d="M1256 390L1390 500"/><path d="M1256 435L1390 500"/><path d="M1256 480L1390 500"/><path d="M1256 525L1390 500"/><path d="M1256 570L1390 500"/><path d="M1256 615L1390 500"/><path d="M1256 660L1390 500"/></g><g class="q"><circle cx="1256" cy="345" r="15"/><circle cx="1256" cy="390" r="15"/><circle cx="1256" cy="435" r="15"/><circle cx="1256" cy="480" r="15"/><circle cx="1256" cy="525" r="15"/><circle cx="1256" cy="570" r="15"/><circle cx="1256" cy="615" r="15"/><circle cx="1256" cy="660" r="15"/></g><rect x="1350" y="455" width="120" height="90" rx="18" class="latent"/><text x="1410" y="490" class="pill white" text-anchor="middle">低维 cᴷⱽ</text><text x="1410" y="520" class="small white" text-anchor="middle">+ RoPE Key</text><path d="M1475 500h35" stroke="#7258c8" stroke-width="3"/><text x="1516" y="492" class="small latent">投影</text><text x="1516" y="513" class="small latent">使用</text><text x="1256" y="712" class="small q" text-anchor="middle">8 个 Q</text><text x="1410" y="712" class="small latent" text-anchor="middle">不直接存完整 KV</text></g>
<g><rect x="170" y="795" width="1260" height="62" rx="31" fill="#e8f0f7"/><text x="800" y="833" class="body" text-anchor="middle"><tspan font-weight="700">同一条共享轴：</tspan> MHA → GQA → MQA　　<tspan font-weight="700">另一条压缩路线：</tspan> MLA</text></g>
</svg>
