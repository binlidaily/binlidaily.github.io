<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="t d"><title id="t">大模型第十三课复习总图</title><desc id="d">核心概念、流程与易错点</desc><defs><linearGradient id="h"><stop stop-color="#10233f"/><stop offset="1" stop-color="#285382"/></linearGradient><filter id="s"><feDropShadow dy="5" stdDeviation="7" flood-color="#233753" flood-opacity=".1"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#172b45}.w{fill:#fff}.l{fill:#d8e6f6}.m{fill:#61738a}.h1{font-size:36px;font-weight:700}.h2{font-size:22px;font-weight:700;fill:#326fc3}.h3{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px}</style></defs><rect width="1600" height="650" rx="24" fill="#f2f6fa"/><path d="M24 0h1552a24 24 0 0 1 24 24v112H0V24A24 24 0 0 1 24 0z" fill="url(#h)"/><text x="50" y="58" class="h1 w">大模型第十三课复习总图</text><text x="50" y="94" class="body l">核心概念、流程与易错点</text><text x="52" y="205" class="h2">第 13 课 · 四个关键点</text><g filter="url(#s)"><rect x="52" y="260" width="350" height="190" rx="16" fill="#e9f1fc"/><text x="80" y="312" class="h2">01</text><text x="80" y="360" class="h3">MHA 每个 Head 有独立 KV</text><text x="80" y="405" class="small m"><tspan x="80" dy="0">MQA 并非只有一个 Query H</tspan><tspan x="80" dy="24">ead</tspan></text><rect x="434" y="260" width="350" height="190" rx="16" fill="#e3f4f0"/><text x="462" y="312" class="h2">02</text><text x="462" y="360" class="h3">MQA 共享一组 KV</text><text x="462" y="405" class="small m"><tspan x="462" dy="0">GQA 是 MHA 与 MQA 的连</tspan><tspan x="462" dy="24">续折中</tspan></text><rect x="816" y="260" width="350" height="190" rx="16" fill="#f9eadf"/><text x="844" y="312" class="h2">03</text><text x="844" y="360" class="h3">GQA 按组共享 KV</text><text x="844" y="405" class="small m"><tspan x="844" dy="0">MLA 不等于普通的 KV Head</tspan><tspan x="844" dy="24"> 共享</tspan></text><rect x="1198" y="260" width="350" height="190" rx="16" fill="#efeafb"/><text x="1226" y="312" class="h2">04</text><text x="1226" y="360" class="h3">MLA 缓存低维潜表示</text><text x="1226" y="405" class="small m"><tspan x="1226" dy="0">结合正文理解</tspan></text></g><rect x="130" y="515" width="1340" height="84" rx="16" fill="#fff" filter="url(#s)"/><text x="800" y="566" class="body" text-anchor="middle">MHA 每个 Head 有独立 KV · MQA 共享一组 KV · GQA 按组共享 KV · MLA 缓存低维潜表示 · 目标是质量与缓存成本平衡</text><text x="800" y="632" class="small m" text-anchor="middle">Same Text · Clear Structure · Easy Review</text></svg>