<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="t d"><title id="t">MHA、MQA、GQA、MLA 复习总图</title><desc id="d">从生成阶段的 KV Cache 问题，到四种结构的差异、公式和选择方法</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#0d213b"/><stop offset="1" stop-color="#28618e"/></linearGradient><filter id="s"><feDropShadow dy="6" stdDeviation="9" flood-color="#18344f" flood-opacity=".11"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#142b44}.w{fill:#fff}.muted{fill:#5f7388}.title{font-size:38px;font-weight:750}.sub{font-size:19px}.h2{font-size:23px;font-weight:700}.h3{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:14px}.blue{fill:#2e73ba}.orange{fill:#e3753e}.purple{fill:#7056c5}</style></defs><rect width="1600" height="1080" rx="28" fill="#f4f7fa"/><path d="M28 0h1544a28 28 0 0 1 28 28v138H0V28A28 28 0 0 1 28 0z" fill="url(#g)"/><text x="58" y="62" class="title w">第 13 课复习：四种 Attention 到底在省什么？</text><text x="58" y="103" class="sub" fill="#d8e7f5">主线：Decode 反复读取历史 KV → 减少共享副本或改变缓存表示</text>
<g filter="url(#s)"><rect x="50" y="180" width="1500" height="145" rx="22" fill="#fff"/><rect x="50" y="360" width="355" height="355" rx="22" fill="#eaf2fb"/><rect x="432" y="360" width="355" height="355" rx="22" fill="#eaf7f3"/><rect x="814" y="360" width="355" height="355" rx="22" fill="#fff1e7"/><rect x="1196" y="360" width="354" height="355" rx="22" fill="#f0edfb"/><rect x="50" y="752" width="730" height="270" rx="22" fill="#fff"/><rect x="820" y="752" width="730" height="270" rx="22" fill="#fff"/></g>
<text x="80" y="220" class="h2">先看瓶颈：不是每一步都算很多，而是每一步都要搬很多</text><text x="80" y="259" class="body muted">生成一个新 Token：当前 Q × 全部历史 K → 权重 × 全部历史 V。上下文越长、并发越高，KV Cache 的显存与带宽压力越大。</text><rect x="965" y="212" width="505" height="68" rx="14" fill="#edf4fa"/><text x="1218" y="253" class="h3" text-anchor="middle">2 × nₖᵥ × dₕₑₐd × 元素字节数</text>
<g><text x="78" y="407" class="h2">MHA</text><text x="78" y="439" class="body muted">8 Q → 8 KV</text><text x="78" y="492" class="h3 blue">独立</text><text x="78" y="528" class="body">每个 Head 有自己的 K、V</text><text x="78" y="561" class="body">表达自由，缓存最大</text><rect x="78" y="610" width="280" height="18" rx="9" fill="#d9e4ef"/><rect x="78" y="610" width="280" height="18" rx="9" fill="#2e73ba"/><text x="78" y="659" class="small muted">基准：100% KV Cache</text>
<text x="460" y="407" class="h2">MQA</text><text x="460" y="439" class="body muted">8 Q → 1 KV</text><text x="460" y="492" class="h3" fill="#16876d">完全共享</text><text x="460" y="528" class="body">所有 Q 共用一套 K、V</text><text x="460" y="561" class="body">缓存最小，质量可能受影响</text><rect x="460" y="610" width="280" height="18" rx="9" fill="#d9e4ef"/><rect x="460" y="610" width="35" height="18" rx="9" fill="#24a185"/><text x="460" y="659" class="small muted">示意：12.5% KV Cache</text>
<text x="842" y="407" class="h2">GQA</text><text x="842" y="439" class="body muted">8 Q → 2 KV</text><text x="842" y="492" class="h3 orange">分组共享</text><text x="842" y="528" class="body">每组 Q 共用一套 K、V</text><text x="842" y="561" class="body">质量与效率的常见折中</text><rect x="842" y="610" width="280" height="18" rx="9" fill="#d9e4ef"/><rect x="842" y="610" width="70" height="18" rx="9" fill="#e3753e"/><text x="842" y="659" class="small muted">示意：25% KV Cache</text>
<text x="1224" y="407" class="h2">MLA</text><text x="1224" y="439" class="body muted">低秩压缩路线</text><text x="1224" y="492" class="h3 purple">改变表示</text><text x="1224" y="528" class="body">缓存 cᴷⱽ + RoPE Key 分量</text><text x="1224" y="561" class="body">不等于“更少的 KV Head”</text><rect x="1224" y="606" width="280" height="55" rx="13" fill="#e3def7"/><text x="1364" y="640" class="small purple" text-anchor="middle">按潜维度计算，不套 nₖᵥ 公式</text></g>
<text x="80" y="800" class="h2">一眼判断结构</text><text x="80" y="844" class="body">① 数 Query Head 和 KV Head</text><text x="80" y="883" class="body">② 看历史 Token 实际缓存什么</text><text x="80" y="922" class="body">③ 区分共享 KV 与压缩潜表示</text><text x="80" y="961" class="body">④ 重点关注 Decode 的显存带宽</text>
<text x="850" y="800" class="h2">一句话记忆</text><text x="850" y="850" class="body"><tspan font-weight="700">MHA</tspan>：各存各的</text><text x="850" y="889" class="body"><tspan font-weight="700">MQA</tspan>：大家共用一份</text><text x="850" y="928" class="body"><tspan font-weight="700">GQA</tspan>：分组共用</text><text x="850" y="967" class="body"><tspan font-weight="700">MLA</tspan>：先压缩，再保存</text><rect x="1210" y="835" width="270" height="116" rx="18" fill="#edf4fa"/><text x="1345" y="876" class="h3" text-anchor="middle">不是缩写竞赛</text><text x="1345" y="908" class="small muted" text-anchor="middle">看质量、缓存、带宽</text><text x="1345" y="932" class="small muted" text-anchor="middle">以及推理框架支持</text>
<text x="800" y="1060" class="small muted" text-anchor="middle">Same Query Heads · Different KV Strategy · Better Decode</text></svg>
