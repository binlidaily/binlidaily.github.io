<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="730" viewBox="0 0 1440 730" role="img" aria-labelledby="title desc">
<title id="title">实践项目 01：下一个 Token 实验台</title><desc id="desc">字符级文本经过字符表得到整数 ID，在可学习 Embedding 表中查向量，经线性层得到 Logits，采样下一个字符并追加，再次预测。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef7f5"/></linearGradient><linearGradient id="head" x2="1"><stop stop-color="#142d4c"/><stop offset="1" stop-color="#23647b"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#12304d" flood-opacity=".1"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7898b2"/></marker></defs>
<style>.t{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#19354e}.w{fill:#fff}.b{font-weight:700}.sm{font-size:21px;fill:#5d7589}.body{font-size:24px}</style>
<rect width="1440" height="730" rx="30" fill="url(#bg)"/><rect width="1440" height="126" rx="30" fill="url(#head)"/><rect y="98" width="1440" height="28" fill="url(#head)"/><text class="t w b" x="56" y="66" font-size="40">项目 01：亲手接通“下一个 Token”</text><text class="t w" x="58" y="106" font-size="22" opacity=".85">字符级入门模型 · CPU 可运行 · 先观察中间结果</text>
<g filter="url(#s)"><rect x="48" y="184" width="247" height="230" rx="20" fill="#fff"/><rect x="327" y="184" width="247" height="230" rx="20" fill="#fff"/><rect x="606" y="184" width="247" height="230" rx="20" fill="#fff"/><rect x="885" y="184" width="247" height="230" rx="20" fill="#fff"/><rect x="1164" y="184" width="228" height="230" rx="20" fill="#fff"/></g>
<rect x="48" y="184" width="247" height="53" rx="20" fill="#e7f0fb"/><rect x="48" y="216" width="247" height="21" fill="#e7f0fb"/><text class="t b" x="69" y="221" font-size="26">① Text</text><text class="t body" x="69" y="294">当前字符</text><text class="t b" x="69" y="343" font-size="36">“苹”</text><text class="t sm" x="69" y="387">字符级 Token</text>
<rect x="327" y="184" width="247" height="53" rx="20" fill="#e7f0fb"/><rect x="327" y="216" width="247" height="21" fill="#e7f0fb"/><text class="t b" x="348" y="221" font-size="26">② Token ID</text><text class="t body" x="348" y="294">查固定字符表</text><text class="t b" x="348" y="343" font-size="32">整数编号</text><text class="t sm" x="348" y="387">训练与推理共用</text>
<rect x="606" y="184" width="247" height="53" rx="20" fill="#e4f5f0"/><rect x="606" y="216" width="247" height="21" fill="#e4f5f0"/><text class="t b" x="627" y="221" font-size="26">③ Embedding</text><text class="t body" x="627" y="294">按 ID 查一行</text><text class="t b" x="627" y="343" font-size="32">可学习向量</text><text class="t sm" x="627" y="387">形状增加维度 d</text>
<rect x="885" y="184" width="247" height="53" rx="20" fill="#e4f5f0"/><rect x="885" y="216" width="247" height="21" fill="#e4f5f0"/><text class="t b" x="906" y="221" font-size="26">④ Logits</text><text class="t body" x="906" y="294">线性层映射</text><text class="t b" x="906" y="343" font-size="32">每字一个分数</text><text class="t sm" x="906" y="387">尚不是概率</text>
<rect x="1164" y="184" width="228" height="53" rx="20" fill="#e9f0fb"/><rect x="1164" y="216" width="228" height="21" fill="#e9f0fb"/><text class="t b" x="1185" y="221" font-size="26">⑤ Sampling</text><text class="t body" x="1185" y="294">概率 → 选择</text><text class="t b" x="1185" y="343" font-size="35">下一个字</text><text class="t sm" x="1185" y="387">追加后再预测</text>
<path d="M297 300H319M576 300H598M855 300H877M1134 300H1156" stroke="#7898b2" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="48" y="458" width="1344" height="121" rx="20" fill="#e7f2f7" stroke="#c6deeb"/><text class="t b" x="75" y="503" font-size="28">你要记录的形状</text><text class="t body" x="75" y="548">Token IDs [B, T]　→　Embedding [B, T, d]　→　Logits [B, T, V]　→　概率 [B, T, V]</text>
<rect x="48" y="611" width="1344" height="75" rx="20" fill="#183b57"/><text class="t w b" x="76" y="647" font-size="25">本项目的边界：只看当前字符，无 Attention、无上下文表示；项目 02 再解决“看见前文”。</text><text class="t w" x="76" y="677" font-size="18">图中的“苹”只用来说明输入，实际字符 ID、向量与概率由你运行后得到。</text>
</svg>
