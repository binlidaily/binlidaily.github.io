<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
<title id="title">SFT：一条示范对话如何成为训练信号</title><desc id="desc">对话样本经过聊天模板形成 Token 序列，再选择回答位置计算下一 Token 预测损失。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#edf5f6"/></linearGradient><linearGradient id="head" x2="1"><stop stop-color="#183757"/><stop offset="1" stop-color="#2e617e"/></linearGradient><filter id="shadow"><feDropShadow dy="7" stdDeviation="10" flood-color="#173958" flood-opacity=".12"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#17314c}.title{font-size:36px;font-weight:700;fill:#fff}.sub{font-size:19px;fill:#d8e9f6}.step{font-size:21px;font-weight:700;fill:#24639a}.body{font-size:20px}.small{font-size:17px;fill:#627a8c}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:18px}.white{fill:#fff}.green{fill:#168064}.arrow{fill:none;stroke:#477ca6;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style></defs>
<rect width="1600" height="760" rx="26" fill="url(#bg)"/><path d="M26 0h1548a26 26 0 0 1 26 26v110H0V26A26 26 0 0 1 26 0z" fill="url(#head)"/><text x="50" y="59" class="title">SFT：基础模型怎样学会接话？</text><text x="50" y="101" class="sub">从一条示范对话，到真正作用于模型的训练信号</text>
<g filter="url(#shadow)"><rect x="55" y="185" width="440" height="390" rx="24" fill="#fff"/><rect x="575" y="185" width="440" height="390" rx="24" fill="#fff"/><rect x="1095" y="185" width="450" height="390" rx="24" fill="#fff"/></g>
<text x="85" y="230" class="step">01  示范对话</text><rect x="83" y="260" width="385" height="64" rx="13" fill="#e7f0f8"/><text x="101" y="299" class="body">系统：请简洁、准确地回答</text><rect x="83" y="338" width="385" height="64" rx="13" fill="#e7f0f8"/><text x="101" y="377" class="body">用户：法国的首都是哪里？</text><rect x="83" y="416" width="385" height="74" rx="13" fill="#ddf2e9"/><text x="101" y="461" class="body">助手：法国的首都是巴黎。</text><text x="85" y="538" class="small">回答是数据提供的示范，不是模型自选</text>
<path d="M510 380h48m-16-16 16 16-16 16" class="arrow"/>
<text x="605" y="230" class="step">02  聊天模板</text><rect x="603" y="260" width="384" height="235" rx="14" fill="#eff4fa"/><text x="625" y="308" class="mono">[系统] 请简洁回答 [结束]</text><text x="625" y="363" class="mono">[用户] 法国的首都？ [结束]</text><rect x="616" y="390" width="360" height="72" rx="10" fill="#ddf2e9"/><text x="625" y="435" class="mono green">[助手] 法国的首都是巴黎。</text><text x="605" y="538" class="small">标记仅为示意；真实 Token 因模型而异</text>
<path d="M1030 380h48m-16-16 16 16-16 16" class="arrow"/>
<text x="1125" y="230" class="step">03  选择训练位置</text><text x="1125" y="287" class="body">系统与用户：作为上下文</text><rect x="1125" y="312" width="365" height="49" rx="11" fill="#e7f0f8"/><text x="1145" y="344" class="small">常见做法：不计入 Loss</text><text x="1125" y="407" class="body">助手回答：预测下一个 Token</text><rect x="1125" y="430" width="365" height="53" rx="11" fill="#ddf2e9"/><text x="1145" y="464" class="body green">计入 Loss → 更新模型参数</text><text x="1125" y="538" class="small">也存在全序列训练等不同配置</text>
<rect x="55" y="625" width="1490" height="80" rx="20" fill="#193955"/><text x="800" y="660" text-anchor="middle" class="body white">核心没变：给定前文，预测下一个 Token</text><text x="800" y="688" text-anchor="middle" class="small" style="fill:#c7ddeb">改变的是示范数据、对话格式，以及哪些位置参与训练</text>
</svg>
