<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">第二十一课复习总图：SFT</title><desc id="desc">总结示范数据、聊天模板、回答掩码、下一 Token 预测、质量评估及边界。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f9fbfd"/><stop offset="1" stop-color="#eaf3f6"/></linearGradient><linearGradient id="hd" x2="1"><stop stop-color="#183757"/><stop offset="1" stop-color="#2e617e"/></linearGradient><filter id="s"><feDropShadow dy="6" stdDeviation="9" flood-color="#16334a" flood-opacity=".11"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#17314c}.title{font-size:37px;font-weight:700;fill:#fff}.sub{font-size:18px;fill:#d7e9f5}.h{font-size:22px;font-weight:700;fill:#24639a}.body{font-size:19px}.small{font-size:16px;fill:#637b8e}.white{fill:#fff}.line{stroke:#c4d7e5;stroke-width:3}</style></defs>
<rect width="1600" height="900" rx="26" fill="url(#bg)"/><path d="M26 0h1548a26 26 0 0 1 26 26v108H0V26A26 26 0 0 1 26 0z" fill="url(#hd)"/><text x="50" y="58" class="title">第二十一课 · SFT 复习总图</text><text x="50" y="99" class="sub">基础模型怎样从“续写文本”走向“回应用户”？</text>
<g filter="url(#s)"><rect x="54" y="178" width="458" height="225" rx="20" fill="#fff"/><rect x="571" y="178" width="458" height="225" rx="20" fill="#fff"/><rect x="1088" y="178" width="458" height="225" rx="20" fill="#fff"/><rect x="54" y="443" width="458" height="225" rx="20" fill="#fff"/><rect x="571" y="443" width="458" height="225" rx="20" fill="#fff"/><rect x="1088" y="443" width="458" height="225" rx="20" fill="#fff"/></g>
<text x="81" y="225" class="h">01  示范对话</text><text x="81" y="277" class="body">用户：法国的首都是哪里？</text><text x="81" y="315" class="body">助手：法国的首都是巴黎。</text><text x="81" y="364" class="small">给模型看期望的接话方式</text>
<text x="598" y="225" class="h">02  Chat Template</text><text x="598" y="277" class="body">角色、内容、结束标记</text><text x="598" y="315" class="body">串成模型读取的 Token 序列</text><text x="598" y="364" class="small">训练与推理要匹配同一模板</text>
<text x="1115" y="225" class="h">03  Loss Mask</text><text x="1115" y="277" class="body">用户问题仍在输入中</text><text x="1115" y="315" class="body">常只让助手回答计入 Loss</text><text x="1115" y="364" class="small">这是常见选择，并非 SFT 定义</text>
<text x="81" y="490" class="h">04  训练目标</text><text x="81" y="542" class="body">给定前文，预测下一个 Token</text><text x="81" y="580" class="body">正确示范提高目标概率</text><text x="81" y="629" class="small">原理仍是语言模型训练</text>
<text x="598" y="490" class="h">05  数据质量</text><text x="598" y="542" class="body">核查事实、格式、重复与许可</text><text x="598" y="580" class="body">覆盖目标任务与失败案例</text><text x="598" y="629" class="small">示范错了，模型也可能学错</text>
<text x="1115" y="490" class="h">06  评估与边界</text><text x="1115" y="542" class="body">比较基础模型与 SFT 模型</text><text x="1115" y="580" class="body">看真实回答，不只看 Loss</text><text x="1115" y="629" class="small">偏好优化与 SFT 是后续不同阶段</text>
<rect x="54" y="727" width="1492" height="111" rx="20" fill="#193955"/><text x="800" y="773" text-anchor="middle" class="body white">一句话记住：SFT 用示范教模型“看到这样的前文后，助手应怎样继续”。</text><text x="800" y="809" text-anchor="middle" class="small" style="fill:#c7ddeb">对话数据 → 模板 → Token 序列 → 选择目标位置 → 预测与更新 → 真实问题评估</text>
</svg>
