<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="670" viewBox="0 0 1600 670" role="img" aria-labelledby="t d"><title id="t">FP32 FP16 BF16 对比</title><desc id="d">比较三种浮点格式的符号位、指数位、尾数位、范围与精度，并说明混合精度分工。</desc><defs><linearGradient id="h"><stop stop-color="#10233f"/><stop offset="1" stop-color="#285382"/></linearGradient><filter id="s"><feDropShadow dy="6" stdDeviation="8" flood-color="#233753" flood-opacity=".11"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#172b45}.w{fill:#fff}.l{fill:#d8e6f6}.m{fill:#61738a}.b{fill:#326fc3}.g{fill:#238d7e}.o{fill:#c76b32}.h1{font-size:36px;font-weight:700}.h2{font-size:21px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.c{text-anchor:middle}</style></defs><rect width="1600" height="670" rx="24" fill="#f2f6fa"/><path d="M24 0h1552a24 24 0 0 1 24 24v105H0V24A24 24 0 0 1 24 0z" fill="url(#h)"/><text x="50" y="55" class="h1 w">FP32、FP16、BF16：少掉的位数去了哪里？</text><text x="50" y="88" class="body l">指数决定动态范围，尾数决定能表示得多精细</text><g filter="url(#s)"><rect x="70" y="150" width="460" height="255" rx="16" fill="#fff"/><rect x="570" y="150" width="460" height="255" rx="16" fill="#fff"/><rect x="1070" y="150" width="460" height="255" rx="16" fill="#fff"/></g><text x="300" y="190" class="h2 b c">FP32 · 32 bits · 4 Bytes</text><text x="800" y="190" class="h2 o c">FP16 · 16 bits · 2 Bytes</text><text x="1300" y="190" class="h2 g c">BF16 · 16 bits · 2 Bytes</text><g><rect x="110" y="225" width="35" height="55" rx="6" fill="#dce8f7"/><rect x="149" y="225" width="120" height="55" rx="6" fill="#a9c7ea"/><rect x="273" y="225" width="217" height="55" rx="6" fill="#6094cf"/><text x="127" y="258" class="small c">1</text><text x="209" y="258" class="small c">指数 8</text><text x="381" y="258" class="small w c">尾数 23</text><rect x="610" y="225" width="55" height="55" rx="6" fill="#f6e0d2"/><rect x="669" y="225" width="100" height="55" rx="6" fill="#e8ad82"/><rect x="773" y="225" width="217" height="55" rx="6" fill="#cf7841"/><text x="637" y="258" class="small c">1</text><text x="719" y="258" class="small c">指数 5</text><text x="881" y="258" class="small w c">尾数 10</text><rect x="1110" y="225" width="55" height="55" rx="6" fill="#d8eee9"/><rect x="1169" y="225" width="175" height="55" rx="6" fill="#87c9bd"/><rect x="1348" y="225" width="142" height="55" rx="6" fill="#319886"/><text x="1137" y="258" class="small c">1</text><text x="1256" y="258" class="small c">指数 8</text><text x="1419" y="258" class="small w c">尾数 7</text></g><g class="c"><text x="300" y="325" class="body">范围大，精度高</text><text x="300" y="360" class="small m">稳定，但显存和带宽开销高</text><text x="800" y="325" class="body">范围小，尾数比 BF16 长</text><text x="800" y="360" class="small m">常需 Loss Scaling 防止梯度下溢</text><text x="1300" y="325" class="body">范围接近 FP32，尾数较短</text><text x="1300" y="360" class="small m">更适合大模型训练的数值范围</text></g><g filter="url(#s)"><rect x="130" y="465" width="1340" height="140" rx="16" fill="#fff"/></g><text x="175" y="507" class="h2">混合精度不是“全部改成 16 位”</text><text x="175" y="550" class="body b">低精度：矩阵乘法、参数副本、激活值 → 更快、更省显存</text><text x="830" y="550" class="body g">FP32：累加、主权重、优化器状态 → 保持稳定</text><text x="800" y="585" class="small m c">FP16：范围不足时使用 Loss Scaling　｜　BF16：通常依靠更大的指数范围直接训练</text><text x="800" y="648" class="body m c">精度格式的选择，本质是在数值范围、表示精度、显存、速度与硬件支持之间取平衡。</text></svg>
