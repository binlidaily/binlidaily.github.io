<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="t d"><title id="t">大模型第七课复习总图</title><desc id="d">总结 FP32 FP16 BF16 的范围、精度、显存差异和混合精度训练。</desc><defs><linearGradient id="h"><stop stop-color="#10233f"/><stop offset="1" stop-color="#285382"/></linearGradient><filter id="s"><feDropShadow dy="5" stdDeviation="8" flood-color="#233753" flood-opacity=".1"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#172b45}.w{fill:#fff}.l{fill:#d8e6f6}.m{fill:#61738a}.b{fill:#326fc3}.g{fill:#238d7e}.o{fill:#c76b32}.h1{font-size:36px;font-weight:700}.h2{font-size:22px;font-weight:700}.h3{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.c{text-anchor:middle}</style></defs><rect width="1600" height="820" rx="24" fill="#f2f6fa"/><path d="M24 0h1552a24 24 0 0 1 24 24v112H0V24A24 24 0 0 1 24 0z" fill="url(#h)"/><text x="50" y="58" class="h1 w">大模型第七课：FP32、FP16、BF16 与混合精度</text><text x="50" y="94" class="body l">复习总图 · 位数越少越省，但范围与精度需要重新平衡</text><text x="52" y="160" class="h2">01　三种格式</text><g filter="url(#s)"><rect x="52" y="186" width="480" height="190" rx="16" fill="#fff"/><rect x="560" y="186" width="480" height="190" rx="16" fill="#fff"/><rect x="1068" y="186" width="480" height="190" rx="16" fill="#fff"/></g><text x="82" y="228" class="h3 b">FP32：1 / 8 / 23</text><text x="82" y="270" class="body">4 Bytes，范围大，尾数精细</text><text x="82" y="306" class="body">训练稳定，但慢且占显存</text><text x="82" y="348" class="small m">常用于主权重与优化器状态</text><text x="590" y="228" class="h3 o">FP16：1 / 5 / 10</text><text x="590" y="270" class="body">2 Bytes，范围明显变小</text><text x="590" y="306" class="body">小梯度可能下溢，大数可能溢出</text><text x="590" y="348" class="small m">常配合动态 Loss Scaling</text><text x="1098" y="228" class="h3 g">BF16：1 / 8 / 7</text><text x="1098" y="270" class="body">2 Bytes，范围接近 FP32</text><text x="1098" y="306" class="body">尾数较短，但训练范围友好</text><text x="1098" y="348" class="small m">现代大模型训练常用</text><text x="52" y="438" class="h2">02　两个核心概念</text><g filter="url(#s)"><rect x="52" y="464" width="730" height="130" rx="16" fill="#fff"/><rect x="818" y="464" width="730" height="130" rx="16" fill="#fff"/></g><text x="92" y="507" class="h3 b">指数位 → 动态范围</text><text x="92" y="549" class="body">决定能表示多大、多小的数量级；不足会 Overflow / Underflow</text><text x="858" y="507" class="h3 g">尾数位 → 表示精度</text><text x="858" y="549" class="body">决定两个相近数字能否区分；不足会带来更大的舍入误差</text><text x="52" y="650" class="h2">03　混合精度分工</text><g filter="url(#s)"><rect x="52" y="676" width="1496" height="92" rx="16" fill="#fff"/></g><text x="90" y="720" class="body"><tspan class="b">低精度</tspan>　矩阵乘法与激活：省显存、提吞吐</text><text x="600" y="720" class="body"><tspan class="g">FP32</tspan>　主权重、累加与状态：保稳定</text><text x="1070" y="720" class="body"><tspan class="o">框架</tspan>　自动选择算子精度并检查溢出</text><text x="800" y="752" class="small m c">BF16 范围更大，不代表它比 FP16 更精细；二者解决的是不同问题。</text><text x="800" y="802" class="body m c">低精度负责速度，FP32 负责稳定性，这就是混合精度训练的核心。</text></svg>
