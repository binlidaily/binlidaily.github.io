<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">第二十四课终期项目复习总图</title><desc id="desc">项目目标、六个验收关口、交付证据及模型能力边界。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf6f4"/></linearGradient><linearGradient id="head" x2="1"><stop stop-color="#142d4c"/><stop offset="1" stop-color="#23647b"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#12304d" flood-opacity=".1"/></filter></defs>
<style>.t{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1a3650}.w{fill:#fff}.b{font-weight:700}.sm{font-size:21px;fill:#567083}.body{font-size:24px}</style>
<rect width="1440" height="820" rx="30" fill="url(#bg)"/><rect width="1440" height="126" rx="30" fill="url(#head)"/><rect y="98" width="1440" height="28" fill="url(#head)"/><text class="t w b" x="60" y="66" font-size="40">第 24 课复习：小模型项目怎样算做完？</text><text class="t w" x="62" y="106" font-size="22" opacity=".85">不是看一段生成文本，而是看完整证据链</text>
<rect x="54" y="159" width="1332" height="103" rx="19" fill="#fff" filter="url(#s)"/><text class="t b" x="80" y="202" font-size="28">目标</text><text class="t body" x="80" y="239">在固定短故事数据上训练小型 Decoder-only 模型；评估、恢复训练，并运行本地续写接口。</text>
<g filter="url(#s)"><rect x="54" y="296" width="642" height="160" rx="19" fill="#fff"/><rect x="744" y="296" width="642" height="160" rx="19" fill="#fff"/><rect x="54" y="486" width="642" height="160" rx="19" fill="#fff"/><rect x="744" y="486" width="642" height="160" rx="19" fill="#fff"/></g>
<text class="t b" x="80" y="341" font-size="28">① 数据与分词</text><text class="t body" x="80" y="382">切分、去重、许可、校验值</text><text class="t sm" x="80" y="422">保存词表与固定 encode/decode 样例</text>
<text class="t b" x="770" y="341" font-size="28">② 训练与调试</text><text class="t body" x="770" y="382">先过拟合 64 个样本</text><text class="t sm" x="770" y="422">再记录训练/验证曲线、配置和显存</text>
<text class="t b" x="80" y="531" font-size="28">③ 评估与恢复</text><text class="t body" x="80" y="572">验证 Loss、固定提示词、失败案例</text><text class="t sm" x="80" y="612">实际中断并恢复，核对 Step 与学习率</text>
<text class="t b" x="770" y="531" font-size="28">④ 本地服务与交付</text><text class="t body" x="770" y="572">接口限长，测 TTFT 与后续延迟</text><text class="t sm" x="770" y="612">README、运行命令、报告、模型卡</text>
<rect x="54" y="682" width="1332" height="92" rx="20" fill="#1a3b55"/><text class="t w b" x="80" y="720" font-size="26">能力边界要写进报告</text><text class="t w" x="80" y="753" font-size="22">短故事续写 ≠ 聊天、事实问答或安全对齐；公开服务还需另做访问控制与隐私设计。</text>
</svg>
