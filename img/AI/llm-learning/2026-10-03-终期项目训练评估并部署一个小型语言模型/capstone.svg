<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="690" viewBox="0 0 1440 690" role="img" aria-labelledby="title desc">
<title id="title">终期项目：从数据到本地推理服务</title><desc id="desc">短故事数据，分词器，小型 Decoder-only 模型，训练，评估，断点恢复和本地接口组成完整闭环。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef7f5"/></linearGradient><linearGradient id="head" x2="1"><stop stop-color="#142d4c"/><stop offset="1" stop-color="#24647b"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="11" flood-color="#12304d" flood-opacity=".11"/></filter><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7193ae"/></marker></defs>
<style>.t{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#19354e}.w{fill:#fff}.b{font-weight:700}.sm{font-size:21px;fill:#577184}.mid{font-size:24px}</style>
<rect width="1440" height="690" rx="30" fill="url(#bg)"/><rect width="1440" height="130" rx="30" fill="url(#head)"/><rect y="100" width="1440" height="30" fill="url(#head)"/><text class="t w b" x="58" y="66" font-size="39">终期项目：把小模型做成可验证的闭环</text><text class="t w" x="60" y="107" font-size="22" opacity=".85">短故事续写 · 从头训练 · 本地运行</text>
<g filter="url(#s)"><rect x="54" y="180" width="300" height="190" rx="20" fill="#fff"/><rect x="398" y="180" width="300" height="190" rx="20" fill="#fff"/><rect x="742" y="180" width="300" height="190" rx="20" fill="#fff"/><rect x="1086" y="180" width="300" height="190" rx="20" fill="#fff"/></g>
<circle cx="91" cy="218" r="21" fill="#2d79ad"/><text class="t w b" x="82" y="226" font-size="22">1</text><text class="t b" x="121" y="227" font-size="28">数据定版</text><text class="t mid" x="77" y="286">固定短故事子集</text><text class="t sm" x="77" y="327">切分、去重、许可、校验值</text>
<circle cx="435" cy="218" r="21" fill="#2d79ad"/><text class="t w b" x="426" y="226" font-size="22">2</text><text class="t b" x="465" y="227" font-size="28">训练分词器</text><text class="t mid" x="421" y="286">保存词表和特殊 Token</text><text class="t sm" x="421" y="327">固定样例检查编码与解码</text>
<circle cx="779" cy="218" r="21" fill="#168473"/><text class="t w b" x="770" y="226" font-size="22">3</text><text class="t b" x="809" y="227" font-size="28">训练小模型</text><text class="t mid" x="765" y="286">先记住 64 个样本</text><text class="t sm" x="765" y="327">通过后再跑固定数据子集</text>
<circle cx="1123" cy="218" r="21" fill="#168473"/><text class="t w b" x="1114" y="226" font-size="22">4</text><text class="t b" x="1153" y="227" font-size="28">评估与恢复</text><text class="t mid" x="1109" y="286">看验证 Loss 和失败案例</text><text class="t sm" x="1109" y="327">中断后核对 Step、学习率</text>
<path d="M356 275H390M700 275H734M1044 275H1078" stroke="#7193ae" stroke-width="3" fill="none" marker-end="url(#a)"/>
<rect x="54" y="412" width="1332" height="124" rx="20" fill="#e8f3f8" stroke="#c5deeb"/><text class="t b" x="79" y="458" font-size="29">最后接到本地服务</text><text class="t mid" x="79" y="499">指定 Checkpoint → 输入故事开头 → 返回短续写；测延迟与内存，限制长度和并发</text>
<rect x="54" y="564" width="1332" height="81" rx="20" fill="#183b57"/><text class="t w b" x="80" y="600" font-size="25">交付证据：代码版本 + 数据/分词器版本 + 配置 + 曲线 + 固定样例 + 恢复日志 + 模型卡</text><text class="t w" x="80" y="630" font-size="21">能力边界：短故事续写模型，不是聊天助手，也不是事实问答系统。</text>
</svg>
