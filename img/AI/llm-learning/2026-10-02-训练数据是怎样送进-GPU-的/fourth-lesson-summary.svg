<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="t d"><title id="t">大模型第四课复习总图</title><desc id="d">总结训练数据从清洗、分词、拼接切块、组批、遮罩到 GPU 的全过程。</desc><defs><linearGradient id="h"><stop stop-color="#10233f"/><stop offset="1" stop-color="#285382"/></linearGradient><filter id="s"><feDropShadow dy="5" stdDeviation="8" flood-color="#233753" flood-opacity=".1"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#172b45}.w{fill:#fff}.l{fill:#d8e6f6}.m{fill:#61738a}.b{fill:#326fc3}.g{fill:#238d7e}.h1{font-size:36px;font-weight:700}.h2{font-size:22px;font-weight:700}.h3{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.c{text-anchor:middle}</style></defs><rect width="1600" height="820" rx="24" fill="#f2f6fa"/><path d="M24 0h1552a24 24 0 0 1 24 24v112H0V24A24 24 0 0 1 24 0z" fill="url(#h)"/><text x="50" y="58" class="h1 w">大模型第四课：训练数据怎样送进 GPU？</text><text x="50" y="94" class="body l">复习总图 · 从杂乱文档到 [B,T] Token 矩阵</text><text x="52" y="160" class="h2">01　数据流水线</text><g filter="url(#s)"><rect x="52" y="184" width="1496" height="118" rx="16" fill="#fff"/></g><text x="100" y="232" class="h3 b">原始文本</text><text x="286" y="232" class="h3">→ 清洗 / 去重</text><text x="526" y="232" class="h3">→ Tokenize + &lt;eos&gt;</text><text x="814" y="232" class="h3">→ Chunk / Pack</text><text x="1068" y="232" class="h3">→ Shuffle / Batch</text><text x="1332" y="232" class="h3 g">→ GPU</text><text x="800" y="274" class="small m c">质量过滤保内容 · 特殊 Token 保边界 · 固定窗口保形状 · 预取数据保吞吐</text><text x="52" y="360" class="h2">02　四个关键概念</text><g filter="url(#s)"><rect x="52" y="386" width="360" height="190" rx="16" fill="#fff"/><rect x="432" y="386" width="360" height="190" rx="16" fill="#fff"/><rect x="812" y="386" width="360" height="190" rx="16" fill="#fff"/><rect x="1192" y="386" width="356" height="190" rx="16" fill="#fff"/></g><text x="82" y="428" class="h3 b">① 文档边界</text><text x="82" y="470" class="body">用 &lt;eos&gt; 标记文档结束</text><text x="82" y="505" class="body">避免无关文档自然粘连</text><text x="82" y="548" class="small m">边界本身也是训练信息</text><text x="462" y="428" class="h3 b">② Chunk 与 Packing</text><text x="462" y="470" class="body">长文切开，短文拼入窗口</text><text x="462" y="505" class="body">减少 Padding 和算力浪费</text><text x="462" y="548" class="small m mono">固定 Sequence Length = T</text><text x="842" y="428" class="h3 g">③ 两种 Mask</text><text x="842" y="470" class="body">Padding Mask：忽略空位</text><text x="842" y="505" class="body">Causal Mask：遮住未来</text><text x="842" y="548" class="small m">用途不同，不要混淆</text><text x="1222" y="428" class="h3 g">④ DataLoader</text><text x="1222" y="470" class="body">Shuffle、Batch、Collate</text><text x="1222" y="505" class="body">Prefetch、传输到 GPU</text><text x="1222" y="548" class="small m">避免 GPU 等待数据</text><text x="52" y="632" class="h2">03　记住这 5 件事</text><g filter="url(#s)"><rect x="52" y="658" width="1496" height="110" rx="16" fill="#fff"/></g><g class="body"><text x="88" y="702"><tspan class="b">1</tspan>　先清洗、过滤、去重</text><text x="372" y="702"><tspan class="b">2</tspan>　&lt;eos&gt; 保留文档边界</text><text x="690" y="702"><tspan class="b">3</tspan>　Pack 减少空位</text><text x="960" y="702"><tspan class="g">4</tspan>　Batch 形状为 [B,T]</text><text x="1270" y="702"><tspan class="g">5</tspan>　持续喂饱 GPU</text></g><text x="800" y="744" class="small m c">Epoch ≈ 遍历一遍数据集；Step = 优化器完成一次参数更新。</text><text x="800" y="802" class="body m c">高质量的数据决定模型学什么，高效的数据流水线决定昂贵算力有没有被充分利用。</text></svg>
