<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="t d"><title id="t">大模型训练数据流水线</title><desc id="d">原始文本经过清洗、分词、拼接切块、组批、生成遮罩，最终送入 GPU。</desc><defs><linearGradient id="h"><stop stop-color="#10233f"/><stop offset="1" stop-color="#285382"/></linearGradient><filter id="s"><feDropShadow dy="6" stdDeviation="8" flood-color="#233753" flood-opacity=".11"/></filter><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#3f75b7"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#172b45}.w{fill:#fff}.l{fill:#d8e6f6}.m{fill:#61738a}.b{fill:#326fc3}.g{fill:#238d7e}.h1{font-size:36px;font-weight:700}.h2{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.c{text-anchor:middle}.arrow{stroke:#3f75b7;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs><rect width="1600" height="620" rx="24" fill="#f2f6fa"/><path d="M24 0h1552a24 24 0 0 1 24 24v105H0V24A24 24 0 0 1 24 0z" fill="url(#h)"/><text x="50" y="55" class="h1 w">训练数据怎样送进 GPU？</text><text x="50" y="88" class="body l">把杂乱文本变成形状稳定、边界清楚的 Token 矩阵</text><g filter="url(#s)"><rect x="35" y="150" width="205" height="190" rx="15" fill="#fff"/><rect x="270" y="150" width="205" height="190" rx="15" fill="#fff"/><rect x="505" y="150" width="205" height="190" rx="15" fill="#fff"/><rect x="740" y="150" width="205" height="190" rx="15" fill="#fff"/><rect x="975" y="150" width="205" height="190" rx="15" fill="#fff"/><rect x="1210" y="150" width="205" height="190" rx="15" fill="#fff"/><rect x="1445" y="150" width="120" height="190" rx="15" fill="#fff"/></g><path class="arrow" d="M240 245h24M475 245h24M710 245h24M945 245h24M1180 245h24M1415 245h24"/><g class="c"><text x="137" y="184" class="h2">1 · 原始文本</text><text x="137" y="232" class="body">网页｜书籍</text><text x="137" y="264" class="body">代码｜对话</text><text x="137" y="312" class="small m">长短、格式不一</text><text x="372" y="184" class="h2">2 · 清洗</text><text x="372" y="232" class="body">过滤｜去重</text><text x="372" y="264" class="body">质量与安全</text><text x="372" y="312" class="small m">得到可用文档</text><text x="607" y="184" class="h2">3 · Tokenize</text><text x="607" y="232" class="body mono">[314,923,…]</text><text x="607" y="264" class="body g">追加 &lt;eos&gt;</text><text x="607" y="312" class="small m">保留文档边界</text><text x="842" y="184" class="h2">4 · Chunk / Pack</text><text x="842" y="232" class="body">切长文｜拼短文</text><text x="842" y="264" class="body mono">固定长度 T</text><text x="842" y="312" class="small m">减少空位浪费</text><text x="1077" y="184" class="h2">5 · Batch</text><text x="1077" y="232" class="body">Shuffle + Collate</text><text x="1077" y="264" class="body mono">[B,T]</text><text x="1077" y="312" class="small m">组织训练张量</text><text x="1312" y="184" class="h2">6 · Masks</text><text x="1312" y="232" class="body">Padding Mask</text><text x="1312" y="264" class="body">Causal Mask</text><text x="1312" y="312" class="small m">标记可见位置</text><text x="1505" y="184" class="h2">7</text><text x="1505" y="240" class="h2 g">GPU</text><text x="1505" y="276" class="body mono">IDs</text><text x="1505" y="312" class="small m">训练</text></g><g filter="url(#s)"><rect x="120" y="405" width="640" height="145" rx="16" fill="#fff"/><rect x="840" y="405" width="640" height="145" rx="16" fill="#fff"/></g><text x="155" y="447" class="h2 b">提高有效 Token 比例</text><text x="155" y="485" class="body">Packing 减少 Padding；合理长度减少无效计算</text><text x="155" y="521" class="small m">目标：让 GPU 时间尽量用于真实 Token</text><text x="875" y="447" class="h2 g">让计算与数据准备重叠</text><text x="875" y="485" class="body">CPU Prefetch 下一批，GPU 计算当前批</text><text x="875" y="521" class="small m">目标：避免昂贵的 GPU 等数据</text><text x="800" y="592" class="body m c">一条高效流水线，不只要求数据正确，还要让数据持续、快速地到达 GPU。</text></svg>
