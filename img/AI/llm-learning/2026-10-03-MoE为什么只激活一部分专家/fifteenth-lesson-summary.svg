<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc"><title id="title">MoE 第十五课复习总图</title><desc id="desc">MoE 由 Router 逐 Token 选择少数 FFN 专家，形成总参数与激活参数之别，同时需要负载均衡并承担通信成本。</desc><defs><linearGradient id="head" x2="1" y2="1"><stop stop-color="#10243e"/><stop offset="1" stop-color="#285e8b"/></linearGradient><filter id="shadow"><feDropShadow dy="6" stdDeviation="9" flood-color="#17324a" flood-opacity=".11"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#142b44}.white{fill:#fff}.muted{fill:#62778a}.title{font-size:38px;font-weight:750}.sub{font-size:19px}.h2{font-size:24px;font-weight:700}.h3{font-size:19px;font-weight:700}.body{font-size:17px}.small{font-size:15px}</style></defs><rect width="1600" height="1080" rx="28" fill="#f4f7fa"/><path d="M28 0h1544a28 28 0 0 1 28 28v140H0V28A28 28 0 0 1 28 0z" fill="url(#head)"/><text x="58" y="62" class="title white">第 15 课复习：MoE 的稀疏路由</text><text x="58" y="104" class="sub" fill="#d8e7f5">核心：准备很多 FFN 专家，但每个 Token 只执行 Router 选中的少数几位</text><g filter="url(#shadow)"><rect x="50" y="185" width="1500" height="150" rx="22" fill="#fff"/><rect x="50" y="370" width="475" height="340" rx="22" fill="#eaf2fb"/><rect x="562" y="370" width="475" height="340" rx="22" fill="#eaf7f1"/><rect x="1074" y="370" width="476" height="340" rx="22" fill="#fff0e7"/><rect x="50" y="745" width="730" height="280" rx="22" fill="#fff"/><rect x="820" y="745" width="730" height="280" rx="22" fill="#fff"/></g>
<text x="80" y="225" class="h2">一条路线</text><rect x="245" y="215" width="210" height="72" rx="16" fill="#eaf2fb"/><text x="350" y="259" class="h3" text-anchor="middle">Token 表示</text><text x="490" y="260" class="h2" text-anchor="middle">→</text><rect x="530" y="215" width="210" height="72" rx="16" fill="#eaf2fb"/><text x="635" y="259" class="h3" text-anchor="middle">Router 打分</text><text x="775" y="260" class="h2" text-anchor="middle">→</text><rect x="815" y="215" width="260" height="72" rx="16" fill="#eaf2fb"/><text x="945" y="259" class="h3" text-anchor="middle">Top-K 专家执行</text><text x="1110" y="260" class="h2" text-anchor="middle">→</text><rect x="1150" y="215" width="290" height="72" rx="16" fill="#eaf2fb"/><text x="1295" y="259" class="h3" text-anchor="middle">加权合并结果</text>
<text x="80" y="420" class="h2">① 专家与路由</text><text x="80" y="472" class="body">专家通常是独立 FFN</text><text x="80" y="514" class="body">Router 给每个 Token 算专家分数</text><text x="80" y="556" class="body">每层、每个 Token 都可走不同路线</text><rect x="80" y="607" width="405" height="66" rx="16" fill="#dcebf8"/><text x="282" y="647" class="h3" text-anchor="middle">Top-1 或 Top-2：只执行少数</text>
<text x="592" y="420" class="h2">② 参数与计算</text><text x="592" y="472" class="body">E：可选专家总数</text><text x="592" y="514" class="body">K：每个 Token 激活的专家数</text><text x="592" y="556" class="body">K 远小于 E，专家计算随 K 增长</text><rect x="592" y="607" width="405" height="66" rx="16" fill="#dcefe6"/><text x="795" y="647" class="h3" text-anchor="middle">总参数 ≠ 激活参数</text>
<text x="1104" y="420" class="h2">③ 系统代价</text><text x="1104" y="472" class="body">热门专家排队，冷门专家闲置</text><text x="1104" y="514" class="body">训练需要负载均衡与容量管理</text><text x="1104" y="556" class="body">跨 GPU 路由产生通信成本</text><rect x="1104" y="607" width="405" height="66" rx="16" fill="#fae7d8"/><text x="1306" y="647" class="h3" text-anchor="middle">少算不保证实际更快</text>
<text x="80" y="793" class="h2">用 8 位专家记忆</text><text x="80" y="843" class="body">全部执行：每 Token 算 8 套 FFN</text><text x="80" y="886" class="body">Top-2：每 Token 算 2 套 FFN</text><text x="80" y="929" class="body">Top-1：每 Token 算 1 套 FFN</text><text x="80" y="985" class="small muted">其他专家仍要存放，Router 和共享层仍有成本</text>
<text x="850" y="793" class="h2">判断一个 MoE，要问</text><text x="850" y="843" class="body">多少总参数？多少每 Token 激活参数？</text><text x="850" y="886" class="body">专家路由是否均衡？是否跨设备？</text><text x="850" y="929" class="body">端到端延迟和吞吐实测怎样？</text><rect x="1195" y="955" width="310" height="48" rx="16" fill="#eaf2fb"/><text x="1350" y="986" class="small" text-anchor="middle">专家不是预先命名的职业</text><text x="800" y="1060" class="small muted" text-anchor="middle">Router → Top-K → Experts → Weighted Combine · Capacity → Balance → Communication</text></svg>
