<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">一个 Token 如何经过 MoE</title><desc id="desc">Token 的上下文表示经过 Router 打分，选择四位专家中的两位，执行后加权合并；其他专家本次不执行。</desc><defs><linearGradient id="head" x2="1" y2="1"><stop stop-color="#10243e"/><stop offset="1" stop-color="#285e8b"/></linearGradient><filter id="shadow"><feDropShadow dy="6" stdDeviation="9" flood-color="#17324a" flood-opacity=".12"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#7392af"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#142b44}.white{fill:#fff}.muted{fill:#64778a}.title{font-size:38px;font-weight:750}.subtitle{font-size:20px}.h2{font-size:25px;font-weight:700}.body{font-size:18px}.small{font-size:15px}.line{fill:none;stroke:#7392af;stroke-width:3;marker-end:url(#arrow)}.active-line{fill:none;stroke:#2d72b5;stroke-width:5;marker-end:url(#arrow)}</style></defs><rect width="1600" height="900" rx="28" fill="#f4f7fa"/><path d="M28 0h1544a28 28 0 0 1 28 28v140H0V28A28 28 0 0 1 28 0z" fill="url(#head)"/><text x="58" y="64" class="title white">MoE：为什么只让每个 Token 找少数专家？</text><text x="58" y="108" class="subtitle" fill="#d9e8f6">总共准备 4 位 FFN 专家，这次只让“喜欢”经过其中 2 位</text>
<g filter="url(#shadow)"><rect x="55" y="245" width="245" height="360" rx="22" fill="#fff"/><rect x="360" y="245" width="250" height="360" rx="22" fill="#fff"/><rect x="670" y="220" width="430" height="410" rx="22" fill="#fff"/><rect x="1160" y="245" width="385" height="360" rx="22" fill="#fff"/></g>
<text x="85" y="291" class="h2">① Token 表示</text><rect x="100" y="360" width="155" height="84" rx="19" fill="#e7f0fa"/><text x="178" y="395" class="h2" text-anchor="middle" fill="#2d72b5">喜欢</text><text x="178" y="425" class="small muted" text-anchor="middle">已读过上下文</text><text x="178" y="532" class="body muted" text-anchor="middle">每个位置单独路由</text>
<path d="M300 402h59" class="line"/><text x="390" y="291" class="h2">② Router 打分</text><text x="390" y="344" class="body">专家 1　0.08</text><text x="390" y="394" class="body" fill="#2d72b5">专家 2　0.52</text><text x="390" y="444" class="body" fill="#2d72b5">专家 3　0.31</text><text x="390" y="494" class="body">专家 4　0.09</text><rect x="390" y="540" width="185" height="40" rx="20" fill="#e7f0fa"/><text x="483" y="567" class="small" text-anchor="middle" fill="#2d72b5">Top-2：选 2、3</text>
<path d="M610 402h58" class="line"/><text x="700" y="270" class="h2">③ 只执行选中的 FFN</text><g><rect x="705" y="320" width="160" height="87" rx="17" fill="#edf1f5"/><text x="785" y="357" class="body muted" text-anchor="middle">专家 1</text><text x="785" y="385" class="small muted" text-anchor="middle">本次不执行</text><rect x="890" y="320" width="170" height="87" rx="17" fill="#e1f0fb" stroke="#70a6cf" stroke-width="2"/><text x="975" y="357" class="body" text-anchor="middle">专家 2</text><text x="975" y="385" class="small" text-anchor="middle">执行 · 0.52</text><rect x="705" y="450" width="160" height="87" rx="17" fill="#e1f0fb" stroke="#70a6cf" stroke-width="2"/><text x="785" y="487" class="body" text-anchor="middle">专家 3</text><text x="785" y="515" class="small" text-anchor="middle">执行 · 0.31</text><rect x="890" y="450" width="170" height="87" rx="17" fill="#edf1f5"/><text x="975" y="487" class="body muted" text-anchor="middle">专家 4</text><text x="975" y="515" class="small muted" text-anchor="middle">本次不执行</text></g><text x="885" y="590" class="small muted" text-anchor="middle">专家是独立 FFN；名称不代表固定学科</text>
<path d="M1100 402h58" class="line"/><text x="1190" y="291" class="h2">④ 加权合并</text><text x="1190" y="360" class="body">输出 = g₂E₂(x) + g₃E₃(x)</text><rect x="1200" y="405" width="300" height="100" rx="20" fill="#e8f3ee"/><text x="1350" y="445" class="body" text-anchor="middle">新的“喜欢”表示</text><text x="1350" y="477" class="small muted" text-anchor="middle">写回当前 Token</text><text x="1350" y="557" class="small muted" text-anchor="middle">下一层仍可重新路由</text>
<rect x="160" y="695" width="1280" height="120" rx="24" fill="#e8f0f7"/><text x="800" y="745" class="h2" text-anchor="middle">4 套权重可用，实际只计算 2 套</text><text x="800" y="785" class="body muted" text-anchor="middle">总参数增加 ≠ 每个 Token 的计算同比例增加；通信与负载仍会影响实际速度</text><text x="800" y="862" class="small muted" text-anchor="middle">示意分数用于解释 Top-K；真实路由随模型和上下文变化</text></svg>
