<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">大模型第三课复习总图</title><desc id="d">总结下一个 Token 训练的样本构造、前向计算、交叉熵、反向传播、参数更新以及训练和生成的区别。</desc><defs><linearGradient id="h"><stop stop-color="#10233f"/><stop offset="1" stop-color="#285382"/></linearGradient><filter id="s"><feDropShadow dy="5" stdDeviation="8" flood-color="#233753" flood-opacity=".1"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#172b45}.w{fill:#fff}.l{fill:#d8e6f6}.m{fill:#61738a}.b{fill:#326fc3}.g{fill:#238d7e}.h1{font-size:36px;font-weight:700}.h2{font-size:22px;font-weight:700}.h3{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.c{text-anchor:middle}.mid{dominant-baseline:middle}</style></defs><rect width="1600" height="900" rx="24" fill="#f2f6fa"/><path d="M24 0h1552a24 24 0 0 1 24 24v112H0V24A24 24 0 0 1 24 0z" fill="url(#h)"/><text x="50" y="58" class="h1 w">大模型第三课：怎样学会预测下一个 Token？</text><text x="50" y="94" class="body l">复习总图 · 用正确答案计算误差，再用梯度修改参数</text><text x="52" y="160" class="h2">01　训练闭环</text><g filter="url(#s)"><rect x="52" y="185" width="286" height="140" rx="15" fill="#fff"/><rect x="355" y="185" width="286" height="140" rx="15" fill="#fff"/><rect x="658" y="185" width="286" height="140" rx="15" fill="#fff"/><rect x="961" y="185" width="286" height="140" rx="15" fill="#fff"/><rect x="1264" y="185" width="284" height="140" rx="15" fill="#fff"/></g><g class="c"><text x="195" y="218" class="small b">1 · 数据</text><text x="195" y="258" class="h3">输入与标签错开一位</text><text x="195" y="296" class="small m">X:[A,B,C]　Y:[B,C,D]</text><text x="498" y="218" class="small b">2 · Forward</text><text x="498" y="258" class="h3">预测每个位置</text><text x="498" y="296" class="small m mono">Logits [B,T,V]</text><text x="801" y="218" class="small b">3 · Loss</text><text x="801" y="258" class="h3 mono">−log p(y)</text><text x="801" y="296" class="small m">和正确 Token 比较</text><text x="1104" y="218" class="small g">4 · Backward</text><text x="1104" y="258" class="h3 mono">∇θL</text><text x="1104" y="296" class="small m">计算所有参数梯度</text><text x="1406" y="218" class="small g">5 · Step</text><text x="1406" y="258" class="h3 mono">θ ← θ − η∇θL</text><text x="1406" y="296" class="small m">优化器更新参数</text></g><text x="52" y="382" class="h2">02　四个关键理解</text><g filter="url(#s)"><rect x="52" y="408" width="360" height="210" rx="16" fill="#fff"/><rect x="432" y="408" width="360" height="210" rx="16" fill="#fff"/><rect x="812" y="408" width="360" height="210" rx="16" fill="#fff"/><rect x="1192" y="408" width="356" height="210" rx="16" fill="#fff"/></g><g><text x="82" y="450" class="h3 b">① Next Token Prediction</text><text x="82" y="490" class="body">每个位置根据左侧上下文</text><text x="82" y="524" class="body">预测紧随其后的 Token</text><text x="82" y="574" class="small m">简单目标，逼出复杂能力</text><text x="462" y="450" class="h3 b">② Teacher Forcing</text><text x="462" y="490" class="body">训练时使用真实前文</text><text x="462" y="524" class="body">多个位置可以并行计算</text><text x="462" y="574" class="small m">Causal Mask 仍遮住未来</text><text x="842" y="450" class="h3 g">③ Cross Entropy</text><text x="842" y="490" class="body">正确答案概率越低</text><text x="842" y="524" class="body">Loss 就越大</text><text x="842" y="574" class="small m">Padding 通常不参与损失</text><text x="1222" y="450" class="h3 g">④ Gradient Descent</text><text x="1222" y="490" class="body">梯度指明修改方向</text><text x="1222" y="524" class="body">学习率决定更新幅度</text><text x="1222" y="574" class="small m">重复许多批次逐步学习</text></g><text x="52" y="674" class="h2">03　训练 vs. 生成</text><g filter="url(#s)"><rect x="52" y="700" width="735" height="145" rx="16" fill="#fff"/><rect x="813" y="700" width="735" height="145" rx="16" fill="#fff"/></g><text x="86" y="742" class="h3 b">训练：有标签、可并行、更新参数</text><text x="86" y="780" class="body">真实 Token 作为前文 → 计算 Loss → Backward → Optimizer Step</text><text x="86" y="816" class="small m">目标是让正确 Token 的概率逐渐升高</text><text x="847" y="742" class="h3 g">生成：无标签、逐 Token、不更新参数</text><text x="847" y="780" class="body">模型输出 → 采样一个 Token → 追加 → 再次预测</text><text x="847" y="816" class="small m">目标是使用已经学到的参数完成任务</text><text x="800" y="878" class="body m c">训练是在有答案的练习册上改参数；生成是在没有答案的新问题上使用参数。</text></svg>
