<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680" role="img" aria-labelledby="t d"><title id="t">下一个 Token 训练流程</title><desc id="d">文本错位生成输入和标签，模型前向计算概率，通过交叉熵、反向传播和优化器更新参数。</desc><defs><linearGradient id="h"><stop stop-color="#10233f"/><stop offset="1" stop-color="#285382"/></linearGradient><filter id="s"><feDropShadow dy="6" stdDeviation="8" flood-color="#233753" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#3f75b7"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#172b45}.w{fill:#fff}.l{fill:#d8e6f6}.m{fill:#61738a}.b{fill:#326fc3}.g{fill:#238d7e}.h1{font-size:36px;font-weight:700}.h2{font-size:21px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.c{text-anchor:middle}.mid{dominant-baseline:middle}.arrow{stroke:#3f75b7;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs><rect width="1600" height="680" rx="24" fill="#f2f6fa"/><path d="M24 0h1552a24 24 0 0 1 24 24v105H0V24A24 24 0 0 1 24 0z" fill="url(#h)"/><text x="50" y="55" class="h1 w">大模型怎样学会预测下一个 Token？</text><text x="50" y="88" class="body l">预测 → 对答案 → 计算损失 → 反向传播 → 更新参数</text><g filter="url(#s)"><rect x="42" y="150" width="250" height="190" rx="16" fill="#fff"/><rect x="338" y="150" width="250" height="190" rx="16" fill="#fff"/><rect x="634" y="150" width="250" height="190" rx="16" fill="#fff"/><rect x="930" y="150" width="250" height="190" rx="16" fill="#fff"/><rect x="1226" y="150" width="330" height="190" rx="16" fill="#fff"/></g><path class="arrow" d="M292 245h40M588 245h40M884 245h40M1180 245h40"/><g class="c"><text x="167" y="184" class="h2">1 · 构造样本</text><text x="167" y="225" class="body b">输入：小猫｜趴在｜窗边</text><text x="167" y="259" class="body g">标签：趴在｜窗边｜因为</text><text x="167" y="309" class="small m">同一序列错开一位</text><text x="463" y="184" class="h2">2 · 前向计算</text><text x="463" y="229" class="body">Embedding → Transformer</text><text x="463" y="263" class="body">→ LM Head → Logits</text><text x="463" y="309" class="small m mono">[B,T] → [B,T,V]</text><text x="759" y="184" class="h2">3 · 交叉熵</text><text x="759" y="235" class="h2 b mono">L = −log p(y)</text><text x="759" y="275" class="body">正确答案概率越低</text><text x="759" y="309" class="small m">Loss 越大</text><text x="1055" y="184" class="h2">4 · 反向传播</text><text x="1055" y="235" class="h2 mono">∇θ L</text><text x="1055" y="275" class="body">算出每个参数的梯度</text><text x="1055" y="309" class="small m">找到改进方向</text><text x="1391" y="184" class="h2">5 · 更新参数</text><text x="1391" y="235" class="h2 g mono">θ ← θ − η∇θL</text><text x="1391" y="275" class="body">让正确 Token 的概率上升</text><text x="1391" y="309" class="small m">进入下一批数据</text></g><path d="M1391 350v80H167v-80" fill="none" stroke="#238d7e" stroke-width="3" marker-end="url(#a)"/><text x="779" y="420" class="body g c">重复许多批次：参数逐渐学会文本中的统计规律</text><g filter="url(#s)"><rect x="150" y="475" width="600" height="145" rx="16" fill="#fff"/><rect x="850" y="475" width="600" height="145" rx="16" fill="#fff"/></g><text x="190" y="514" class="h2">训练：有答案的练习</text><text x="190" y="552" class="body">真实前文 + Causal Mask，一次并行预测多个位置</text><text x="190" y="588" class="small m">计算 Loss，并通过梯度更新模型参数</text><text x="890" y="514" class="h2">生成：没有答案的应用</text><text x="890" y="552" class="body">使用刚刚生成的 Token，一次只向后走一步</text><text x="890" y="588" class="small m">不计算 Loss，也不更新模型参数</text></svg>
