<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">第二十二课复习总图：LoRA 与 QLoRA</title><desc id="desc">总结低秩增量、参数量、QLoRA量化、显存边界、部署及评估。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f9fbfd"/><stop offset="1" stop-color="#eaf3f6"/></linearGradient><linearGradient id="hd" x2="1"><stop stop-color="#183757"/><stop offset="1" stop-color="#2e617e"/></linearGradient><filter id="s"><feDropShadow dy="6" stdDeviation="9" flood-color="#16334a" flood-opacity=".11"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#17314c}.title{font-size:37px;font-weight:700;fill:#fff}.sub{font-size:18px;fill:#d7e9f5}.h{font-size:22px;font-weight:700;fill:#24639a}.body{font-size:19px}.small{font-size:16px;fill:#637b8e}.white{fill:#fff}</style></defs>
<rect width="1600" height="900" rx="26" fill="url(#bg)"/><path d="M26 0h1548a26 26 0 0 1 26 26v108H0V26A26 26 0 0 1 26 0z" fill="url(#hd)"/><text x="50" y="58" class="title">第二十二课 · LoRA / QLoRA 复习总图</text><text x="50" y="99" class="sub">少训练什么，少存什么，还有哪些成本没有消失？</text>
<g filter="url(#s)"><rect x="54" y="178" width="458" height="225" rx="20" fill="#fff"/><rect x="571" y="178" width="458" height="225" rx="20" fill="#fff"/><rect x="1088" y="178" width="458" height="225" rx="20" fill="#fff"/><rect x="54" y="443" width="458" height="225" rx="20" fill="#fff"/><rect x="571" y="443" width="458" height="225" rx="20" fill="#fff"/><rect x="1088" y="443" width="458" height="225" rx="20" fill="#fff"/></g>
<text x="81" y="225" class="h">01  LoRA 更新</text><text x="81" y="277" class="body">冻结原矩阵 W</text><text x="81" y="315" class="body">训练两块小矩阵 A、B</text><text x="81" y="364" class="small">输出 = Wx + 缩放后的 B(Ax)</text>
<text x="598" y="225" class="h">02  参数量</text><text x="598" y="277" class="body">4096×4096：1677 万</text><text x="598" y="315" class="body">Rank 8：LoRA 仅 6.55 万</text><text x="598" y="364" class="small">约 0.39%，只针对这一层</text>
<text x="1115" y="225" class="h">03  QLoRA 多做一步</text><text x="1115" y="277" class="body">冻结基础权重用 4-bit 存放</text><text x="1115" y="315" class="body">训练的仍是 LoRA Adapter</text><text x="1115" y="364" class="small">不是所有计算都用 INT4</text>
<text x="81" y="490" class="h">04  Rank 与目标层</text><text x="81" y="542" class="body">Rank 决定增量的宽度</text><text x="81" y="580" class="body">目标层决定改动范围</text><text x="81" y="629" class="small">更大、更广不保证更好</text>
<text x="598" y="490" class="h">05  显存与速度</text><text x="598" y="542" class="body">仍需基础模型和激活</text><text x="598" y="580" class="body">Batch、序列长度影响峰值</text><text x="598" y="629" class="small">4-bit 不保证训练更快</text>
<text x="1115" y="490" class="h">06  训练后</text><text x="1115" y="542" class="body">Adapter 配对基础模型加载</text><text x="1115" y="580" class="body">可单存；合并看格式支持</text><text x="1115" y="629" class="small">质量、显存、速度分别评估</text>
<rect x="54" y="727" width="1492" height="111" rx="20" fill="#193955"/><text x="800" y="773" text-anchor="middle" class="body white">一句话：LoRA 少训练参数；QLoRA 还压缩冻结的基础权重。</text><text x="800" y="809" text-anchor="middle" class="small" style="fill:#c7ddeb">数据质量、激活显存和真实评估，仍然重要</text>
</svg>
