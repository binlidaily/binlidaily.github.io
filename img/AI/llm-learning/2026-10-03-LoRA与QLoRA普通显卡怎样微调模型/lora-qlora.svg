<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
<title id="title">LoRA 与 QLoRA：同一层的三种训练方式</title><desc id="desc">全参数微调更新大矩阵；LoRA 冻结大矩阵并训练低秩支路；QLoRA 进一步以四位存放冻结权重。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf5f6"/></linearGradient><linearGradient id="hd" x2="1"><stop stop-color="#173755"/><stop offset="1" stop-color="#2b6177"/></linearGradient><filter id="s"><feDropShadow dy="6" stdDeviation="9" flood-color="#173c55" flood-opacity=".12"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#18334e}.title{font-size:36px;font-weight:700;fill:#fff}.sub{font-size:18px;fill:#d8ebf3}.h{font-size:24px;font-weight:700;fill:#246487}.body{font-size:20px}.small{font-size:17px;fill:#667d8c}.num{font-size:32px;font-weight:700}.green{fill:#17816e}.blue{fill:#2a6a9e}.orange{fill:#b76834}.white{fill:#fff}</style></defs>
<rect width="1600" height="760" rx="26" fill="url(#bg)"/><path d="M26 0h1548a26 26 0 0 1 26 26v108H0V26A26 26 0 0 1 26 0z" fill="url(#hd)"/><text x="50" y="58" class="title">LoRA 与 QLoRA：到底省了哪两笔？</text><text x="50" y="98" class="sub">同一块 4096×4096 线性层：谁参与更新？冻结权重又怎样存？</text>
<g filter="url(#s)"><rect x="50" y="186" width="474" height="424" rx="23" fill="#fff"/><rect x="563" y="186" width="474" height="424" rx="23" fill="#fff"/><rect x="1076" y="186" width="474" height="424" rx="23" fill="#fff"/></g>
<text x="79" y="235" class="h">01  全参数微调</text><rect x="82" y="273" width="410" height="125" rx="18" fill="#f7e8df"/><text x="287" y="326" text-anchor="middle" class="num orange">W</text><text x="287" y="366" text-anchor="middle" class="small">16,777,216 个参数，全部更新</text><text x="79" y="460" class="body">训练：W 本身</text><text x="79" y="502" class="body">还需：梯度、优化器状态</text><text x="79" y="562" class="small">显存开销大，调整空间也大</text>
<text x="592" y="235" class="h">02  LoRA</text><rect x="595" y="273" width="410" height="89" rx="16" fill="#e7eef7"/><text x="800" y="310" text-anchor="middle" class="num blue">W 冻结</text><text x="800" y="343" text-anchor="middle" class="small">保留基础模型权重</text><rect x="595" y="382" width="410" height="78" rx="16" fill="#dff3eb"/><text x="800" y="430" text-anchor="middle" class="body green">只训练增量 B · A</text><text x="592" y="502" class="body">Rank 8：65,536 个参数</text><text x="592" y="562" class="small">省掉 W 的梯度与优化器状态</text>
<text x="1105" y="235" class="h">03  QLoRA</text><rect x="1108" y="273" width="410" height="89" rx="16" fill="#e7eef7"/><text x="1313" y="310" text-anchor="middle" class="num blue">W 冻结 · 4-bit 存放</text><text x="1313" y="343" text-anchor="middle" class="small">计算时按实现方式还原</text><rect x="1108" y="382" width="410" height="78" rx="16" fill="#dff3eb"/><text x="1313" y="430" text-anchor="middle" class="body green">仍只训练增量 B · A</text><text x="1105" y="502" class="body">Rank 8：65,536 个参数</text><text x="1105" y="562" class="small">再省冻结基础权重的存储</text>
<rect x="50" y="642" width="1500" height="73" rx="18" fill="#193b55"/><text x="800" y="687" text-anchor="middle" class="body white">注意：参数少 ≠ 总显存只剩这些参数；激活、Batch、序列长度仍要算。</text>
</svg>
