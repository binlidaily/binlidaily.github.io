<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">FlashAttention：公式相同，数据流不同</title><desc id="desc">上方是普通实现的显存往返，下方是 FlashAttention 的分块和在线 Softmax</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7faff"/><stop offset="1" stop-color="#edf4fb"/></linearGradient><filter id="shadow"><feDropShadow dy="7" stdDeviation="12" flood-color="#24466a" flood-opacity=".11"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#6089b4"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#17304b}.title{font-size:37px;font-weight:700}.sub{font-size:20px;fill:#5c7290}.label{font-size:24px;font-weight:700}.step{font-size:22px;font-weight:650}.small{font-size:18px;fill:#627991}.white{fill:#fff}.blue{fill:#1d5f9d}.teal{fill:#157d78}.orange{fill:#aa5728}</style></defs>
<rect width="1400" height="760" rx="26" fill="url(#bg)"/><rect width="1400" height="137" rx="26" fill="#17365c"/><rect y="104" width="1400" height="33" fill="#17365c"/><text x="52" y="62" class="title white">FlashAttention：公式没变，数据流变了</text><text x="52" y="103" class="sub white">目标：少写、少读巨大的注意力中间矩阵</text>
<g filter="url(#shadow)"><rect x="48" y="174" width="1304" height="222" rx="22" fill="#fff"/><rect x="48" y="422" width="1304" height="242" rx="22" fill="#fff"/></g>
<rect x="71" y="196" width="174" height="46" rx="23" fill="#ffe9df"/><text x="158" y="226" text-anchor="middle" class="label orange">朴素实现</text><text x="270" y="227" class="small">以完整中间矩阵为边界，反复读写 HBM</text>
<g><rect x="78" y="267" width="205" height="78" rx="15" fill="#eaf3fe"/><text x="180" y="314" text-anchor="middle" class="step blue">QKᵀ：分数</text><rect x="369" y="267" width="205" height="78" rx="15" fill="#fff0e9"/><text x="471" y="314" text-anchor="middle" class="step orange">写回 HBM</text><rect x="660" y="267" width="205" height="78" rx="15" fill="#eaf3fe"/><text x="762" y="314" text-anchor="middle" class="step blue">Softmax</text><rect x="951" y="267" width="205" height="78" rx="15" fill="#fff0e9"/><text x="1053" y="314" text-anchor="middle" class="step orange">再写回 HBM</text></g><g stroke="#6089b4" stroke-width="4" marker-end="url(#arrow)"><path d="M292 306h65"/><path d="M583 306h65"/><path d="M874 306h65"/></g><text x="1193" y="315" class="small">→ 乘 V</text>
<rect x="71" y="444" width="228" height="46" rx="23" fill="#dff5f1"/><text x="185" y="474" text-anchor="middle" class="label teal">FlashAttention</text><text x="320" y="475" class="small">分块留在片上，更新少量统计量与输出</text>
<g><rect x="80" y="521" width="238" height="82" rx="15" fill="#e8f5f2"/><text x="199" y="554" text-anchor="middle" class="step teal">Q / K / V 分块</text><text x="199" y="582" text-anchor="middle" class="small">载入片上 SRAM</text><rect x="408" y="521" width="238" height="82" rx="15" fill="#e8f5f2"/><text x="527" y="554" text-anchor="middle" class="step teal">局部算分数</text><text x="527" y="582" text-anchor="middle" class="small">不留整张分数表</text><rect x="736" y="521" width="238" height="82" rx="15" fill="#e8f5f2"/><text x="855" y="554" text-anchor="middle" class="step teal">在线 Softmax</text><text x="855" y="582" text-anchor="middle" class="small">更新最大值与和</text><rect x="1064" y="521" width="238" height="82" rx="15" fill="#e8f5f2"/><text x="1183" y="554" text-anchor="middle" class="step teal">写回输出</text><text x="1183" y="582" text-anchor="middle" class="small">不写整张中间表</text></g><g stroke="#6089b4" stroke-width="4" marker-end="url(#arrow)"><path d="M326 562h70"/><path d="M654 562h70"/><path d="M982 562h70"/></g>
<rect x="240" y="686" width="920" height="48" rx="24" fill="#dbe8f6"/><text x="700" y="717" text-anchor="middle" class="step blue">数学定义相同 · 中间显存与数据搬运减少 · 计算量仍为平方量级</text>
</svg>
