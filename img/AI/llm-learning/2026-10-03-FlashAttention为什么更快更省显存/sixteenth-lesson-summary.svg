<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc"><title id="title">第十六课复习总图：FlashAttention</title><desc id="desc">问题、解决方法、在线 Softmax、反向重算与边界</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef5fb"/></linearGradient><filter id="s"><feDropShadow dy="6" stdDeviation="10" flood-color="#24466a" flood-opacity=".11"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#18324e}.title{font-size:37px;font-weight:700}.sub{font-size:20px;fill:#d7e8f7}.h{font-size:25px;font-weight:700}.b{font-size:20px}.small{font-size:18px;fill:#617992}.blue{fill:#2768a7}.teal{fill:#197c76}.orange{fill:#af5b2d}</style></defs><rect width="1400" height="980" rx="26" fill="url(#bg)"/><rect width="1400" height="137" rx="26" fill="#17365c"/><rect y="104" width="1400" height="33" fill="#17365c"/><text x="50" y="63" class="title" fill="#fff">第十六课 · FlashAttention 一页复习</text><text x="50" y="104" class="sub">公式不变，改变的是 GPU 内存之间的数据流</text>
<g filter="url(#s)"><rect x="52" y="174" width="628" height="226" rx="21" fill="#fff"/><rect x="720" y="174" width="628" height="226" rx="21" fill="#fff"/><rect x="52" y="429" width="628" height="226" rx="21" fill="#fff"/><rect x="720" y="429" width="628" height="226" rx="21" fill="#fff"/><rect x="52" y="685" width="1296" height="226" rx="21" fill="#fff"/></g>
<text x="82" y="224" class="h orange">01 · 原问题：中间表反复搬运</text><text x="82" y="267" class="b">QKᵀ → 写 HBM → Softmax → 再写 HBM → 乘 V</text><text x="82" y="309" class="b">序列长 T 时，分数矩阵有 T × T 个元素。</text><text x="82" y="353" class="small">4096 × 4096 的 FP16 单张表约 32 MiB。</text>
<text x="750" y="224" class="h teal">02 · 核心方法：分块留在片上</text><text x="750" y="267" class="b">Q / K / V 分块载入 SRAM，做局部计算。</text><text x="750" y="309" class="b">不把整张分数或概率表写回 HBM。</text><text x="750" y="353" class="small">减少 IO 与中间显存，不是跳过必要的配对。</text>
<text x="82" y="479" class="h blue">03 · 在线 Softmax：旧结果重新标定</text><text x="82" y="525" class="b">保存行最大值 m、指数和 ℓ、加权输出。</text><text x="82" y="566" class="b">新块出现更大值时，缩放旧贡献再相加。</text><text x="82" y="609" class="small">数学上仍是同一 Softmax；浮点结果可能不逐位相同。</text>
<text x="750" y="479" class="h blue">04 · 训练反向：少存，必要时重算</text><text x="750" y="525" class="b">不保存庞大中间矩阵；反向重算局部结果。</text><text x="750" y="566" class="b">多一些算术，换更少 HBM 读写。</text><text x="750" y="609" class="small">具体收益看硬件、形状、精度与内核版本。</text>
<text x="82" y="737" class="h orange">最容易混淆的三件事</text><text x="82" y="783" class="b">精确 Attention ≠ 每一位浮点数都完全相同</text><text x="82" y="824" class="b">中间显存减少 ≠ 全部显存开销消失</text><text x="82" y="865" class="b">IO 更少 ≠ 计算复杂度从 O(T²) 变成 O(T)</text>
<rect x="312" y="930" width="776" height="34" rx="17" fill="#dbe9f6"/><text x="700" y="954" text-anchor="middle" class="small">一句话：用在线 Softmax 把分块计算接起来，避免整张中间表的显存往返。</text></svg>
