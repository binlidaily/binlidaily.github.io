<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040" role="img" aria-labelledby="t d"><title id="t">第二十课复习总图：模型量化</title><desc id="d">概括数值格点、舍入和截断、权重量化与激活量化，以及模型大小质量速度的边界</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf5fb"/></linearGradient><filter id="s"><feDropShadow dy="6" stdDeviation="10" flood-color="#24466a" flood-opacity=".11"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#17304b}.h{font-size:37px;font-weight:700}.sub{font-size:20px;fill:#d9e8f6}.title{font-size:25px;font-weight:700}.body{font-size:20px}.small{font-size:18px;fill:#61768b}.blue{fill:#286cab}.teal{fill:#188078}.orange{fill:#ad5a27}</style></defs><rect width="1400" height="1040" rx="26" fill="url(#bg)"/><rect width="1400" height="136" rx="26" fill="#17365c"/><rect y="105" width="1400" height="31" fill="#17365c"/><text x="52" y="62" class="h" fill="#fff">第二十课 · 量化一页复习</text><text x="52" y="103" class="sub">低比特先改变数值表示；质量与速度要分别验证</text>
<g filter="url(#s)"><rect x="52" y="174" width="1296" height="145" rx="20" fill="#fff"/><rect x="52" y="347" width="628" height="266" rx="20" fill="#fff"/><rect x="720" y="347" width="628" height="266" rx="20" fill="#fff"/><rect x="52" y="641" width="628" height="267" rx="20" fill="#fff"/><rect x="720" y="641" width="628" height="267" rx="20" fill="#fff"/></g>
<text x="82" y="225" class="title blue">最小例子：0.37 落到格点</text><text x="82" y="267" class="body">INT8：47 / 127 ≈ 0.37008　　INT4：3 / 7 ≈ 0.42857</text><text x="82" y="299" class="small">同为 [-1,1] 对称示意范围；实际方案可能选其他 Scale、零点与分组。</text>
<text x="82" y="399" class="title orange">01 · 可能丢掉什么</text><text x="82" y="443" class="body">舍入：两个格点之间，只能取近似值。</text><text x="82" y="483" class="body">截断：超出范围的数被夹到边界。</text><text x="82" y="532" class="small">数值有误差 ≠ 每个任务都明显变差。</text><text x="82" y="571" class="small">真实质量需靠任务评测。</text>
<text x="750" y="399" class="title teal">02 · 怎样减少关键误差</text><text x="750" y="443" class="body">按通道或分组设 Scale，贴近局部范围。</text><text x="750" y="483" class="body">GPTQ 补偿误差；AWQ 保护敏感通道。</text><text x="750" y="532" class="small">需要更多元数据，也依赖校准和实现。</text><text x="750" y="571" class="small">低位宽不是“无损压缩”。</text>
<text x="82" y="693" class="title blue">03 · 看清量化对象</text><text x="82" y="737" class="body">Weight-only：主要压权重。</text><text x="82" y="777" class="body">W8A8：权重与激活都用 8 位。</text><text x="82" y="826" class="small">“4-bit 模型”不代表全部计算用 4 位。</text><text x="82" y="865" class="small">KV Cache 是否量化，要另外确认。</text>
<text x="750" y="693" class="title orange">04 · 三笔账分别算</text><text x="750" y="737" class="body">体积：原始权重比特减少。</text><text x="750" y="777" class="body">质量：看真实任务与校准方法。</text><text x="750" y="817" class="body">速度：看带宽、反量化、内核和硬件。</text><text x="750" y="865" class="small">文件小，不保证端到端一定更快。</text>
<rect x="200" y="943" width="1000" height="67" rx="27" fill="#dceaf7"/><text x="700" y="985" text-anchor="middle" class="title blue">Scale 决定格点；位宽决定数量；效果由整个模型与实现决定。</text></svg>
