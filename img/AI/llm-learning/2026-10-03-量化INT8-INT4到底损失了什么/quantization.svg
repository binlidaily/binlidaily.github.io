<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="t d"><title id="t">同一个权重的 INT8 与 INT4 量化示意</title><desc id="d">权重 0.37 在正负一范围内，INT8 近似为 47 除以 127，INT4 近似为 3 除以 7</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf5fb"/></linearGradient><filter id="s"><feDropShadow dy="7" stdDeviation="12" flood-color="#24466a" flood-opacity=".11"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#17304b}.h{font-size:37px;font-weight:700}.sub{font-size:20px;fill:#d9e8f6}.title{font-size:25px;font-weight:700}.body{font-size:21px}.small{font-size:18px;fill:#61768b}.blue{fill:#286cab}.teal{fill:#188078}.orange{fill:#ad5a27}</style></defs><rect width="1400" height="800" rx="26" fill="url(#bg)"/><rect width="1400" height="136" rx="26" fill="#17365c"/><rect y="105" width="1400" height="31" fill="#17365c"/><text x="52" y="62" class="h" fill="#fff">量化：一个数怎样落到有限的格点上？</text><text x="52" y="103" class="sub">教学示例：权重 0.37，表示范围 [-1, 1]，对称均匀量化</text>
<g filter="url(#s)"><rect x="52" y="174" width="1296" height="129" rx="20" fill="#fff"/><rect x="52" y="330" width="628" height="278" rx="20" fill="#fff"/><rect x="720" y="330" width="628" height="278" rx="20" fill="#fff"/></g>
<text x="82" y="223" class="title blue">原始权重：0.37</text><text x="82" y="268" class="body">先确定范围与 Scale，再取最近的整数格点；计算时按 Scale 还原近似值。</text>
<text x="82" y="382" class="title blue">INT8 · 格点较密</text><text x="82" y="430" class="body">整数范围：-127 到 127</text><text x="82" y="471" class="body">Scale = 1 / 127</text><text x="82" y="512" class="body">存下 47 → 还原 47 / 127 ≈ 0.37008</text><text x="82" y="562" class="small">本例绝对误差 ≈ 0.00008</text>
<text x="750" y="382" class="title orange">INT4 · 格点较疏</text><text x="750" y="430" class="body">示意整数范围：-7 到 7</text><text x="750" y="471" class="body">Scale = 1 / 7</text><text x="750" y="512" class="body">存下 3 → 还原 3 / 7 ≈ 0.42857</text><text x="750" y="562" class="small">本例绝对误差 ≈ 0.05857</text>
<rect x="84" y="637" width="1232" height="115" rx="20" fill="#dceaf7"/><text x="700" y="681" text-anchor="middle" class="title blue">位数更少 → 可用格点更少 → 数值近似可能更粗</text><text x="700" y="722" text-anchor="middle" class="small">单个权重的误差不能直接当作模型质量损失，也不能推出实际速度。</text></svg>
