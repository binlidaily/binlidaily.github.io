<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" role="img" aria-labelledby="title desc">
<title id="title">从偏好数据到 RLHF 与 DPO</title><desc id="desc">一个技术分享问题，回答 A 优于 B；同一偏好对分别进入奖励模型加 PPO 和 DPO 训练路线。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#ecf4f8"/></linearGradient><linearGradient id="head" x2="1"><stop stop-color="#132c4b"/><stop offset="1" stop-color="#24567b"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#12304d" flood-opacity=".10"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7597b5"/></marker></defs>
<style>.t{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#17314b}.small{font-size:22px;fill:#557087}.body{font-size:26px}.strong{font-weight:700}.cap{font-size:23px;fill:#31536e}.white{fill:#fff}</style>
<rect width="1440" height="790" rx="32" fill="url(#bg)"/><rect width="1440" height="145" rx="32" fill="url(#head)"/><rect y="112" width="1440" height="33" fill="url(#head)"/>
<text class="t white strong" x="62" y="72" font-size="42">两个回答，模型怎样学会选更好的？</text><text class="t white" x="64" y="115" font-size="24" opacity=".84">同一组偏好数据，可以走两条训练路线</text>
<rect x="55" y="184" width="1330" height="98" rx="18" fill="#fff" filter="url(#shadow)"/><text class="t strong" x="83" y="226" font-size="25">用户的问题</text><text class="t body" x="83" y="263">“我只有 10 分钟，怎样准备一次技术分享？”</text>
<rect x="55" y="309" width="640" height="154" rx="20" fill="#e8f6f1" stroke="#b8ded1"/><circle cx="93" cy="350" r="22" fill="#15876e"/><text x="83" y="358" class="t white strong" font-size="22">A</text><text class="t strong" x="128" y="358" font-size="27">被选中 · 更可执行</text><text class="t cap" x="81" y="405">先写结论，用一个例子解释，</text><text class="t cap" x="81" y="436">最后留两分钟答疑。</text>
<rect x="745" y="309" width="640" height="154" rx="20" fill="#f1f4f8" stroke="#d2dde6"/><circle cx="783" cy="350" r="22" fill="#6e8193"/><text x="774" y="358" class="t white strong" font-size="22">B</text><text class="t strong" x="818" y="358" font-size="27">未被选中 · 太笼统</text><text class="t cap" x="771" y="405">充分准备，保持自信，</text><text class="t cap" x="771" y="436">多和听众交流。</text>
<path d="M375 468V502H374V517M1065 468V502H1066V517" fill="none" stroke="#7597b5" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="55" y="532" width="640" height="178" rx="21" fill="#fff" stroke="#b8d7e9" filter="url(#shadow)"/><rect x="55" y="532" width="640" height="54" rx="21" fill="#e6f2fb"/><rect x="55" y="565" width="640" height="21" fill="#e6f2fb"/><text class="t strong" x="81" y="568" font-size="29">经典 RLHF：先训练打分器</text><text class="t cap" x="81" y="623">偏好对 → 奖励模型 → 给新回答打分</text><text class="t cap" x="81" y="660">→ PPO 更新回答模型；参考模型限偏移</text>
<rect x="745" y="532" width="640" height="178" rx="21" fill="#fff" stroke="#bfdfd7" filter="url(#shadow)"/><rect x="745" y="532" width="640" height="54" rx="21" fill="#e6f5ef"/><rect x="745" y="565" width="640" height="21" fill="#e6f5ef"/><text class="t strong" x="771" y="568" font-size="29">DPO：直接用偏好对训练</text><text class="t cap" x="771" y="623">比较当前模型与固定参考模型</text><text class="t cap" x="771" y="660">对 A、B 的相对倾向；不单独训练奖励模型</text>
<text class="t small" x="60" y="755">共同边界：学到的是数据中的偏好信号；是否真正更好，仍要用独立问题评估。</text>
</svg>
