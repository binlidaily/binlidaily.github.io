<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">第二十三课：偏好对齐复习总图</title><desc id="desc">SFT 与偏好学习的关系、偏好数据、经典 RLHF 和 DPO 的区别，以及评估边界。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef6f7"/></linearGradient><linearGradient id="head" x2="1"><stop stop-color="#142d4c"/><stop offset="1" stop-color="#24647b"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#12304d" flood-opacity=".1"/></filter></defs>
<style>.t{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#19354e}.white{fill:#fff}.strong{font-weight:700}.sub{font-size:22px;fill:#536f82}.body{font-size:25px}</style>
<rect width="1440" height="900" rx="32" fill="url(#bg)"/><rect width="1440" height="130" rx="32" fill="url(#head)"/><rect y="100" width="1440" height="30" fill="url(#head)"/><text class="t white strong" x="60" y="69" font-size="39">第 23 课复习：RLHF、DPO 与偏好对齐</text><text class="t white" x="62" y="110" font-size="22" opacity=".85">先认清信号，再区分路线，最后检查边界</text>
<rect x="52" y="163" width="1336" height="132" rx="20" fill="#fff" filter="url(#s)"/><text class="t strong" x="79" y="209" font-size="27">从“示范答案”到“比较答案”</text><text class="t body" x="79" y="252">SFT：告诉模型怎样回答　　　偏好数据：同一问题下，A 比 B 更符合标准</text>
<rect x="52" y="327" width="1336" height="148" rx="20" fill="#eef7f4" stroke="#c4e3d9"/><text class="t strong" x="79" y="371" font-size="28">贯穿本课的例子：10 分钟技术分享</text><text class="t body" x="79" y="411">A 被选中：先写结论 → 用例子解释 → 留两分钟答疑</text><text class="t body" x="79" y="447">B 未被选中：充分准备，保持自信，多和听众交流（太笼统）</text>
<rect x="52" y="509" width="642" height="226" rx="20" fill="#fff" stroke="#bcd7e8" filter="url(#s)"/><text class="t strong" x="79" y="554" font-size="29">经典 RLHF：奖励模型 + PPO</text><text class="t body" x="79" y="603">① 用 A 胜 B 训练打分器</text><text class="t body" x="79" y="647">② 打分新回答，更新回答模型</text><text class="t sub" x="79" y="700">参考模型约束偏移；警惕“刷分”</text>
<rect x="746" y="509" width="642" height="226" rx="20" fill="#fff" stroke="#bfdfd6" filter="url(#s)"/><text class="t strong" x="773" y="554" font-size="29">DPO：直接偏好优化</text><text class="t body" x="773" y="603">① 同样使用 A 胜 B 的偏好对</text><text class="t body" x="773" y="647">② 相对固定参考模型直接更新</text><text class="t sub" x="773" y="700">不单独训练显式奖励模型；不跑 PPO</text>
<rect x="52" y="768" width="1336" height="83" rx="20" fill="#193b58"/><text class="t white strong" x="79" y="806" font-size="25">最后问：偏好数据代表谁？是否覆盖真实任务？</text><text class="t white" x="79" y="838" font-size="22">留出独立问题做人工比较；不要只看奖励分数或训练 Loss。</text>
</svg>
