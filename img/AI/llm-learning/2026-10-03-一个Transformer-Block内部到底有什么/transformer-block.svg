<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="t d"><title id="t">Transformer Block 内部数据流</title><desc id="d">展示 Pre-Norm Transformer Block 的 RMSNorm、Attention、残差相加、FFN 与第二次残差相加。</desc><defs><linearGradient id="h"><stop stop-color="#10233f"/><stop offset="1" stop-color="#285382"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3 0 6z" fill="#5d7da3"/></marker><filter id="s"><feDropShadow dy="5" stdDeviation="7" flood-color="#233753" flood-opacity=".12"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#172b45}.w{fill:#fff}.l{fill:#d8e6f6}.m{fill:#61738a}.b{fill:#326fc3}.g{fill:#238d7e}.o{fill:#c76b32}.h1{font-size:36px;font-weight:700}.h2{font-size:21px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.c{text-anchor:middle}</style></defs><rect width="1600" height="780" rx="24" fill="#f2f6fa"/><path d="M24 0h1552a24 24 0 0 1 24 24v112H0V24A24 24 0 0 1 24 0z" fill="url(#h)"/><text x="50" y="58" class="h1 w">一个 Transformer Block 内部到底有什么？</text><text x="50" y="94" class="body l">Pre-Norm 结构：交流一次、加工一次，并用两条残差路径保留输入</text><g stroke="#5d7da3" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M115 390h125"/><path d="M420 390h120"/><path d="M720 390h90"/><path d="M890 390h120"/><path d="M1190 390h90"/><path d="M1360 390h125"/></g><g filter="url(#s)"><rect x="40" y="335" width="150" height="110" rx="16" fill="#fff"/><rect x="240" y="320" width="180" height="140" rx="16" fill="#e9f1fc"/><rect x="540" y="300" width="180" height="180" rx="16" fill="#e3f4f0"/><circle cx="850" cy="390" r="40" fill="#fff"/><rect x="1010" y="320" width="180" height="140" rx="16" fill="#e9f1fc"/><rect x="1280" y="300" width="180" height="180" rx="16" fill="#f9eadf"/><circle cx="1520" cy="390" r="40" fill="#fff"/></g><g class="c"><text x="115" y="378" class="h2 b">输入 x</text><text x="115" y="414" class="small m">[B,T,d]</text><text x="330" y="372" class="h2 b">RMSNorm</text><text x="330" y="412" class="small m">稳定数值尺度</text><text x="630" y="360" class="h2 g">Attention</text><text x="630" y="400" class="body">Token 之间</text><text x="630" y="433" class="body">交换信息</text><text x="850" y="400" class="h1 b">+</text><text x="1100" y="372" class="h2 b">RMSNorm</text><text x="1100" y="412" class="small m">再次归一化</text><text x="1370" y="360" class="h2 o">FFN</text><text x="1370" y="400" class="body">每个 Token</text><text x="1370" y="433" class="body">单独加工</text><text x="1520" y="400" class="h1 b">+</text></g><path d="M115 335V210h735v133" fill="none" stroke="#326fc3" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#a)"/><path d="M850 350V555h670V438" fill="none" stroke="#326fc3" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#a)"/><text x="475" y="193" class="h2 b c">残差路径 1：把输入 x 直接加回来</text><text x="1185" y="590" class="h2 b c">残差路径 2：把 Attention 后的 h 加回来</text><g filter="url(#s)"><rect x="130" y="650" width="1340" height="82" rx="16" fill="#fff"/></g><text x="800" y="687" class="body c"><tspan class="g">Attention：跨 Token 交流</tspan>　　<tspan class="o">FFN：逐 Token 加工</tspan>　　<tspan class="b">Norm + Residual：稳定地堆叠很多层</tspan></text><text x="800" y="716" class="small m c">入口与出口始终保持 [B,T,d_model]，内容变了，形状不变。</text></svg>
