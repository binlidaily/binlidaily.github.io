<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" role="img" aria-labelledby="t d"><title id="t">大模型第九课复习总图</title><desc id="d">总结 Transformer Block 中 Attention、FFN、RMSNorm、残差连接的作用与形状。</desc><defs><linearGradient id="h"><stop stop-color="#10233f"/><stop offset="1" stop-color="#285382"/></linearGradient><filter id="s"><feDropShadow dy="5" stdDeviation="8" flood-color="#233753" flood-opacity=".1"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#172b45}.w{fill:#fff}.l{fill:#d8e6f6}.m{fill:#61738a}.b{fill:#326fc3}.g{fill:#238d7e}.o{fill:#c76b32}.h1{font-size:36px;font-weight:700}.h2{font-size:22px;font-weight:700}.h3{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.c{text-anchor:middle}</style></defs><rect width="1600" height="880" rx="24" fill="#f2f6fa"/><path d="M24 0h1552a24 24 0 0 1 24 24v112H0V24A24 24 0 0 1 24 0z" fill="url(#h)"/><text x="50" y="58" class="h1 w">大模型第九课：一个 Transformer Block 内部有什么？</text><text x="50" y="94" class="body l">复习总图 · 两个子层、两次归一化、两条残差路径</text><text x="52" y="160" class="h2">01　两行看懂 Pre-Norm Block</text><g filter="url(#s)"><rect x="52" y="186" width="1496" height="126" rx="16" fill="#fff"/></g><text x="800" y="232" class="h3 b c">h = x + Attention(RMSNorm(x))</text><text x="800" y="273" class="h3 o c">y = h + FFN(RMSNorm(h))</text><text x="52" y="380" class="h2">02　四个组件的分工</text><g filter="url(#s)"><rect x="52" y="406" width="350" height="195" rx="16" fill="#fff"/><rect x="434" y="406" width="350" height="195" rx="16" fill="#fff"/><rect x="816" y="406" width="350" height="195" rx="16" fill="#fff"/><rect x="1198" y="406" width="350" height="195" rx="16" fill="#fff"/></g><text x="82" y="450" class="h3 g">Attention</text><text x="82" y="490" class="body">不同 Token 交换信息</text><text x="82" y="528" class="body">形成上下文表示</text><text x="82" y="568" class="small m">唯一直接混合 Token 的子层</text><text x="464" y="450" class="h3 o">FFN</text><text x="464" y="490" class="body">逐个 Token 非线性加工</text><text x="464" y="528" class="body">内部升维后再降维</text><text x="464" y="568" class="small m">所有位置共享同一套参数</text><text x="846" y="450" class="h3 b">RMSNorm</text><text x="846" y="490" class="body">调整隐藏状态尺度</text><text x="846" y="528" class="body">放在两个子层之前</text><text x="846" y="568" class="small m">不改变形状，不混合 Token</text><text x="1228" y="450" class="h3 b">Residual</text><text x="1228" y="490" class="body">把子层输入直接加回来</text><text x="1228" y="528" class="body">保留信息与梯度通路</text><text x="1228" y="568" class="small m">要求两边形状完全相同</text><text x="52" y="670" class="h2">03　形状与堆叠</text><g filter="url(#s)"><rect x="52" y="696" width="1496" height="126" rx="16" fill="#fff"/></g><text x="110" y="745" class="body"><tspan class="b">输入</tspan> [B,T,d]</text><text x="405" y="745" class="body">→ Attention [B,T,d]</text><text x="790" y="745" class="body">→ FFN 内部 [B,T,d_ff]</text><text x="1195" y="745" class="body">→ <tspan class="g">输出</tspan> [B,T,d]</text><text x="800" y="790" class="small m c">形状保持不变，所以 Block 1 的输出可以直接送给 Block 2；每一层结构相同，参数不同。</text><text x="800" y="862" class="body m c">Attention 负责交流，FFN 负责加工，Norm 与 Residual 让这套结构稳定地重复很多次。</text></svg>
