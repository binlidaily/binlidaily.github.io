<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1010" viewBox="0 0 1400 1010" role="img" aria-labelledby="t d"><title id="t">KV Cache 第十八课复习总图</title><desc id="d">解释缓存内容、加速原因、显存公式和复用边界</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf5fb"/></linearGradient><filter id="s"><feDropShadow dy="6" stdDeviation="10" flood-color="#24466a" flood-opacity=".11"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#17304b}.h{font-size:37px;font-weight:700}.sub{font-size:20px;fill:#d9e8f6}.title{font-size:25px;font-weight:700}.body{font-size:20px}.small{font-size:18px;fill:#61768b}.blue{fill:#286cab}.teal{fill:#188078}.orange{fill:#ad5a27}</style></defs><rect width="1400" height="1010" rx="26" fill="url(#bg)"/><rect width="1400" height="136" rx="26" fill="#17365c"/><rect y="105" width="1400" height="31" fill="#17365c"/><text x="52" y="62" class="h" fill="#fff">第十八课 · KV Cache 一页复习</text><text x="52" y="104" class="sub">旧 K/V 不重算，新 Q 仍读历史；用显存换重复计算</text>
<g filter="url(#s)"><rect x="52" y="174" width="628" height="238" rx="21" fill="#fff"/><rect x="720" y="174" width="628" height="238" rx="21" fill="#fff"/><rect x="52" y="440" width="628" height="238" rx="21" fill="#fff"/><rect x="720" y="440" width="628" height="238" rx="21" fill="#fff"/><rect x="52" y="706" width="1296" height="215" rx="21" fill="#fff"/></g>
<text x="82" y="225" class="title blue">01 · 保存什么</text><text x="82" y="270" class="body">每层 Attention 的历史 K、V。</text><text x="82" y="311" class="body">新 Token 到来：新算 Q/K/V，追加 K/V。</text><text x="82" y="357" class="small">过去的 Q 通常不作为持久缓存保存。</text>
<text x="750" y="225" class="title teal">02 · 为什么加速</text><text x="750" y="270" class="body">旧位置不再反复做前向计算。</text><text x="750" y="311" class="body">每步只把新位置送进模型。</text><text x="750" y="357" class="small">但新 Q 仍要访问所有可见历史 K/V。</text>
<text x="82" y="491" class="title orange">03 · 付出的代价</text><text x="82" y="536" class="body">缓存随长度与并发增长，占显存和带宽。</text><text x="82" y="578" class="body">近似：2 × 层 × 批量 × 长度 × KV 头</text><text x="82" y="618" class="small">再乘每头维度与每元素字节数。</text>
<text x="750" y="491" class="title blue">04 · 何时不能复用</text><text x="750" y="536" class="body">提示词、位置、掩码或权重变了，</text><text x="750" y="578" class="body">受影响的旧缓存不能盲目沿用。</text><text x="750" y="618" class="small">相同前缀可共享，但要匹配计算条件。</text>
<text x="82" y="758" class="title teal">从 Prefill 到 Decode</text><text x="82" y="803" class="body">4 个提示词：缓存 4 份 K/V → 输入“巴黎”：追加 1 份 → 输入“。”：再追加 1 份。</text><text x="82" y="851" class="small">不缓存：各轮处理 4、5、6 个位置；缓存：各轮新处理 4、1、1 个位置。</text><text x="82" y="884" class="small">这里只数重新送入的位置，不把它当作速度比。</text>
<rect x="245" y="944" width="910" height="41" rx="20" fill="#dceaf7"/><text x="700" y="971" text-anchor="middle" class="small">核心边界：缓存省重复投影，不省掉当前 Query 对历史的 Attention。</text></svg>
