<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="t d"><title id="t">KV Cache 随逐 Token 生成增长</title><desc id="d">提示词预填充缓存四个位置，之后每一步只新增一个位置的 K 和 V</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf5fb"/></linearGradient><filter id="s"><feDropShadow dy="7" stdDeviation="12" flood-color="#24466a" flood-opacity=".11"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#17304b}.h{font-size:38px;font-weight:700}.sub{font-size:20px;fill:#d9e8f6}.section{font-size:23px;font-weight:700}.body{font-size:20px}.small{font-size:17px;fill:#61768b}.blue{fill:#286cab}.teal{fill:#188078}.orange{fill:#ad5a27}</style></defs><rect width="1400" height="780" rx="26" fill="url(#bg)"/><rect width="1400" height="136" rx="26" fill="#17365c"/><rect y="105" width="1400" height="31" fill="#17365c"/><text x="52" y="62" class="h" fill="#fff">KV Cache：旧 K/V 复用，新 K/V 追加</text><text x="52" y="102" class="sub">“法国 / 的 / 首都 / 是” → “巴黎” → “。”（Token 切分仅为示意）</text>
<g filter="url(#s)"><rect x="52" y="174" width="1296" height="150" rx="21" fill="#fff"/><rect x="52" y="350" width="1296" height="150" rx="21" fill="#fff"/><rect x="52" y="526" width="1296" height="150" rx="21" fill="#fff"/></g>
<text x="78" y="215" class="section blue">01 · Prefill</text><text x="78" y="250" class="small">处理整个提示词，保存每层这 4 个位置的 K/V</text><g><rect x="530" y="205" width="145" height="69" rx="12" fill="#e7f1fb"/><rect x="691" y="205" width="145" height="69" rx="12" fill="#e7f1fb"/><rect x="852" y="205" width="145" height="69" rx="12" fill="#e7f1fb"/><rect x="1013" y="205" width="145" height="69" rx="12" fill="#e7f1fb"/></g><text x="602" y="249" text-anchor="middle" class="body blue">法国</text><text x="763" y="249" text-anchor="middle" class="body blue">的</text><text x="924" y="249" text-anchor="middle" class="body blue">首都</text><text x="1085" y="249" text-anchor="middle" class="body blue">是</text><text x="1213" y="249" class="small">→ 巴黎</text>
<text x="78" y="391" class="section teal">02 · Decode</text><text x="78" y="426" class="small">输入“巴黎”：只算它的新 Q/K/V</text><rect x="530" y="381" width="628" height="69" rx="12" fill="#e7f1fb"/><text x="844" y="425" text-anchor="middle" class="body blue">已缓存：法国 / 的 / 首都 / 是</text><rect x="1175" y="381" width="145" height="69" rx="12" fill="#dcf4e9"/><text x="1247" y="425" text-anchor="middle" class="body teal">＋ 巴黎</text>
<text x="78" y="567" class="section teal">03 · 再 Decode</text><text x="78" y="602" class="small">输入“。”：再追加一个位置的 K/V</text><rect x="530" y="557" width="628" height="69" rx="12" fill="#e7f1fb"/><text x="844" y="601" text-anchor="middle" class="body blue">已缓存：前 4 个位置 ＋ 巴黎</text><rect x="1175" y="557" width="145" height="69" rx="12" fill="#dcf4e9"/><text x="1247" y="601" text-anchor="middle" class="body teal">＋ 。</text>
<rect x="163" y="706" width="1074" height="49" rx="24" fill="#dceaf7"/><text x="700" y="738" text-anchor="middle" class="section blue">每步只新增当前 K/V；当前 Q 仍要读取全部可见的历史 K/V</text></svg>
