<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="t d"><title id="t">Temperature、Top-K、Top-P 如何改变下一 Token 的候选</title><desc id="d">同一组候选经历调权重、限制个数、累计概率截断、抽样</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef5fb"/></linearGradient><filter id="s"><feDropShadow dy="7" stdDeviation="12" flood-color="#24466a" flood-opacity=".11"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#6c91b6"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#17304b}.h{font-size:38px;font-weight:700}.sub{font-size:20px;fill:#d7e7f5}.step{font-size:24px;font-weight:700}.body{font-size:19px}.small{font-size:17px;fill:#61768b}.blue{fill:#286cab}.teal{fill:#188078}.orange{fill:#ad5a27}</style></defs><rect width="1400" height="760" rx="26" fill="url(#bg)"/><rect width="1400" height="135" rx="26" fill="#17365c"/><rect y="105" width="1400" height="30" fill="#17365c"/><text x="52" y="62" class="h" fill="#fff">下一 Token 怎样从候选中选出来？</text><text x="52" y="102" class="sub">同一组分数：先调权重，再缩小候选集，最后抽样</text>
<g filter="url(#s)"><rect x="48" y="178" width="1304" height="457" rx="23" fill="#fff"/></g>
<text x="85" y="230" class="step">例子：“法国的首都是”</text><text x="85" y="270" class="body">初始概率：巴黎 55% · 北京 25% · 伦敦 12% · 东京 5% · 其他 3%</text>
<g><rect x="88" y="325" width="271" height="185" rx="18" fill="#e8f2fc"/><text x="114" y="373" class="step blue">01 · Temperature</text><text x="114" y="418" class="body">改变高低概率的差距</text><text x="114" y="457" class="small">低温更尖，高温更平</text><rect x="405" y="325" width="271" height="185" rx="18" fill="#e6f5f1"/><text x="431" y="373" class="step teal">02 · Top-K</text><text x="431" y="418" class="body">只留最高的 K 个</text><text x="431" y="457" class="small">K = 2 → 巴黎、北京</text><rect x="722" y="325" width="271" height="185" rx="18" fill="#fff0e7"/><text x="748" y="373" class="step orange">03 · Top-P</text><text x="748" y="418" class="body">累加到概率门槛</text><text x="748" y="457" class="small">候选个数随分布变化</text><rect x="1039" y="325" width="271" height="185" rx="18" fill="#eceafb"/><text x="1065" y="373" class="step">04 · Sampling</text><text x="1065" y="418" class="body">归一化后按权重抽</text><text x="1065" y="457" class="small">不是总选第一名</text></g><g stroke="#6c91b6" stroke-width="4" marker-end="url(#a)"><path d="M365 416h29"/><path d="M682 416h29"/><path d="M999 416h29"/></g><text x="700" y="575" text-anchor="middle" class="body">如果不启用 Top-K 或 Top-P，相应步骤可以跳过。</text>
<rect x="170" y="666" width="1060" height="61" rx="30" fill="#dceaf7"/><text x="700" y="705" text-anchor="middle" class="step blue">一句话：温度调权重 · Top-K 限个数 · Top-P 限累计概率</text></svg>
