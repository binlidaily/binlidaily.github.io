<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1010" viewBox="0 0 1400 1010" role="img" aria-labelledby="t d"><title id="t">第十七课复习总图：采样参数</title><desc id="d">Greedy、Sampling、Temperature、Top-K、Top-P 的作用与边界</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef5fb"/></linearGradient><filter id="s"><feDropShadow dy="6" stdDeviation="10" flood-color="#24466a" flood-opacity=".11"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#17304b}.h{font-size:37px;font-weight:700}.sub{font-size:20px;fill:#d7e8f7}.title{font-size:25px;font-weight:700}.body{font-size:20px}.small{font-size:18px;fill:#60758c}.blue{fill:#286cab}.teal{fill:#188078}.orange{fill:#ad5a27}</style></defs><rect width="1400" height="1010" rx="26" fill="url(#bg)"/><rect width="1400" height="136" rx="26" fill="#17365c"/><rect y="105" width="1400" height="31" fill="#17365c"/><text x="52" y="62" class="h" fill="#fff">第十七课 · 生成参数一页复习</text><text x="52" y="104" class="sub">模型给分数；解码策略决定下一 Token 怎样被选中</text>
<g filter="url(#s)"><rect x="52" y="172" width="1296" height="123" rx="20" fill="#fff"/><rect x="52" y="323" width="402" height="278" rx="20" fill="#fff"/><rect x="499" y="323" width="402" height="278" rx="20" fill="#fff"/><rect x="946" y="323" width="402" height="278" rx="20" fill="#fff"/><rect x="52" y="631" width="1296" height="294" rx="20" fill="#fff"/></g>
<text x="84" y="222" class="title blue">先分清两种选择方式</text><text x="84" y="263" class="body">Greedy：每次拿最高分　　Sampling：按概率抽，低分候选仍可能出现</text>
<text x="82" y="373" class="title blue">Temperature · 调权重</text><text x="82" y="417" class="body">小于 1：分布更尖</text><text x="82" y="456" class="body">大于 1：分布更平</text><text x="82" y="500" class="small">不直接删候选，也不颠倒排名。</text><text x="82" y="546" class="small">τ → 0 时趋向最高分。</text>
<text x="529" y="373" class="title teal">Top-K · 限个数</text><text x="529" y="417" class="body">只留下最高的 K 个</text><text x="529" y="456" class="body">其他概率置零，再归一化</text><text x="529" y="500" class="small">候选数固定；K = 1 时</text><text x="529" y="539" class="small">只留第一名。</text>
<text x="976" y="373" class="title orange">Top-P · 限累计概率</text><text x="976" y="417" class="body">从高到低累加概率</text><text x="976" y="456" class="body">刚达到门槛 p 就停止</text><text x="976" y="500" class="small">候选数可随分布变化。</text><text x="976" y="546" class="small">p 不是答案正确率。</text>
<text x="84" y="684" class="title blue">例子：“法国的首都是”</text><text x="84" y="727" class="body">巴黎 0.55　北京 0.25　伦敦 0.12　东京 0.05　其他 0.03</text><text x="84" y="774" class="body">Top-K = 2 → 留巴黎、北京；Top-P = 0.90 → 留巴黎、北京、伦敦。</text><text x="84" y="822" class="body">顺序示例：Logits → Temperature → Top-K → 归一化 → Top-P → 抽样</text><text x="84" y="873" class="small">更随机不等于更正确；不同实现的处理顺序和默认值可能不同。</text>
<rect x="245" y="946" width="910" height="40" rx="20" fill="#dceaf7"/><text x="700" y="973" text-anchor="middle" class="small">记住：改权重、限个数、限累计概率，是三件不同的事。</text></svg>
