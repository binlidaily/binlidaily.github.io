<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="t d"><title id="t">大模型第五课复习总图</title><desc id="d">总结训练显存的主要构成、影响激活值的因素与常见显存优化方法。</desc><defs><linearGradient id="h"><stop stop-color="#10233f"/><stop offset="1" stop-color="#285382"/></linearGradient><filter id="s"><feDropShadow dy="5" stdDeviation="8" flood-color="#233753" flood-opacity=".1"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#172b45}.w{fill:#fff}.l{fill:#d8e6f6}.m{fill:#61738a}.b{fill:#326fc3}.g{fill:#238d7e}.h1{font-size:36px;font-weight:700}.h2{font-size:22px;font-weight:700}.h3{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.c{text-anchor:middle}</style></defs><rect width="1600" height="820" rx="24" fill="#f2f6fa"/><path d="M24 0h1552a24 24 0 0 1 24 24v112H0V24A24 24 0 0 1 24 0z" fill="url(#h)"/><text x="50" y="58" class="h1 w">大模型第五课：训练为什么这么吃显存？</text><text x="50" y="94" class="body l">复习总图 · 看懂显存的四笔主账和常见优化手段</text><text x="52" y="160" class="h2">01　显存总账</text><g filter="url(#s)"><rect x="52" y="184" width="1496" height="118" rx="16" fill="#fff"/></g><text x="96" y="232" class="h3 b">参数</text><text x="256" y="232" class="h3">＋ 梯度</text><text x="450" y="232" class="h3">＋ 优化器状态</text><text x="720" y="232" class="h3">＋ 激活值</text><text x="930" y="232" class="h3">＋ 临时开销</text><text x="1180" y="232" class="h3 g">＝ 训练总显存</text><text x="800" y="274" class="small m c">7B 混合精度 AdamW：按参数线性增长的部分约 112 GB，尚未包含激活等开销</text><text x="52" y="360" class="h2">02　三个关键关系</text><g filter="url(#s)"><rect x="52" y="386" width="480" height="190" rx="16" fill="#fff"/><rect x="560" y="386" width="480" height="190" rx="16" fill="#fff"/><rect x="1068" y="386" width="480" height="190" rx="16" fill="#fff"/></g><text x="82" y="430" class="h3 b">① 参数显存</text><text x="82" y="474" class="h2 mono">N × 每参数字节数</text><text x="82" y="518" class="body">BF16：2 B　FP32：4 B</text><text x="82" y="552" class="small m">量化主要改变存储精度</text><text x="590" y="430" class="h3 b">② 激活显存</text><text x="590" y="474" class="h2 mono">∝ B × T × d × Layers</text><text x="590" y="518" class="body">长上下文与大 Batch 都会增加占用</text><text x="590" y="552" class="small m">部分 Attention 开销还可能随 T² 增长</text><text x="1098" y="430" class="h3 g">③ 训练 ≠ 推理</text><text x="1098" y="474" class="body">推理主要用参数与当前激活</text><text x="1098" y="510" class="body">训练还需梯度和优化器状态</text><text x="1098" y="552" class="small m">能推理，不代表能完整训练</text><text x="52" y="632" class="h2">03　常见优化方法</text><g filter="url(#s)"><rect x="52" y="658" width="1496" height="108" rx="16" fill="#fff"/></g><text x="90" y="704" class="body"><tspan class="b">混合精度</tspan>　降低每项字节数</text><text x="400" y="704" class="body"><tspan class="b">Checkpointing</tspan>　少存激活、反向重算</text><text x="840" y="704" class="body"><tspan class="g">ZeRO / FSDP</tspan>　跨卡分片状态</text><text x="1210" y="704" class="body"><tspan class="g">LoRA</tspan>　只训练少量参数</text><text x="800" y="744" class="small m c">省显存通常会换来更多计算、通信、工程复杂度，或限制训练范围。</text><text x="800" y="802" class="body m c">估算显存时，先算参数相关的线性项，再根据 Batch、序列长度和模型结构估算激活。</text></svg>
