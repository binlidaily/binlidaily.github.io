<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660" role="img" aria-labelledby="t d"><title id="t">大模型训练显存构成</title><desc id="d">训练显存由参数、梯度、优化器状态、激活值以及临时开销构成。</desc><defs><linearGradient id="h"><stop stop-color="#10233f"/><stop offset="1" stop-color="#285382"/></linearGradient><filter id="s"><feDropShadow dy="6" stdDeviation="8" flood-color="#233753" flood-opacity=".11"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#172b45}.w{fill:#fff}.l{fill:#d8e6f6}.m{fill:#61738a}.b{fill:#326fc3}.g{fill:#238d7e}.o{fill:#c76b32}.h1{font-size:36px;font-weight:700}.h2{font-size:21px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.c{text-anchor:middle}</style></defs><rect width="1600" height="660" rx="24" fill="#f2f6fa"/><path d="M24 0h1552a24 24 0 0 1 24 24v105H0V24A24 24 0 0 1 24 0z" fill="url(#h)"/><text x="50" y="55" class="h1 w">训练显存都花到哪里了？</text><text x="50" y="88" class="body l">模型大小只是第一笔账，训练还要为反向传播保存更多内容</text><g filter="url(#s)"><rect x="55" y="150" width="280" height="210" rx="16" fill="#fff"/><rect x="365" y="150" width="280" height="210" rx="16" fill="#fff"/><rect x="675" y="150" width="280" height="210" rx="16" fill="#fff"/><rect x="985" y="150" width="280" height="210" rx="16" fill="#fff"/><rect x="1295" y="150" width="250" height="210" rx="16" fill="#fff"/></g><g class="c"><text x="195" y="190" class="h2 b">1 · 参数</text><text x="195" y="238" class="h2 mono">N × bytes</text><text x="195" y="279" class="body">BF16：2 B / 参数</text><text x="195" y="320" class="small m">7B ≈ 14 GB</text><text x="505" y="190" class="h2 b">2 · 梯度</text><text x="505" y="238" class="h2 mono">∂L / ∂θ</text><text x="505" y="279" class="body">每个可训练参数一份</text><text x="505" y="320" class="small m">BF16 时 7B ≈ 14 GB</text><text x="815" y="190" class="h2 o">3 · 优化器状态</text><text x="815" y="238" class="h2 mono">Master + m + v</text><text x="815" y="279" class="body">AdamW 常见三份 FP32</text><text x="815" y="320" class="small m">7B ≈ 84 GB</text><text x="1125" y="190" class="h2 g">4 · 激活值</text><text x="1125" y="238" class="h2 mono">B × T × d × L</text><text x="1125" y="279" class="body">供反向传播使用</text><text x="1125" y="320" class="small m">随 Batch、长度、层数增长</text><text x="1420" y="190" class="h2 g">5 · 其他</text><text x="1420" y="238" class="body">临时 Buffer</text><text x="1420" y="274" class="body">通信缓存</text><text x="1420" y="320" class="small m">框架与碎片</text></g><g filter="url(#s)"><rect x="100" y="420" width="620" height="165" rx="16" fill="#fff"/><rect x="880" y="420" width="620" height="165" rx="16" fill="#fff"/></g><text x="140" y="462" class="h2 b">7B + AdamW 混合精度：先算线性项</text><text x="140" y="505" class="body mono">参数 14 + 梯度 14 + 主权重 28</text><text x="140" y="538" class="body mono">+ m 28 + v 28 ≈ 112 GB</text><text x="140" y="568" class="small m">尚未计入激活值和临时开销</text><text x="920" y="462" class="h2 g">为什么必须做显存优化？</text><text x="920" y="505" class="body">单卡放不下 → 重算激活、缩小 Micro Batch</text><text x="920" y="538" class="body">或把参数、梯度、状态分片到多张 GPU</text><text x="920" y="568" class="small m">省显存通常换来计算、通信或复杂度</text><text x="800" y="634" class="body m c">总显存 ≈ 参数 + 梯度 + 优化器状态 + 激活值 + 临时开销</text></svg>
