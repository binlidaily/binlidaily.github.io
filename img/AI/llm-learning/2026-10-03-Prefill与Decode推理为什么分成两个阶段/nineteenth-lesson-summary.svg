<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img" aria-labelledby="t d"><title id="t">第十九课复习总图：Prefill 与 Decode</title><desc id="d">一次请求时间线、计算形态、延迟指标和服务调度</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf5fb"/></linearGradient><filter id="s"><feDropShadow dy="6" stdDeviation="10" flood-color="#24466a" flood-opacity=".11"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#17304b}.h{font-size:37px;font-weight:700}.sub{font-size:20px;fill:#d9e8f6}.title{font-size:25px;font-weight:700}.body{font-size:20px}.small{font-size:18px;fill:#61768b}.blue{fill:#286cab}.teal{fill:#188078}.orange{fill:#ad5a27}</style></defs><rect width="1400" height="1050" rx="26" fill="url(#bg)"/><rect width="1400" height="136" rx="26" fill="#17365c"/><rect y="105" width="1400" height="31" fill="#17365c"/><text x="52" y="62" class="h" fill="#fff">第十九课 · Prefill / Decode 一页复习</text><text x="52" y="103" class="sub">先读完提示词、给出首 Token，再逐个续写</text>
<g filter="url(#s)"><rect x="52" y="174" width="1296" height="146" rx="21" fill="#fff"/><rect x="52" y="347" width="628" height="270" rx="21" fill="#fff"/><rect x="720" y="347" width="628" height="270" rx="21" fill="#fff"/><rect x="52" y="644" width="628" height="269" rx="21" fill="#fff"/><rect x="720" y="644" width="628" height="269" rx="21" fill="#fff"/></g>
<text x="82" y="222" class="title blue">一次请求的时间线</text><text x="82" y="263" class="body">提示词 4 个位置 → Prefill 输出“巴黎” → Decode 输入“巴黎”输出“。”</text><text x="82" y="299" class="small">首 Token 通常来自 Prefill 最后位置；后续 Token 才进入逐步 Decode。</text>
<text x="82" y="399" class="title blue">Prefill · 一次读多个位置</text><text x="82" y="444" class="body">建立提示词 KV Cache，预测第一个输出。</text><text x="82" y="486" class="body">通常有较大的矩阵乘法。</text><text x="82" y="535" class="small">常更偏计算吞吐；长 Prompt 可拉长首字等待。</text><text x="82" y="574" class="small">不是“所有 Token 可互相看到”：因果掩码仍在。</text>
<text x="750" y="399" class="title teal">Decode · 每轮读一个新位置</text><text x="750" y="444" class="body">等上一步输出，读取历史 KV Cache。</text><text x="750" y="486" class="body">预测下一 Token，追加新 K/V。</text><text x="750" y="535" class="small">常更偏带宽与逐步延迟；并非不做 Attention。</text><text x="750" y="574" class="small">同一请求串行；不同请求可一起批处理。</text>
<text x="82" y="696" class="title orange">用户感受到的两种等待</text><text x="82" y="742" class="body">TTFT：发出请求 → 第一个输出 Token</text><text x="82" y="784" class="body">TPOT：首 Token 后的平均输出间隔</text><text x="82" y="831" class="small">还要留意 ITL：相邻 Token 间隔是否抖动。</text><text x="82" y="871" class="small">TTFT 不只等于 Prefill，还包含排队等环节。</text>
<text x="750" y="696" class="title blue">服务系统怎样权衡</text><text x="750" y="742" class="body">连续批处理：动态加入、移出请求。</text><text x="750" y="784" class="body">分块 Prefill：避免长请求久占一轮。</text><text x="750" y="831" class="small">吞吐高，不保证每位用户都更快。</text><text x="750" y="871" class="small">KV Cache 还要做动态内存管理。</text>
<rect x="219" y="945" width="962" height="70" rx="27" fill="#dceaf7"/><text x="700" y="987" text-anchor="middle" class="title blue">同一模型，两种计算形态；优化 TTFT 与 TPOT 要分开看。</text></svg>
