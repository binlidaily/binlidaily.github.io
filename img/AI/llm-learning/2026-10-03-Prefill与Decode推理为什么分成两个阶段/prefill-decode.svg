<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" role="img" aria-labelledby="t d"><title id="t">Prefill 与 Decode 的请求时间线</title><desc id="d">Prefill 一次读入提示词并产生首个回答 Token，后续 Decode 逐 Token 续写</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf5fb"/></linearGradient><filter id="s"><feDropShadow dy="7" stdDeviation="12" flood-color="#24466a" flood-opacity=".11"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#6c91b6"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#17304b}.h{font-size:37px;font-weight:700}.sub{font-size:20px;fill:#d9e8f6}.title{font-size:25px;font-weight:700}.body{font-size:20px}.small{font-size:17px;fill:#61768b}.blue{fill:#286cab}.teal{fill:#188078}.orange{fill:#ad5a27}</style></defs><rect width="1400" height="790" rx="26" fill="url(#bg)"/><rect width="1400" height="136" rx="26" fill="#17365c"/><rect y="105" width="1400" height="31" fill="#17365c"/><text x="52" y="62" class="h" fill="#fff">Prefill 与 Decode：同一请求的两种工作</text><text x="52" y="103" class="sub">“法国 / 的 / 首都 / 是” → “巴黎” → “。”（切分仅为示意）</text>
<g filter="url(#s)"><rect x="54" y="174" width="1292" height="235" rx="21" fill="#fff"/><rect x="54" y="433" width="625" height="229" rx="21" fill="#fff"/><rect x="721" y="433" width="625" height="229" rx="21" fill="#fff"/></g>
<text x="84" y="220" class="title blue">01 · Prefill：已知提示词一起进入模型</text><text x="84" y="258" class="small">一次前向处理多个位置；建立 KV Cache；最后位置预测首个输出 Token</text><g><rect x="88" y="294" width="196" height="76" rx="14" fill="#e6f1fb"/><rect x="306" y="294" width="196" height="76" rx="14" fill="#e6f1fb"/><rect x="524" y="294" width="196" height="76" rx="14" fill="#e6f1fb"/><rect x="742" y="294" width="196" height="76" rx="14" fill="#e6f1fb"/></g><text x="186" y="342" text-anchor="middle" class="body blue">法国</text><text x="404" y="342" text-anchor="middle" class="body blue">的</text><text x="622" y="342" text-anchor="middle" class="body blue">首都</text><text x="840" y="342" text-anchor="middle" class="body blue">是</text><path d="M953 332h62" stroke="#6c91b6" stroke-width="4" marker-end="url(#a)"/><rect x="1034" y="294" width="235" height="76" rx="14" fill="#def4e8"/><text x="1151" y="342" text-anchor="middle" class="body teal">输出“巴黎”</text>
<text x="84" y="479" class="title teal">02 · Decode：输入刚生成的“巴黎”</text><text x="84" y="520" class="body">只新增 1 个位置，读取历史 KV Cache。</text><text x="84" y="563" class="body">本轮预测“。”；新 K/V 追加到缓存。</text><text x="84" y="616" class="small">同一请求的下一步必须等待这一步的输出。</text>
<text x="751" y="479" class="title teal">03 · 若继续：再输入“。”</text><text x="751" y="520" class="body">再新增 1 个位置，继续读取历史缓存。</text><text x="751" y="563" class="body">本轮才预测再下一个 Token。</text><text x="751" y="616" class="small">多个用户的 Decode 可以跨请求组成批次。</text>
<rect x="160" y="700" width="1080" height="57" rx="28" fill="#dceaf7"/><text x="700" y="737" text-anchor="middle" class="title blue">Prefill 偏大矩阵计算；Decode 偏逐步读取与延迟</text></svg>
