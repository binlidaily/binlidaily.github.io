<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">大模型第二课 Attention 复习总图</title>
  <desc id="desc">总结 Attention 中 Q、K、V、相关性分数、Causal Mask、Softmax、加权求和和 Multi-Head 的完整计算过程。</desc>
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#10233f"/><stop offset="1" stop-color="#285382"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#edf3f8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#233753" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#3f75b7"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#172b45}
      .white{fill:#fff}.light{fill:#d8e6f6}.muted{fill:#60738c}.blue{fill:#326fc3}.green{fill:#238d7e}.orange{fill:#c76b32}
      .h1{font-size:38px;font-weight:700}.h2{font-size:23px;font-weight:700}.h3{font-size:18px;font-weight:700}
      .body{font-size:16px}.small{font-size:14px}.tiny{font-size:12px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,"PingFang SC",monospace}
      .center{text-anchor:middle}.right{text-anchor:end}.mid{dominant-baseline:middle}
      .line{stroke:#d7e2ed;stroke-width:1}.arrow{stroke:#3f75b7;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1600" height="980" rx="24" fill="url(#paper)"/>
  <path d="M24 0h1552a24 24 0 0 1 24 24v112H0V24A24 24 0 0 1 24 0z" fill="url(#head)"/>
  <text x="52" y="58" class="h1 white">大模型第二课：Attention 为什么能让 Token 彼此“看见”？</text>
  <text x="52" y="94" class="body light">复习总图 · 以“它”寻找“小猫”为例</text>
  <text x="1548" y="63" class="h3 white right">核心作用</text>
  <text x="1548" y="94" class="body light right">按相关程度提取上下文信息</text>

  <text x="52" y="168" class="h2">01　一次 Attention 的完整流程</text>
  <text x="1548" y="168" class="small muted right">Query 负责找，Key 负责匹配，Value 提供内容</text>
  <g filter="url(#shadow)">
    <rect x="52" y="194" width="220" height="150" rx="15" fill="#fff"/><rect x="306" y="194" width="220" height="150" rx="15" fill="#fff"/>
    <rect x="560" y="194" width="220" height="150" rx="15" fill="#fff"/><rect x="814" y="194" width="220" height="150" rx="15" fill="#fff"/>
    <rect x="1068" y="194" width="220" height="150" rx="15" fill="#fff"/><rect x="1322" y="194" width="226" height="150" rx="15" fill="#fff"/>
  </g>
  <g fill="#326fc3"><rect x="52" y="194" width="220" height="5" rx="3"/><rect x="306" y="194" width="220" height="5" rx="3"/><rect x="560" y="194" width="220" height="5" rx="3"/></g>
  <g fill="#238d7e"><rect x="814" y="194" width="220" height="5" rx="3"/><rect x="1068" y="194" width="220" height="5" rx="3"/><rect x="1322" y="194" width="226" height="5" rx="3"/></g>
  <path class="arrow" d="M272 269h28M526 269h28M780 269h28M1034 269h28M1288 269h28"/>
  <g class="center">
    <text x="162" y="225" class="small blue">1 · 输入表示</text><text x="162" y="266" class="h3">X</text><text x="162" y="300" class="body">“小猫 … 它”</text><text x="162" y="327" class="small muted mono">[B,T,d_model]</text>
    <text x="416" y="225" class="small blue">2 · 线性投影</text><text x="416" y="260" class="body mono">Q=XWQ</text><text x="416" y="286" class="body mono">K=XWK　V=XWV</text><text x="416" y="327" class="small muted">得到 Q、K、V</text>
    <text x="670" y="225" class="small blue">3 · 相关性</text><text x="670" y="270" class="h3 mono">QKᵀ / √dₖ</text><text x="670" y="302" class="small">Query 与所有 Key 比较</text><text x="670" y="327" class="small muted mono">[B,h,T,T]</text>
    <text x="924" y="225" class="small green">4 · Causal Mask</text><text x="924" y="266" class="h3">未来位置 → −∞</text><text x="924" y="302" class="small">生成时不能偷看未来</text><text x="924" y="327" class="small muted">形成下三角可见区</text>
    <text x="1178" y="225" class="small green">5 · Softmax</text><text x="1178" y="266" class="h3">分数 → 权重</text><text x="1178" y="302" class="small">每行总和等于 1</text><text x="1178" y="327" class="small muted mono">A=Softmax(Scores)</text>
    <text x="1435" y="225" class="small green">6 · 加权求和</text><text x="1435" y="266" class="h3 mono">A × V</text><text x="1435" y="302" class="small">取回相关 Token 的信息</text><text x="1435" y="327" class="small muted">得到上下文表示</text>
  </g>

  <text x="52" y="398" class="h2">02　用一句话理解 Q、K、V</text>
  <g filter="url(#shadow)"><rect x="52" y="424" width="920" height="218" rx="16" fill="#fff"/><rect x="996" y="424" width="552" height="218" rx="16" fill="#fff"/></g>
  <g>
    <circle cx="104" cy="474" r="24" fill="#326fc3"/><text x="104" y="474" class="h3 white center mid">Q</text><text x="146" y="469" class="h3">Query：我需要什么信息？</text><text x="146" y="499" class="small muted">当前的“它”发起搜索</text>
    <circle cx="104" cy="541" r="24" fill="#5c77b8"/><text x="104" y="541" class="h3 white center mid">K</text><text x="146" y="536" class="h3">Key：我有什么特征？</text><text x="146" y="566" class="small muted">每个 Token 接受匹配</text>
    <circle cx="104" cy="608" r="24" fill="#238d7e"/><text x="104" y="608" class="h3 white center mid">V</text><text x="146" y="603" class="h3">Value：选中我以后，取走什么？</text><text x="146" y="633" class="small muted">真正被汇入新表示的内容</text>
    <path d="M535 470C650 470 650 525 770 525" class="arrow"/><path d="M535 541h235" class="arrow"/><path d="M535 608C650 608 650 555 770 555" class="arrow"/>
    <rect x="790" y="477" width="150" height="118" rx="14" fill="#edf4fc"/><text x="865" y="510" class="small blue center">处理“它”时</text><text x="865" y="546" class="h2 center">更关注“小猫”</text><text x="865" y="576" class="small muted center">高权重 → 多取信息</text>
  </g>
  <text x="1026" y="463" class="h3">示例注意力权重</text>
  <g class="body"><text x="1026" y="505">小猫</text><text x="1026" y="540">窗边</text><text x="1026" y="575">因为</text><text x="1026" y="610">其他</text></g>
  <g><rect x="1090" y="490" width="320" height="18" rx="9" fill="#e4ebf2"/><rect x="1090" y="490" width="286" height="18" rx="9" fill="#326fc3"/>
    <rect x="1090" y="525" width="320" height="18" rx="9" fill="#e4ebf2"/><rect x="1090" y="525" width="61" height="18" rx="9" fill="#75a4da"/>
    <rect x="1090" y="560" width="320" height="18" rx="9" fill="#e4ebf2"/><rect x="1090" y="560" width="46" height="18" rx="9" fill="#75a4da"/>
    <rect x="1090" y="595" width="320" height="18" rx="9" fill="#e4ebf2"/><rect x="1090" y="595" width="82" height="18" rx="9" fill="#75a4da"/></g>
  <g class="small right"><text x="1514" y="505">0.56</text><text x="1514" y="540">0.12</text><text x="1514" y="575">0.09</text><text x="1514" y="610">0.23</text></g>

  <text x="52" y="696" class="h2">03　关键形状</text><text x="868" y="696" class="h2">04　记住这 5 件事</text>
  <g filter="url(#shadow)"><rect x="52" y="722" width="762" height="202" rx="16" fill="#fff"/><rect x="868" y="722" width="680" height="202" rx="16" fill="#fff"/></g>
  <rect x="52" y="722" width="762" height="44" rx="16" fill="#e9f0f8"/><path d="M52 750h762v16H52z" fill="#e9f0f8"/>
  <g class="body"><text x="82" y="751" class="h3">阶段</text><text x="302" y="751" class="h3">形状</text><text x="520" y="751" class="h3">含义</text>
    <text x="82" y="797">输入 / 输出</text><text x="302" y="797" class="mono">[B,T,d_model]</text><text x="520" y="797">整体形状不变</text>
    <text x="82" y="835">多头 Q、K、V</text><text x="302" y="835" class="mono">[B,h,T,dₖ]</text><text x="520" y="835">h 个并行 Head</text>
    <text x="82" y="873">权重矩阵 A</text><text x="302" y="873" class="mono">[B,h,T,T]</text><text x="520" y="873">Token 两两关系</text>
    <text x="82" y="911">合并 Heads</text><text x="302" y="911" class="mono">[B,T,d_model]</text><text x="520" y="911">上下文表示</text></g>
  <path class="line" d="M52 766h762M52 811h762M52 849h762M52 887h762M260 722v202M478 722v202"/>
  <g class="body">
    <circle cx="904" cy="765" r="14" fill="#326fc3"/><text x="904" y="765" class="small white center mid">1</text><text x="934" y="771">Q 找信息，K 做匹配，V 给内容</text>
    <circle cx="904" cy="803" r="14" fill="#326fc3"/><text x="904" y="803" class="small white center mid">2</text><text x="934" y="809">QKᵀ 衡量 Token 之间的相关性</text>
    <circle cx="904" cy="841" r="14" fill="#326fc3"/><text x="904" y="841" class="small white center mid">3</text><text x="934" y="847">除以 √dₖ，让数值和训练更稳定</text>
    <circle cx="904" cy="879" r="14" fill="#238d7e"/><text x="904" y="879" class="small white center mid">4</text><text x="934" y="885">Causal Mask 保证看不到未来 Token</text>
    <circle cx="904" cy="917" r="14" fill="#238d7e"/><text x="904" y="917" class="small white center mid">5</text><text x="934" y="923">Softmax(A) × V，得到上下文表示</text>
  </g>
  <text x="800" y="958" class="body muted center">Attention Weight 表示本次信息汇聚的侧重，不等于模型完整的“思考过程”。</text>
</svg>
