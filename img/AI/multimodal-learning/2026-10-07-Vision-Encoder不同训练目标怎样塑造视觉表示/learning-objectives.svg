<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="710" viewBox="0 0 1000 710" role="img" aria-labelledby="t"><title id="t">相同图片，不同训练信号</title><rect width="1000" height="710" rx="20" fill="#f5f9fd"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#17345a"><text x="40" y="50" font-size="28" font-weight="bold">同样看图片，训练时要回答什么？</text><rect x="30" y="85" width="940" height="175" rx="14" fill="white" stroke="#d3e1ee"/><rect x="50" y="110" width="180" height="120" rx="12" fill="#eaf2fb"/><text x="65" y="175" font-size="20" font-weight="bold">分类</text><text x="260" y="133" font-size="22">图片 → 编码器 → 类别分数</text><text x="260" y="174" font-size="21">对照人工标签：猫</text><text x="260" y="217" font-size="19" fill="#58708a">让正确类别的概率更高</text><rect x="30" y="280" width="940" height="175" rx="14" fill="white" stroke="#d3e1ee"/><rect x="50" y="305" width="180" height="120" rx="12" fill="#e6f3ed"/><text x="65" y="370" font-size="20" font-weight="bold">图文对齐</text><text x="260" y="328" font-size="22">图片 → 图像编码器 → 图像向量</text><text x="260" y="369" font-size="21">描述 → 文本编码器 → 文本向量</text><text x="260" y="412" font-size="19" fill="#58708a">利用配对关系，让匹配图文更接近</text><rect x="30" y="475" width="940" height="175" rx="14" fill="white" stroke="#d3e1ee"/><rect x="50" y="500" width="180" height="120" rx="12" fill="#f1eafa"/><text x="65" y="565" font-size="20" font-weight="bold">视觉自监督（DINO）</text><text x="260" y="523" font-size="22">同一图片的不同视图 → 学生 / 教师</text><text x="260" y="564" font-size="21">学生分布 ← 教师目标（停止梯度）</text><text x="260" y="607" font-size="19" fill="#58708a">教师由学生滑动平均更新，无人工类别标签</text><text x="40" y="695" font-size="17">示意图只比较学习任务；实际表示还受数据、规模、预处理和训练细节影响。</text></g></svg>