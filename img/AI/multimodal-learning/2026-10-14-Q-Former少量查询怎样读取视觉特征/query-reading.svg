<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="t"><title id="t">两条查询读取六条视觉特征</title><rect width="1000" height="650" rx="20" fill="#f6f9fd"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#17345a"><text x="40" y="50" font-size="27" font-weight="bold">六个视觉位置 → 两条查询输出</text><text x="40" y="90" font-size="18">每条查询都可以读取全部位置，权重与读取结果随图片变化。</text><rect x="45" y="130" width="130" height="55" rx="9" fill="#bcd3e9"/><text x="63" y="165" font-size="20">视觉特征 1</text><rect x="195" y="130" width="130" height="55" rx="9" fill="#bcd3e9"/><text x="213" y="165" font-size="20">视觉特征 2</text><rect x="345" y="130" width="130" height="55" rx="9" fill="#bcd3e9"/><text x="363" y="165" font-size="20">视觉特征 3</text><rect x="495" y="130" width="130" height="55" rx="9" fill="#bcd3e9"/><text x="513" y="165" font-size="20">视觉特征 4</text><rect x="645" y="130" width="130" height="55" rx="9" fill="#bcd3e9"/><text x="663" y="165" font-size="20">视觉特征 5</text><rect x="795" y="130" width="130" height="55" rx="9" fill="#bcd3e9"/><text x="813" y="165" font-size="20">视觉特征 6</text><path d="M110 185 L245 330" stroke="#779dc0" stroke-width="1.5" opacity=".55"/><path d="M260 185 L245 330" stroke="#779dc0" stroke-width="1.5" opacity=".55"/><path d="M410 185 L245 330" stroke="#779dc0" stroke-width="1.5" opacity=".55"/><path d="M560 185 L245 330" stroke="#779dc0" stroke-width="1.5" opacity=".55"/><path d="M710 185 L245 330" stroke="#779dc0" stroke-width="1.5" opacity=".55"/><path d="M860 185 L245 330" stroke="#779dc0" stroke-width="1.5" opacity=".55"/><rect x="180" y="330" width="150" height="60" rx="10" fill="#e3eedf"/><text x="200" y="367" font-size="22">查询 1 读取</text><text x="245" y="428" font-size="28">↓</text><rect x="180" y="450" width="150" height="55" rx="10" fill="#b7d9c4"/><text x="200" y="485" font-size="21">输出向量 1</text><path d="M110 185 L705 330" stroke="#85af99" stroke-width="1.5" opacity=".55"/><path d="M260 185 L705 330" stroke="#85af99" stroke-width="1.5" opacity=".55"/><path d="M410 185 L705 330" stroke="#85af99" stroke-width="1.5" opacity=".55"/><path d="M560 185 L705 330" stroke="#85af99" stroke-width="1.5" opacity=".55"/><path d="M710 185 L705 330" stroke="#85af99" stroke-width="1.5" opacity=".55"/><path d="M860 185 L705 330" stroke="#85af99" stroke-width="1.5" opacity=".55"/><rect x="640" y="330" width="150" height="60" rx="10" fill="#e3eedf"/><text x="660" y="367" font-size="22">查询 2 读取</text><text x="705" y="428" font-size="28">↓</text><rect x="640" y="450" width="150" height="55" rx="10" fill="#b7d9c4"/><text x="660" y="485" font-size="21">输出向量 2</text><text x="40" y="555" font-size="21">输出 [2,dq] → 投影到语言宽度 [2,dl] → LLM</text><text x="40" y="599" font-size="18">查询数决定输出长度；图中连线不代表真实权重，也不保证一条查询对应一个物体。</text><text x="40" y="631" font-size="16">完整 Q-Former 还包含 Self-Attention、前馈网络等，这里只画一次交叉读取。</text></g></svg>