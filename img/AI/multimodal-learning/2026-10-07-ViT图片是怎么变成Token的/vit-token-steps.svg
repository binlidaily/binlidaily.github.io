<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1190" viewBox="0 0 1000 1190" role="img" aria-labelledby="t d"><title id="t">一张小图片怎样变成四条向量</title><desc id="d">用4乘4的RGB图片和2乘2的Patch举例，四块依次摊平成12个数，共享投影成6维向量，加位置与CLS后形成5乘6的序列，再经过Attention交换信息。</desc><rect width="1000" height="1190" rx="24" fill="#f6f9fd"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#17345a"><text x="40" y="48" font-size="27" font-weight="bold">用一张 4×4 小图片，把过程看清楚</text><text x="40" y="82" font-size="18">教学例子：RGB 三通道，Patch 边长 P=2，隐藏宽度 D=6</text><rect x="25" y="110" width="950" height="195" rx="15" fill="white" stroke="#d5e2ef"/><text x="45" y="144" font-size="23" font-weight="bold">① 切块：二维网格 → 四张卡片</text><text x="45" y="176" font-size="17">按行编号：左上 A、右上 B、左下 C、右下 D。每块仍有 RGB 三通道。</text><rect x="70" y="193" width="21" height="21" fill="#e7a17d"/><rect x="92" y="193" width="21" height="21" fill="#e7a17d"/><rect x="114" y="193" width="21" height="21" fill="#8bbcad"/><rect x="136" y="193" width="21" height="21" fill="#8bbcad"/><rect x="70" y="215" width="21" height="21" fill="#e7a17d"/><rect x="92" y="215" width="21" height="21" fill="#e7a17d"/><rect x="114" y="215" width="21" height="21" fill="#8bbcad"/><rect x="136" y="215" width="21" height="21" fill="#8bbcad"/><rect x="70" y="237" width="21" height="21" fill="#94b9e2"/><rect x="92" y="237" width="21" height="21" fill="#94b9e2"/><rect x="114" y="237" width="21" height="21" fill="#c2a5db"/><rect x="136" y="237" width="21" height="21" fill="#c2a5db"/><rect x="70" y="259" width="21" height="21" fill="#94b9e2"/><rect x="92" y="259" width="21" height="21" fill="#94b9e2"/><rect x="114" y="259" width="21" height="21" fill="#c2a5db"/><rect x="136" y="259" width="21" height="21" fill="#c2a5db"/><text x="200" y="247" font-size="30">→</text><rect x="290" y="205" width="100" height="65" rx="8" fill="#e7a17d"/><text x="330" y="245" font-size="24">A</text><rect x="440" y="205" width="100" height="65" rx="8" fill="#8bbcad"/><text x="480" y="245" font-size="24">B</text><rect x="590" y="205" width="100" height="65" rx="8" fill="#94b9e2"/><text x="630" y="245" font-size="24">C</text><rect x="740" y="205" width="100" height="65" rx="8" fill="#c2a5db"/><text x="780" y="245" font-size="24">D</text><rect x="25" y="320" width="950" height="195" rx="15" fill="white" stroke="#d5e2ef"/><text x="45" y="354" font-size="23" font-weight="bold">② 摊平：一块像素 → 一排 12 个数</text><text x="45" y="386" font-size="17">2×2 个像素 × 3 个通道 = 12。只是重排，尚未学习，也没有求平均。</text><rect x="65" y="420" width="100" height="60" rx="8" fill="#e7a17d"/><text x="100" y="458" font-size="25">A</text><text x="195" y="458" font-size="30">→</text><rect x="270" y="424" width="44" height="48" rx="4" fill="#e7a17d"/><text x="279" y="453" font-size="14">x1</text><rect x="318" y="424" width="44" height="48" rx="4" fill="#e7a17d"/><text x="327" y="453" font-size="14">x2</text><rect x="366" y="424" width="44" height="48" rx="4" fill="#e7a17d"/><text x="375" y="453" font-size="14">x3</text><rect x="414" y="424" width="44" height="48" rx="4" fill="#e7a17d"/><text x="423" y="453" font-size="14">x4</text><rect x="462" y="424" width="44" height="48" rx="4" fill="#e7a17d"/><text x="471" y="453" font-size="14">x5</text><rect x="510" y="424" width="44" height="48" rx="4" fill="#e7a17d"/><text x="519" y="453" font-size="14">x6</text><rect x="558" y="424" width="44" height="48" rx="4" fill="#e7a17d"/><text x="567" y="453" font-size="14">x7</text><rect x="606" y="424" width="44" height="48" rx="4" fill="#e7a17d"/><text x="615" y="453" font-size="14">x8</text><rect x="654" y="424" width="44" height="48" rx="4" fill="#e7a17d"/><text x="663" y="453" font-size="14">x9</text><rect x="702" y="424" width="44" height="48" rx="4" fill="#e7a17d"/><text x="711" y="453" font-size="14">x10</text><rect x="750" y="424" width="44" height="48" rx="4" fill="#e7a17d"/><text x="759" y="453" font-size="14">x11</text><rect x="798" y="424" width="44" height="48" rx="4" fill="#e7a17d"/><text x="807" y="453" font-size="14">x12</text><rect x="25" y="530" width="950" height="195" rx="15" fill="white" stroke="#d5e2ef"/><text x="45" y="564" font-size="23" font-weight="bold">③ 投影：12 个像素值 → 6 维特征</text><text x="45" y="596" font-size="17">四块共用同一个可学习的 W 和 b。6 是我们选择的模型宽度。</text><text x="65" y="660" font-size="21">A：[x1 … x12]</text><text x="260" y="660" font-size="28">→</text><rect x="325" y="624" width="220" height="58" rx="9" fill="#eaf2fc"/><text x="345" y="660" font-size="21">× W（12×6）+ b</text><text x="570" y="660" font-size="28">→</text><rect x="635" y="634" width="40" height="43" rx="4" fill="#e7a17d"/><text x="643" y="662" font-size="16">e1</text><rect x="680" y="634" width="40" height="43" rx="4" fill="#e7a17d"/><text x="688" y="662" font-size="16">e2</text><rect x="725" y="634" width="40" height="43" rx="4" fill="#e7a17d"/><text x="733" y="662" font-size="16">e3</text><rect x="770" y="634" width="40" height="43" rx="4" fill="#e7a17d"/><text x="778" y="662" font-size="16">e4</text><rect x="815" y="634" width="40" height="43" rx="4" fill="#e7a17d"/><text x="823" y="662" font-size="16">e5</text><rect x="860" y="634" width="40" height="43" rx="4" fill="#e7a17d"/><text x="868" y="662" font-size="16">e6</text><text x="65" y="704" font-size="17">B、C、D 也经过同一个投影 → 得到形状 [4,6]，每一行对应一块图片。</text><rect x="25" y="740" width="950" height="195" rx="15" fill="white" stroke="#d5e2ef"/><text x="45" y="774" font-size="23" font-weight="bold">④ 加位置与 CLS：四条向量 → 五条向量</text><text x="45" y="806" font-size="17">每块加上自己的位置向量；CLS 是额外学习的一条向量，用于分类汇总。</text><rect x="60" y="827" width="155" height="48" rx="7" fill="#dce8f5"/><text x="72" y="856" font-size="17">CLS 的 6 维向量</text><text x="70" y="898" font-size="16">+ 位置 0 的向量</text><rect x="238" y="827" width="155" height="48" rx="7" fill="#e7a17d"/><text x="250" y="856" font-size="17">A 的 6 维向量</text><text x="248" y="898" font-size="16">+ 位置 1 的向量</text><rect x="416" y="827" width="155" height="48" rx="7" fill="#8bbcad"/><text x="428" y="856" font-size="17">B 的 6 维向量</text><text x="426" y="898" font-size="16">+ 位置 2 的向量</text><rect x="594" y="827" width="155" height="48" rx="7" fill="#94b9e2"/><text x="606" y="856" font-size="17">C 的 6 维向量</text><text x="604" y="898" font-size="16">+ 位置 3 的向量</text><rect x="772" y="827" width="155" height="48" rx="7" fill="#c2a5db"/><text x="784" y="856" font-size="17">D 的 6 维向量</text><text x="782" y="898" font-size="16">+ 位置 4 的向量</text><rect x="25" y="950" width="950" height="195" rx="15" fill="white" stroke="#d5e2ef"/><text x="45" y="984" font-size="23" font-weight="bold">⑤ Attention：各条向量开始交换信息</text><text x="45" y="1016" font-size="17">每条向量结合其他位置的信息，输出仍有 5 条，每条仍是 6 维。</text><rect x="75" y="1042" width="110" height="42" rx="8" fill="#e7a17d"/><text x="105" y="1069" font-size="20">CLS</text><text x="200" y="1069" font-size="26">↔</text><rect x="255" y="1042" width="110" height="42" rx="8" fill="#e7a17d"/><text x="285" y="1069" font-size="20">A</text><text x="380" y="1069" font-size="26">↔</text><rect x="435" y="1042" width="110" height="42" rx="8" fill="#8bbcad"/><text x="465" y="1069" font-size="20">B</text><text x="560" y="1069" font-size="26">↔</text><rect x="615" y="1042" width="110" height="42" rx="8" fill="#94b9e2"/><text x="645" y="1069" font-size="20">C</text><text x="740" y="1069" font-size="26">↔</text><rect x="795" y="1042" width="110" height="42" rx="8" fill="#c2a5db"/><text x="825" y="1069" font-size="20">D</text><text x="65" y="1121" font-size="17">这里只画相邻连线作为示意；基础 ViT 中，每个位置可以读取所有位置。</text><text x="45" y="1180" font-size="16">像素值决定“内容”，位置向量补充“在哪里”；投影与 Attention 的参数需要通过训练学会。</text></g></svg>