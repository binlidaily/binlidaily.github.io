<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="t"><title id="t">softmax 与 sigmoid 对同一组示意分数的处理</title><rect width="1000" height="520" rx="20" fill="#f5f9fd"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#17345a"><text x="40" y="48" font-size="27" font-weight="bold">一份概率分给候选，还是每一对单独判断？</text><text x="40" y="90" font-size="19">同一张猫图，示意 logits：猫 2、狗 −1、自行车 −2</text><rect x="30" y="125" width="460" height="310" rx="14" fill="white" stroke="#cadbea"/><text x="50" y="166" font-size="22" font-weight="bold">CLIP：按行 softmax</text><text x="50" y="228" font-size="18">猫</text><rect x="130" y="205" width="250" height="28" rx="5" fill="#e9eff6"/><rect x="130" y="205" width="234.0" height="28" rx="5" fill="#7aa7d4"/><text x="390" y="228" font-size="18">0.936</text><text x="50" y="290" font-size="18">狗</text><rect x="130" y="267" width="250" height="28" rx="5" fill="#e9eff6"/><rect x="130" y="267" width="11.75" height="28" rx="5" fill="#7aa7d4"/><text x="390" y="290" font-size="18">0.047</text><text x="50" y="352" font-size="18">自行车</text><rect x="130" y="329" width="250" height="28" rx="5" fill="#e9eff6"/><rect x="130" y="329" width="4.25" height="28" rx="5" fill="#7aa7d4"/><text x="390" y="352" font-size="18">0.017</text><text x="45" y="411" font-size="16">三个概率之和为 1；加入候选，分母会变化。</text><rect x="520" y="125" width="460" height="310" rx="14" fill="white" stroke="#cadbea"/><text x="540" y="166" font-size="22" font-weight="bold">SigLIP：每项 sigmoid</text><text x="540" y="228" font-size="18">猫</text><rect x="620" y="205" width="250" height="28" rx="5" fill="#e9eff6"/><rect x="620" y="205" width="220.25" height="28" rx="5" fill="#7cb09a"/><text x="880" y="228" font-size="18">0.881</text><text x="540" y="290" font-size="18">狗</text><rect x="620" y="267" width="250" height="28" rx="5" fill="#e9eff6"/><rect x="620" y="267" width="67.25" height="28" rx="5" fill="#7cb09a"/><text x="880" y="290" font-size="18">0.269</text><text x="540" y="352" font-size="18">自行车</text><rect x="620" y="329" width="250" height="28" rx="5" fill="#e9eff6"/><rect x="620" y="329" width="29.75" height="28" rx="5" fill="#7cb09a"/><text x="880" y="352" font-size="18">0.119</text><text x="535" y="411" font-size="16">三个分数不必加起来等于 1；每项单独计算。</text><text x="40" y="482" font-size="17">仅比较函数行为，数值为教学示意；真实模型的尺度、偏置和特征各不相同。</text></g></svg>