<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img" aria-labelledby="t"><title id="t">视觉向量通过Projector接入LLM</title><rect width="1000" height="670" rx="20" fill="#f6f9fd"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#17345a"><text x="40" y="50" font-size="27" font-weight="bold">每条向量改宽度，再沿序列拼接</text><text x="40" y="92" font-size="18">教学例子：4 个视觉位置，每条 4 维 → 每条 6 维；再插入文字序列。</text><rect x="55" y="140" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="90" y="140" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="125" y="140" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="160" y="140" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="630" y="140" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="665" y="140" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="700" y="140" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="735" y="140" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="770" y="140" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="805" y="140" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="55" y="187" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="90" y="187" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="125" y="187" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="160" y="187" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="630" y="187" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="665" y="187" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="700" y="187" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="735" y="187" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="770" y="187" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="805" y="187" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="55" y="234" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="90" y="234" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="125" y="234" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="160" y="234" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="630" y="234" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="665" y="234" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="700" y="234" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="735" y="234" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="770" y="234" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="805" y="234" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="55" y="281" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="90" y="281" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="125" y="281" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="160" y="281" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="630" y="281" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="665" y="281" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="700" y="281" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="735" y="281" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="770" y="281" width="30" height="32" rx="4" fill="#91b5d8"/><rect x="805" y="281" width="30" height="32" rx="4" fill="#91b5d8"/><text x="250" y="230" font-size="30">→</text><rect x="320" y="185" width="220" height="90" rx="12" fill="#e9eef8"/><text x="365" y="220" font-size="23">Projector</text><text x="342" y="253" font-size="18">所有行共享映射</text><text x="570" y="230" font-size="30">→</text><text x="55" y="365" font-size="20">视觉特征 [4,4]</text><text x="630" y="365" font-size="20">视觉输入 [4,6]</text><text x="40" y="417" font-size="21">拼接顺序：文字前缀 → 图片位置 → 文字后缀</text><rect x="50" y="447" width="96" height="64" rx="8" fill="#d4e7da"/><text x="70" y="486" font-size="22">文</text><rect x="158" y="447" width="96" height="64" rx="8" fill="#b6cee7"/><text x="178" y="486" font-size="22">图1</text><rect x="266" y="447" width="96" height="64" rx="8" fill="#b6cee7"/><text x="286" y="486" font-size="22">图2</text><rect x="374" y="447" width="96" height="64" rx="8" fill="#b6cee7"/><text x="394" y="486" font-size="22">图3</text><rect x="482" y="447" width="96" height="64" rx="8" fill="#b6cee7"/><text x="502" y="486" font-size="22">图4</text><rect x="590" y="447" width="96" height="64" rx="8" fill="#d4e7da"/><text x="610" y="486" font-size="22">文</text><rect x="698" y="447" width="96" height="64" rx="8" fill="#d4e7da"/><text x="718" y="486" font-size="22">文</text><text x="820" y="487" font-size="26">→ LLM</text><text x="50" y="552" font-size="20">7 个位置，每个都是 6 维 → 输入形状 [7,6]（省略 Batch）。</text><text x="50" y="603" font-size="19">形状匹配只是开始：答案损失通过 LLM 回传，训练连接器怎样提供有用信息。</text><text x="50" y="643" font-size="17">颜色与方块仅表示位置和维度，不代表实际特征值；还需要位置编号与掩码。</text></g></svg>