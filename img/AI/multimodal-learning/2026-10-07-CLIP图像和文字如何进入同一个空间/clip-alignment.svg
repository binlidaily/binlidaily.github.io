<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="770" viewBox="0 0 1000 770" role="img" aria-labelledby="t d"><title id="t">CLIP图文对齐流程</title><desc id="d">图片和文字分别编码投影归一化，产生可比较向量，构造三乘三分数表，正确配对在对角线，按行和列计算双向损失。</desc><rect width="1000" height="770" rx="20" fill="#f6f9fd"/><g fill="#17345a" font-family="Microsoft YaHei,Arial,sans-serif"><text x="40" y="48" font-size="28" font-weight="bold">先变成向量，再通过配对学会比较</text><rect x="40" y="85" width="205" height="65" rx="12" fill="#e7f2eb" stroke="#b9ccde"/><text x="58" y="125" font-size="21">图片</text><text x="251" y="127" font-size="28">→</text><rect x="280" y="85" width="205" height="65" rx="12" fill="#e7f2eb" stroke="#b9ccde"/><text x="298" y="125" font-size="21">各自的编码器</text><text x="491" y="127" font-size="28">→</text><rect x="520" y="85" width="205" height="65" rx="12" fill="#e7f2eb" stroke="#b9ccde"/><text x="538" y="125" font-size="21">投影 + 归一化</text><text x="731" y="127" font-size="28">→</text><rect x="760" y="85" width="205" height="65" rx="12" fill="#e7f2eb" stroke="#b9ccde"/><text x="778" y="125" font-size="21">同宽度向量</text><rect x="40" y="200" width="205" height="65" rx="12" fill="#e9effb" stroke="#b9ccde"/><text x="58" y="240" font-size="21">文字</text><text x="251" y="242" font-size="28">→</text><rect x="280" y="200" width="205" height="65" rx="12" fill="#e9effb" stroke="#b9ccde"/><text x="298" y="240" font-size="21">各自的编码器</text><text x="491" y="242" font-size="28">→</text><rect x="520" y="200" width="205" height="65" rx="12" fill="#e9effb" stroke="#b9ccde"/><text x="538" y="240" font-size="21">投影 + 归一化</text><text x="731" y="242" font-size="28">→</text><rect x="760" y="200" width="205" height="65" rx="12" fill="#e9effb" stroke="#b9ccde"/><text x="778" y="240" font-size="21">同宽度向量</text><text x="40" y="333" font-size="22">两组向量两两打分 → 每行选描述，每列选图片</text><text x="95" y="425" font-size="22">猫图</text><text x="95" y="510" font-size="22">狗图</text><text x="95" y="595" font-size="22">车图</text><text x="220" y="375" font-size="20">猫的描述</text><text x="370" y="375" font-size="20">狗的描述</text><text x="520" y="375" font-size="20">车的描述</text><rect x="210" y="390" width="135" height="70" rx="8" fill="#b9dfc8"/><text x="235" y="433" font-size="20">正确配对</text><rect x="360" y="390" width="135" height="70" rx="8" fill="#e5edf6"/><text x="385" y="433" font-size="20">候选分数</text><rect x="510" y="390" width="135" height="70" rx="8" fill="#e5edf6"/><text x="535" y="433" font-size="20">候选分数</text><rect x="210" y="475" width="135" height="70" rx="8" fill="#e5edf6"/><text x="235" y="518" font-size="20">候选分数</text><rect x="360" y="475" width="135" height="70" rx="8" fill="#b9dfc8"/><text x="385" y="518" font-size="20">正确配对</text><rect x="510" y="475" width="135" height="70" rx="8" fill="#e5edf6"/><text x="535" y="518" font-size="20">候选分数</text><rect x="210" y="560" width="135" height="70" rx="8" fill="#e5edf6"/><text x="235" y="603" font-size="20">候选分数</text><rect x="360" y="560" width="135" height="70" rx="8" fill="#e5edf6"/><text x="385" y="603" font-size="20">候选分数</text><rect x="510" y="560" width="135" height="70" rx="8" fill="#b9dfc8"/><text x="535" y="603" font-size="20">正确配对</text><text x="710" y="438" font-size="22">→ 按行算交叉熵</text><text x="710" y="487" font-size="22">→ 按列算交叉熵</text><text x="710" y="545" font-size="22">两者取平均</text><text x="40" y="695" font-size="20">训练：提高对角线的相对得分，梯度回传两路编码器。</text><text x="40" y="735" font-size="18">使用：图片与候选描述比较 → 检索 / 零样本分类。矩阵为流程示意，不是真实测量。</text></g></svg>